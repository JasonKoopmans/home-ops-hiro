# GitOps-managed Longhorn storage: create-default-disk=config tells Longhorn
# to build this node's disks from the default-disks-config annotation below.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: "config"
annotations:
  node.longhorn.io/default-disks-config: '[{"path": "/var/mnt/longhorn", "allowScheduling": true, "storageReserved": 0}]'
