# Step 2 of 2: re-add the etcd encryption document under the key name the
# cluster actually uses (key2), with the same secret as talsecret.sops.yaml
# (secrets.secretboxencryptionsecret). The secret is not in Git: talhelper reads
# the etcdSecretboxSecret variable from talos/talenv.sops.yaml (SOPS-encrypted,
# create it with `sops talos/talenv.sops.yaml`), and genconfig fails with
# "variable not set" when it is missing, never rendering a config without it.
# The value must be identical to talsecret.sops.yaml's; scripts/
# talos-check-etcd-encryption.sh compares the rendered key with the node's live
# one before every `task talos:apply-node`.
---
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
config:
  resources:
    - resources:
        - secrets
      providers:
        - secretbox:
            keys:
              - name: key2
                secret: ${etcdSecretboxSecret}
