---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.25.20:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.25.20"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "hiro-cmp-01"
    ipAddress: "192.168.25.21"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    # Image Factory schematic, declared inline rather than as a hardcoded
    # talosImageURL: talhelper submits this to the factory and derives the
    # installer URL itself, so the 64-char schematic ID is never hand-copied.
    # (It is a sha256 of the schematic body, so it changes whenever this list
    # does — a typed ID silently drifts, and did: cmp-05 previously carried a
    # 65-char ID the factory 404'd on.)
    #
    # iscsi-tools + util-linux-tools are both Longhorn requirements — the
    # latter provides the `fstrim` binary that Longhorn runs via `nsenter` for
    # filesystem-trim / space reclamation. qemu-guest-agent is the Proxmox
    # guest integration.
    schematic: &schematic
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/nfs-utils
            - siderolabs/qemu-guest-agent
            - siderolabs/util-linux-tools
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:4b:43:c7"
        dhcp: false
        addresses:
          - "192.168.25.21/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "192.168.25.1"
        mtu: 1500
        vip:
          ip: "192.168.25.20"
    # GitOps-managed Longhorn storage: create-default-disk=config tells Longhorn
    # to build this node's disks from the default-disks-config annotation below.
    nodeLabels:
      node.longhorn.io/create-default-disk: "config"
    nodeAnnotations:
      node.longhorn.io/default-disks-config: '[{"path": "/var/mnt/longhorn", "allowScheduling": true, "storageReserved": 0}]'
  - hostname: "hiro-cmp-02"
    ipAddress: "192.168.25.22"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    schematic: *schematic
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:1d:a0:92"
        dhcp: false
        addresses:
