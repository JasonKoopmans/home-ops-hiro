# Talos 1.14 moved the control-plane components out of the v1alpha1 `cluster:`
# block into their own documents, and refuses a config that sets both
# (".cluster.apiServer is already set in v1alpha1 config"). Only etcd is still
# configured in v1alpha1 below.
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.25.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# 192.168.25.20 is the control-plane VIP. topf does not derive these from the
# endpoint, so they are stated here.
certExtraSANs:
  - "127.0.0.1"
  - "192.168.25.20"
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: true
  default-watch-cache-size: 50
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Cilium replaces kube-proxy (kubeProxyReplacement), so it stays off.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# The cluster has never enforced Pod Security admission (the old
# `admissionControl: $patch: delete`); the 1.14 generator emits a PodSecurity
# baseline-enforce document by default, so drop it to keep that behaviour.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
# cluster.allowSchedulingOnControlPlanes: true. All five nodes are control
# plane, so workloads run on them: remove the NoSchedule taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# cluster.coreDNS.disabled: true (kubernetes/apps/kube-system/coredns runs it).
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
