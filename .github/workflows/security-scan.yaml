---
name: "Security Scan"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-job:
    name: Security Scan Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  scan:
    name: KubeLinter + Kubescape + gitleaks
    needs: pre-job
    runs-on: ubuntu-latest
    # Always run on schedule/manual dispatch; on PRs, only when kubernetes/** changed.
    if: ${{ github.event_name != 'pull_request' || needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false

      # Kubescape isn't in the shared .mise.toml — aqua's registry has no
      # linux/arm64 build for it, which broke `mise install` in the arm64
      # devcontainer. This runner is amd64-only, so install it here instead,
      # scoped to this workflow. Still goes through mise/aqua (checksum +
      # attestation verified) rather than a raw curl-to-shell script.
      - name: Install Kubescape (CI-only)
        run: |
          # renovate: datasource=github-releases depName=kubescape/kubescape
          KUBESCAPE_VERSION=4.0.12
          mise use --global "aqua:kubescape/kubescape@${KUBESCAPE_VERSION}"

      # Runs before rendering so it only ever sees committed repo content —
      # once flux-local writes rendered.yaml into the working tree, `gitleaks
      # dir .` would scan that generated artifact too (checksum/* annotations
      # in it read as high-entropy "secrets").
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        run: gitleaks dir . --config .gitleaks.toml -v 2>&1 | tee gitleaks-results.txt

      - name: Render Flux manifests (Helm-inflated)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/allenporter/flux-local:v8.0.1 \
            build all --enable-helm --output-file /workspace/rendered.yaml kubernetes/flux/cluster

      - name: Sanity-check rendered output
        run: |
          echo "rendered.yaml size: $(wc -c < rendered.yaml) bytes, $(wc -l < rendered.yaml) lines"
          echo "Resource kinds found:"
          grep -E '^kind:' rendered.yaml | sort | uniq -c | sort -rn

      # This job never decrypts SOPS (no age key here), so Flux postBuild vars
      # like ${SECRET_DOMAIN} render unresolved -- and the variable *name*
      # contains "SECRET", which trips Kubescape's naive keyword match on env
      # var values (C-0012) for every app that puts a hostname in an env var.
      # Confirmed 2026-08-07 (#403): 5 of 6 C-0012 failures on one run were
      # this artifact, not real findings. Neutralize before either scanner
      # sees it -- this can't hide a real secret, since a real secret value is
      # never present in this render to begin with.
      - name: Neutralize unresolved postBuild variable names
        run: sed -i 's/SECRET_DOMAIN/REDACTED_DOMAIN_VAR/g' rendered.yaml

      - name: Run KubeLinter
        id: kube-linter
        continue-on-error: true
        run: kube-linter lint rendered.yaml 2>&1 | tee kube-linter-results.txt

      - name: Run Kubescape (NSA framework)
        id: kubescape
        continue-on-error: true
        # --logger error: without a live cluster to query, kubescape can't resolve
        # CRD kinds (Kustomization, HelmRelease, HTTPRoute, ...) via api-resources
        # and logs a warning per resource for it — ~200 harmless lines on this repo.
        # None of those kinds carry a pod spec, so no NSA control applies to them
        # anyway; raising the log threshold drops the noise without touching the
        # actual scan results.
        # --exceptions: triaged findings (false positives, deliberate repo
        # conventions, deferred work) in security/kubescape-exceptions.json —
        # see docs/kubescape-exceptions.md.
        run: kubescape scan framework nsa rendered.yaml --exceptions security/kubescape-exceptions.json --logger error 2>&1 | tee kubescape-results.txt

      - name: Check exception expiry
        if: always()
        continue-on-error: true
        run: |
          jq -r --arg today "$(date +%F)" \
            '.[] | select(.reviewBy < $today) | "\(.name) (reviewBy \(.reviewBy))"' \
            security/kubescape-exceptions.json > expired-exceptions.txt
          if [ -s expired-exceptions.txt ]; then
            echo "## :warning: Expired Kubescape exceptions — needs re-review" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat expired-exceptions.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Security Scan Results"
            echo ""
            echo "_Report-only: findings here never fail this job or block a PR._"
            echo ""
            echo "### KubeLinter — manifest misconfigurations"
            echo '```'
            cat kube-linter-results.txt || echo "no output captured"
            echo '```'
            echo ""
            echo "### Kubescape — NSA framework compliance score"
            echo '```'
            cat kubescape-results.txt || echo "no output captured"
            echo '```'
            echo ""
            echo "### gitleaks — accidental plaintext secrets"
            echo '```'
            cat gitleaks-results.txt || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
