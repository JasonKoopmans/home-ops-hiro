---
name: "Image Vulnerability Scan"

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Render Flux manifests (Helm-inflated)
        # Retried: rendering pulls every chart from ghcr.io/other OCI registries, and
        # a single connection reset there (seen 2026-09-15 on #592) fails the whole
        # run for reasons unrelated to the change under test. A genuine render
        # error fails identically on every attempt, so it still goes red.
        run: |
          for attempt in 1 2 3; do
            rm -f rendered.yaml
            if docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              ghcr.io/allenporter/flux-local:v8.0.1 \
              build all --enable-helm --output-file /workspace/rendered.yaml kubernetes/flux/cluster; then
              exit 0
            fi
            echo "::warning::flux-local render failed (attempt ${attempt}/3)"
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error::flux-local render failed after 3 attempts"
          exit 1

      - name: Sanity-check rendered output
        run: |
          echo "rendered.yaml size: $(wc -c < rendered.yaml) bytes, $(wc -l < rendered.yaml) lines"

      - name: Extract referenced container images
        run: |
          grep -E '^\s*image:\s*' rendered.yaml \
            | awk -F': ' '{print $2}' \
            | sed -E 's/^["'\'']//; s/["'\'']$//' \
            | sort -u > images.txt
          echo "Found $(wc -l < images.txt) unique image references"

      - name: Scan each image with Trivy
        continue-on-error: true
        run: |
          {
            echo "## Image Vulnerability Scan Results"
            echo ""
            echo "_Report-only: findings here never fail this job._"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r img; do
            [ -z "$img" ] && continue
            {
              echo ""
              echo "### \`$img\`"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            trivy image --exit-code 0 --format table "$img" >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "scan failed for $img" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done < images.txt
