name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # claude-code-action rejects bot-authored PRs, so every Renovate PR failed here.
    # Dependency bumps are covered by Flux Local and the scan workflows.
    if: github.actor != 'renovate[bot]'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The stock code-review plugin spent half its agents on CLAUDE.md compliance and told
          # the rest to ignore anything input-dependent, which suits an app repo, not a cluster.
          # What to look for now lives in .github/review-checklist.md; edit that, not this.
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            1. Read .github/review-checklist.md and follow it, including its priorities and output format.
            2. Get the diff with `gh pr diff` and the description with `gh pr view`. The checkout is shallow,
               so use the diff, not git history, to see what changed.
            3. Read the changed files in full and the files they depend on (the app's ks.yaml and
               kustomization.yaml, the chart's values, related docs/ pages) before judging a risk.
            4. Post findings as inline comments with mcp__github_inline_comment__create_inline_comment.
               If there are no findings, post nothing.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

