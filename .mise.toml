[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
"python" = "3.15.1"
"pipx" = "1.18.4"
"pipx:makejinja" = "2.9.1"
"aqua:postfinance/topf" = "0.6.2"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.102.0"
"aqua:cloudflare/cloudflared" = "2026.10.4"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:kubernetes/kubectl" = "1.34.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:a8m/envsubst" = "1.4.3"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:junegunn/fzf" = "0.74.5"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zricethezav/gitleaks" = "8.30.1"
"aqua:stackrox/kube-linter" = "0.8.3"
"aqua:aquasecurity/trivy" = "0.76.1"
"aqua:open-policy-agent/conftest" = "0.71.1"
# allow_builds: mise skips npm lifecycle scripts by default, and claude-code's postinstall is what
# swaps the native binary in over its bin/claude.exe stub ("claude native binary not installed").
"npm:@anthropic-ai/claude-code" = { version = "2.1.310", allow_builds = ["@anthropic-ai/claude-code"] }
node = "26.12.1"
"aqua:aws/aws-cli" = { version = "2.38.5", symlink_bins = "true" }
