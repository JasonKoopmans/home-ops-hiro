[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
"python" = "3.15.2"
"pipx" = "1.18.19"
"pipx:makejinja" = "2.9.2"
"aqua:postfinance/topf" = "0.6.2"
"aqua:cilium/cilium-cli" = "0.20.3"
"aqua:cli/cli" = "2.104.0"
"aqua:cloudflare/cloudflared" = "2026.11.1"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:kubernetes/kubectl" = "1.34.0"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:siderolabs/talos" = "1.14.6"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:a8m/envsubst" = "1.4.3"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:sharkdp/fd" = "10.5.2"
"aqua:junegunn/fzf" = "0.75.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zricethezav/gitleaks" = "8.30.1"
"aqua:stackrox/kube-linter" = "0.8.3"
"aqua:aquasecurity/trivy" = "0.76.2"
"aqua:open-policy-agent/conftest" = "0.71.1"
# allow_builds: mise skips npm lifecycle scripts by default, and claude-code's postinstall is what
# swaps the native binary in over its bin/claude.exe stub ("claude native binary not installed").
"npm:@anthropic-ai/claude-code" = { version = "2.1.330", allow_builds = ["@anthropic-ai/claude-code"] }
node = "26.13.1"
"aqua:aws/aws-cli" = { version = "2.40.3", symlink_bins = "true" }
# KRR (robusta-dev/krr) right-sizing CLI. Not on PyPI or in aqua, and its release binaries are linux/amd64 only
# (no arm64 for the devcontainer), so pipx installs the git tag. Renovate bumps `version` as a github-tags dependency.
# - python: KRR's pyproject caps Python at <=3.12.9 and 3.15.2 is too new. mise installs this one beside the default
#   and uses it only for krr. It must be a patch <=3.12.9 ("3.12" resolves to 3.12.16 and pipx refuses it). Re-check
#   the cap in KRR's pyproject.toml when bumping.
# - pipx_args: KRR's pyproject leaves its dependencies loose, so a fresh resolve installs a `krr` that crashes on
#   import. cachetools is imported but undeclared (its lockfile gets it through google-auth, a fresh resolve does
#   not), and typer 0.7 fails on click >= 8.2 ("Secondary flag is not valid for non-boolean flag"). Drop a pin once
#   a KRR release declares or fixes it.
"pipx:git+https://github.com/robusta-dev/krr.git" = { version = "v1.31.3", python = "3.12.9", pipx_args = "--preinstall cachetools --preinstall click<8.2" }
