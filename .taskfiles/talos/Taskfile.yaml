---
version: '3'

tasks:

  generate-config:
    desc: Generate Talos configuration
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper genconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - sh: test -f {{.TALOS_DIR}}/talenv.sops.yaml
        msg: >-
          talos/talenv.sops.yaml is missing. It must hold etcdSecretboxSecret (the value of
          secrets.secretboxencryptionsecret in talsecret.sops.yaml), which the
          etcd-encryption patches in talos/patches/global/ render under the key name key2;
          create it with `sops talos/talenv.sops.yaml`. Without it the generated config would
          use a key name the running kube-apiserver cannot decrypt.
      - which talhelper

  # An apply restarts the kubelet and the control-plane static pods on the node and
  # moves the VIP if the node holds it. For a changed config try `MODE=try
  # TIMEOUT=5m` first (it reverts by itself after TIMEOUT, default 1m) and confirm
  # kube-apiserver answers /readyz on the node before a real apply. The etcd-key
  # check below is what catches an apiserver that cannot decrypt Secrets; it runs
  # in every mode.
  apply-node:
    desc: Apply Talos config to a node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '{{.SCRIPTS_DIR | shellQuote}}/talos-check-etcd-encryption.sh {{.IP}} {{.NODE_CONFIG | shellQuote}}'
      - talhelper gencommand apply --node {{.IP}} --extra-flags '--mode={{.MODE}}{{if .TIMEOUT}} --timeout={{.TIMEOUT}}{{end}}' | bash
    vars:
      MODE: '{{.MODE | default "auto"}}'
      # Absolute path of the generated config for this node. Dynamic variables run from
      # the Taskfile's directory, not from `dir` above, hence the explicit cd.
      NODE_CONFIG:
        sh: |
          cd {{.TALOS_DIR | shellQuote}}
          host=$(yq '.nodes[] | select(.ipAddress == "{{.IP}}") | .hostname' talconfig.yaml)
          if [ -z "$host" ]; then echo "no node with ipAddress {{.IP}} in talos/talconfig.yaml" >&2; exit 1; fi
          echo "$PWD/clusterconfig/$(yq '.clusterName' talconfig.yaml)-$host.yaml"
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  # Consider `task alerts:silence` first (repo root Taskfile) so the reboot
  # this triggers doesn't page Telegram via KubeNodeNotReady/Unreachable.
  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper gencommand upgrade --node {{.IP}} --extra-flags "{{.UPGRADE_FLAGS}}" | bash
    vars:
      UPGRADE_FLAGS: '--timeout=10m{{if .DRAIN}} --drain={{.DRAIN}}{{end}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talhelper talosctl yq

  # Consider `task alerts:silence` first (repo root Taskfile) — a k8s upgrade
  # rolls control-plane components and can trip KubeAPIInstanceUnreachable/
  # etcd* alerts.
  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper gencommand upgrade-k8s --extra-flags "--to '{{.KUBERNETES_VERSION}}'" | bash
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/talenv.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: talhelper gencommand reset --extra-flags="--reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false" | bash
    preconditions:
      - which talhelper
