---
version: '3'

tasks:

  # UNTESTED against fresh nodes: this path only runs on nodes in maintenance
  # mode, and has not been exercised since the move from talhelper to topf. Try
  # it on a scratch node first. `topf secrets` prints the whole bundle, unredacted,
  # to stdout, hence the redirect.
  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '[ -f secrets.sops.yaml ] || topf secrets --confirm=false >/dev/null'
      - mkdir -p clusterconfig && topf talosconfig > clusterconfig/talosconfig
      - topf apply --auto-bootstrap --confirm=false
      - until topf kubeconfig > {{.ROOT_DIR | shellQuote}}/kubeconfig; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR | shellQuote}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE | shellQuote}}
      - test -f {{.TALOS_DIR | shellQuote}}/topf.yaml
      - which topf talosctl sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
