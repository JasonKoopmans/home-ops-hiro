---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: renovate-exporter-script
    files:
      - exporter.py
generatorOptions:
  # Fixed name so the HelmRelease can mount it; the Reloader annotation on the
  # controller restarts the pod when the script changes.
  disableNameSuffixHash: true
