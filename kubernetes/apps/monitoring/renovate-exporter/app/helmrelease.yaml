---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-exporter
  interval: 1h
  values:
    controllers:
      renovate-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine
            command: ["python", "/app/exporter.py"]
            env:
              GITHUB_REPO: JasonKoopmans/home-ops-hiro
              # Reads of a public repo need no token. Unauthenticated limits
              # (60 core requests/hour, 10 search requests/minute, per egress IP) are far
              # above one poll of 3 requests every 5 minutes.
              POLL_INTERVAL_SECONDS: "300"
              PORT: &port 9100
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # Unmeasured guess for a new workload (a stdlib python HTTP server
            # idles in the low tens of Mi); revisit against the 14d peak once it
            # has run (copilot-instructions.md, Resource Requests & Limits).
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 96Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        controller: renovate-exporter
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: renovate-exporter
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
    persistence:
      script:
        type: configMap
        name: renovate-exporter-script
        globalMounts:
          - path: /app
            readOnly: true
