---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-exporter
  interval: 1h
  values:
    controllers:
      renovate-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine
            command: ["python", "/app/exporter.py"]
            env:
              GITHUB_REPO: JasonKoopmans/home-ops-hiro
              # Reads of a public repo need no token. One poll is 4 requests (2 core:
              # open and closed pulls; 2 search). Every 15 minutes that is 8 of the 60
              # unauthenticated core requests an hour. The limit is per egress IP, so it
              # is shared with anything else on the home network that calls
              # api.github.com unauthenticated (gh, mise installs, helm pulls). Nothing
              # here needs fresher data: the merge wave is weekly and the alerts use 2h
              # and 10d windows. If 403s show up in the pod logs, wire GITHUB_TOKEN
              # (read by exporter.py) from a SOPS Secret.
              POLL_INTERVAL_SECONDS: "900"
              PORT: &port 9100
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # Unmeasured guess for a new workload (a stdlib python HTTP server
            # idles in the low tens of Mi); revisit against the 14d peak once it
            # has run (copilot-instructions.md, Resource Requests & Limits).
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 96Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        controller: renovate-exporter
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: renovate-exporter
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
    persistence:
      script:
        type: configMap
        name: renovate-exporter-script
        globalMounts:
          - path: /app
            readOnly: true
