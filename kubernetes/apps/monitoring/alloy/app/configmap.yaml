---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    // File-based tailing of /var/log/pods with on-disk positions.
    // Replaces loki.source.kubernetes (API tailer) which kept its read
    // position only in memory and, on every send failure, re-tailed from the
    // earliest container-runtime-retained line. For low-volume long-lived pods
    // that line is >7d old, so Loki (reject_old_samples_max_age: 168h) rejected
    // it, the send failed, and it re-read the same old region forever.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Preserve the label schema the old loki.source.kubernetes emitted so
      // existing Grafana queries keep working: instance="<ns>/<pod>:<container>".
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "instance"
      }
      rule {
        source_labels = ["instance", "__meta_kubernetes_pod_container_name"]
        separator     = ":"
        target_label  = "instance"
      }
      rule {
        action       = "replace"
        target_label = "job"
        replacement  = "loki.source.kubernetes.pods"
      }

      // Directory uid on the node. Static pods (Talos runs kube-apiserver,
      // -controller-manager and -scheduler this way) are discovered through
      // their API *mirror* pod, whose metadata.uid is NOT what the kubelet names
      // the log directory after: that is the static pod's own uid, which the
      // mirror carries in the kubernetes.io/config.hash annotation. Using the
      // mirror uid matched no files, so control-plane logs never reached Loki
      // (checked 2026-10-25: no kube-system/kube-apiserver-* stream in 7d).
      // Prefer the hash when present; ordinary pods have no such annotation, so
      // the second rule does not match and the first value stands.
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "__tmp_log_uid"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_kubernetes_io_config_hash"]
        regex         = "(.+)"
        replacement   = "$1"
        target_label  = "__tmp_log_uid"
      }

      // /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
      rule {
        source_labels = ["__tmp_log_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }

      // Container runtime, used to gate CRI parsing below; dropped before write.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        regex         = "^(\\S+):\\/\\/.+$"
        replacement   = "$1"
        target_label  = "tmp_container_runtime"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      // Recover the real log timestamp + stream from the CRI-format line.
      stage.match {
        selector = "{tmp_container_runtime=\"containerd\"}"
        stage.cri {}
      }

      // Drop Loki's own per-query chatter. Measured 2026-10-25: loki-0 was
      // ~520MB/day and loki-gateway's nginx ~75MB/day of a ~700MB/day total
      // (~85%), none of it diagnostic. Every query (the loki-canary alone issues
      // one every few seconds) writes a ~1.3KB metrics.go query-stats line plus
      // table_manager/engine/roundtrip/index_set bookkeeping, all level=info;
      // the gateway logs one access line per canary push. Warn/error lines,
      // compactor/ingester/ruler info and non-2xx gateway responses still flow.
      // Dropped here, not in Loki, so Loki's own log_level stays at its default.
      stage.match {
        selector = "{instance=\"monitoring/loki-0:loki\"} |~ \"level=info .*caller=(metrics|table_manager|engine|roundtrip|index_set)[.]go\""
        action   = "drop"
      }
      stage.match {
        selector = "{instance=~\"monitoring/loki-gateway-.*:nginx\"} |~ \"[]] +2[0-9][0-9] \""
        action   = "drop"
      }

      // Loki's own detected_level heuristic only recognizes a fixed set of
      // JSON key names (level/severity/lvl) and, once a line parses as JSON
      // at all, never falls back to scanning the raw text for a level word.
      // .NET's default console JSON formatter (used by pocket-bridge,
      // recording-annotator) logs `{"LogLevel":"Information",...}` -- a key
      // Loki doesn't know -- so every line was landing as detected_level
      // "unknown" despite carrying a perfectly good level. Extract it
      // ourselves and hand it to Loki as structured metadata, which Loki
      // uses verbatim instead of guessing.
      //
      // A stage.json parse failure on the many non-JSON pods in the cluster
      // just leaves extracted_level empty (sets the internal __error__
      // label, which is never sent to Loki) -- harmless, and
      // stage.structured_metadata below skips empty values, so this doesn't
      // add a level to streams that never had one.
      // klog (Kubernetes control plane and many operators) puts severity in a
      // leading letter -- `E1026 01:16:16.291665       1 file.go:177] msg` --
      // which neither the JSON path below nor Loki's heuristic reads, so every
      // such line was detected_level "unknown". Map I/W/E/F onto the same
      // extracted_level the JSON stage fills; non-klog lines leave it empty and
      // the JSON stage (or nothing) decides, as before.
      stage.regex {
        expression = "^(?P<klog_level>[IWEF])[0-9]{4} "
      }
      stage.template {
        source   = "extracted_level"
        template = "{{ if eq .klog_level \"I\" }}info{{ else if eq .klog_level \"W\" }}warn{{ else if eq .klog_level \"E\" }}error{{ else if eq .klog_level \"F\" }}fatal{{ end }}"
      }
      stage.json {
        expressions = {
          extracted_level = "level || Level || LEVEL || severity || Severity || LogLevel || lvl",
        }
      }
      // Normalize casing and spell out the .NET LogLevel names Loki doesn't
      // already treat as synonyms, so Explore's level filter/colors line up
      // with logfmt/JSON loggers using the short forms.
      stage.template {
        source   = "extracted_level"
        template = "{{ ToLower .Value }}"
      }
      stage.replace {
        source     = "extracted_level"
        expression = "^information(al)?$"
        replace    = "info"
      }
      stage.replace {
        source     = "extracted_level"
        expression = "^warning$"
        replace    = "warn"
      }
      stage.replace {
        source     = "extracted_level"
        expression = "^critical$"
        replace    = "fatal"
      }
      stage.structured_metadata {
        values = {
          level = "extracted_level",
        }
      }

      // Drop helper labels so streams match the previous schema exactly
      // (filename is added automatically by loki.source.file).
      stage.label_drop {
        values = ["tmp_container_runtime", "filename"]
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.relabel "syslog_labels" {
      forward_to = [loki.write.default.receiver]

      rule {
        action        = "replace"
        source_labels = ["__syslog_connection_ip_address"]
        target_label  = "source_ip"
      }

      rule {
        action        = "replace"
        source_labels = ["__syslog_message_hostname"]
        target_label  = "hostname"
      }

      rule {
        action        = "replace"
        source_labels = ["__syslog_message_app_name"]
        target_label  = "app_name"
      }

      rule {
        action        = "replace"
        source_labels = ["__syslog_message_severity"]
        target_label  = "severity"
      }

      rule {
        action        = "replace"
        source_labels = ["__syslog_message_facility"]
        target_label  = "facility"
      }
    }

    loki.source.syslog "syslog" {
      relabel_rules = loki.relabel.syslog_labels.rules
      listener {
        address  = "0.0.0.0:5143"
        protocol = "udp"
        labels   = {
          job = "syslog",
        }
      }
      forward_to = [loki.process.syslog.receiver]
    }

    // OPNsense filterlog (pf) lines are CSV with no app text in the line:
    //   rule,sub,anchor,tracker,INTERFACE,reason,ACTION,DIR,IPVER,...
    // Arrived 2026-10-25 once gw01 got a second remote destination limited to
    // application filterlog at level info. Measured then: ~4000 lines per 30
    // minutes, ~71% of them `pass` (outbound pass rules are logged), and almost
    // all the blocks inbound on the LAN interface.
    //
    // Policy: keep the blocks as log lines (they are the events worth reading),
    // count every action as a metric (rates, not lines, are what you alert on),
    // and drop the passes after counting. Other syslog apps pass through
    // untouched.
    loki.process "syslog" {
      stage.match {
        selector = "{app_name=\"filterlog\"}"

        stage.regex {
          expression = "^(?:[^,]*,){4}(?P<fw_interface>[^,]*),[^,]*,(?P<fw_action>[^,]*),(?P<fw_dir>[^,]*),(?P<fw_ipver>[46]),"
        }
        // Low-cardinality labels so blocks can be filtered without a regexp.
        // action must be one: a stage.metrics counter is labelled by the
        // entry's label set, not by extracted values, so without it blocks and
        // passes cannot be told apart. After the drop below the stream's
        // action is always "block".
        stage.labels {
          values = {
            interface = "fw_interface",
            dir       = "fw_dir",
            action    = "fw_action",
          }
        }
        // source_ip is the Envoy pod the UDP route came through, not the
        // firewall (hostname is); it only fragments the stream.
        stage.label_drop {
          values = ["source_ip"]
        }
        // Exposed on Alloy's own /metrics as
        // loki_process_custom_opnsense_filterlog_lines_total.
        stage.metrics {
          metric.counter {
            name        = "opnsense_filterlog_lines_total"
            description = "OPNsense filterlog lines seen, by interface, direction and pf action."
            source      = "fw_action"
            prefix      = ""
            action      = "inc"
            match_all   = true
          }
        }
      }

      // Counted above, now discard. A `pass` is the 7th CSV field.
      stage.match {
        selector = "{app_name=\"filterlog\"} |~ \"^([^,]*,){6}pass,\""
        action   = "drop"
      }

      // Inbound blocks on the WAN interface are internet background scanning:
      // ~24k lines/day of ~39k block lines (2026-10-27), none of them actionable
      // one by one. They are already counted (interface/dir/action) above, so
      // keep a 1-in-20 sample for "what are they probing" and drop the rest.
      // Blocks on every internal interface, and outbound WAN blocks, are kept
      // whole: those are the ones that mean a LAN device tried something.
      // igb0 is the WAN port on gw01 (outbound passes appear there, inbound
      // blocks carry the public address); if the port is renumbered, change it
      // here or the sample silently applies to the wrong interface.
      stage.match {
        selector = "{app_name=\"filterlog\", interface=\"igb0\", dir=\"in\"}"

        stage.sampling {
          rate                = 0.05
          drop_counter_reason = "wan_inbound_block_sample"
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
