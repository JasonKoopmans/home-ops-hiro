---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: recording-annotator-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: recording-annotator.rules
      rules:
        # These rules used to be `kube_job_failed{job_name=~"...-.*"} > 0`, which keys on the *existence* of a
        # failed Job object rather than on any recent event. Combined with failedJobsHistory: 3 and no
        # ttlSecondsAfterFinished, Kubernetes retained the failed Jobs indefinitely, so the alerts latched on
        # permanently: three transient failures on 2026-08-01 kept a critical firing for a week and it could only
        # be cleared by deleting the Job objects by hand. An alert that cannot resolve itself trains you to ignore
        # the channel. Both replacements below are self-clearing, and neither depends on the TTL now set on the
        # CronJobs for its correctness.
        #
        # index-backup and reconciliation are re-keyed onto kube_cronjob_status_last_successful_time — the
        # CronJob's own status, via kube-state-metrics. That is a deliberately *different* data path from the
        # `recording_annotator_*_timestamp_seconds` app gauges that the *Stale rules below read: those gauges come
        # from the app's own ServiceMonitor, and if that scrape breaks the *Stale expressions go empty and stop
        # alerting silently. Thresholds here are looser and severities lower than the paired *Stale rule on
        # purpose — the app gauge stays the primary signal, this is the independent corroboration that keeps
        # working when the app gauge does not.
        - alert: RecordingAnnotatorIndexBackupNotSucceeding
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="recording-annotator-index-backup"} > 10800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RecordingAnnotator index backup CronJob has no recent successful run
            description: The recording-annotator-index-backup CronJob has not recorded a successful Job in over 3 hours against an hourly schedule (docs/backup-recovery.md §5). If RecordingAnnotatorIndexBackupStale is silent while this fires, suspect the app's metrics scrape rather than the backup itself.

        - alert: RecordingAnnotatorReconciliationNotSucceeding
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="recording-annotator-reconciliation"} > 172800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RecordingAnnotator reconciliation CronJob has no recent successful run
            description: The recording-annotator-reconciliation CronJob has not recorded a successful Job in over 48 hours against a daily schedule (docs/backup-recovery.md §7).

        # Fast signal. Keyed on the failed Job but bounded by recency so it self-clears 7 days after the failure
        # whether or not the Job object still exists — the latching failure mode that kept a critical firing for a
        # week in August 2026 (see the header comment above). 7 days suits a monthly cadence: long enough to be
        # seen, short enough to stop nagging.
        #
        # This rule originally stood alone because the drill had never once succeeded, so
        # kube_cronjob_status_last_successful_time did not exist for it at all and a last-success-age rule would
        # have evaluated empty and never fired. That premise held only until the drill's first success, on or
        # around 2026-08-13 — the series exists now, so the staleness rule below closes the gap this one cannot
        # see: a suspended or deleted CronJob, a scheduler problem, or node pressure preventing Job creation ever
        # produces a Job to fail in the first place.
        - alert: RecordingAnnotatorRestoreDrillJobFailed
          expr: |
            kube_job_failed{namespace="default", job_name=~"recording-annotator-restore-drill-.*"} > 0
            and on (namespace, job_name)
            (time() - kube_job_created{namespace="default", job_name=~"recording-annotator-restore-drill-.*"} < 604800)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator monthly restore drill failed
            description: The recording-annotator-restore-drill CronJob failed — the offsite index backup could NOT be proven restorable this month (docs/backup-recovery.md §7, §9 phase 4). Treat the index backup as unverified until this is fixed and re-run.

        # Slow signal, different failure shape: catches a drill that silently stops running at all — suspended
        # CronJob, deleted CronJob, scheduler wedged, node pressure preventing the Job from ever being created.
        # RecordingAnnotatorRestoreDrillJobFailed cannot see any of those, because no Job object is ever produced
        # to fail. 61 days is ~2x the monthly cadence (mirrors the 2x-interval shape used by
        # RecordingAnnotatorReconciliationNotSucceeding above), tolerating exactly one missed monthly run.
        - alert: RecordingAnnotatorRestoreDrillNotSucceeding
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="recording-annotator-restore-drill"} > 5270400
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator restore drill has no recent successful run
            description: No successful monthly restore drill in over 61 days. The offsite index backup is unverified — nothing has proven it restorable recently, which is the state this drill exists to prevent.

        # The rule above evaluates *empty*, and therefore never fires, until the drill has succeeded at least
        # once — precisely the state a freshly created or recreated CronJob is in, and precisely when a broken
        # drill matters most. Same shape as PostgresRestoreDrillNeverSucceeded.
        #
        # The age test uses kube_cronjob_created rather than a long `for:`, deliberately: `for:` state is held in
        # memory and RESETS on a Prometheus restart, so a `for: 32d` on a server that restarts for config reloads
        # and upgrades would in practice almost never reach 32 days — the alert would look correct and silently
        # never fire. Reading the CronJob's own creation timestamp is stateless and survives restarts, so the
        # short `for:` here only debounces scrape flapping.
        #
        # 2764800s (32 days) covers the worst case for a schedule fixed to the 1st of the month: the longest gap
        # between two consecutive 1st-of-month dates is 31 days (e.g. Jan 1 -> Feb 1), so a CronJob created just
        # after missing that month's run waits up to 31 days for its first scheduled attempt; the extra day is
        # buffer for the Job to run and be scraped.
        - alert: RecordingAnnotatorRestoreDrillNeverSucceeded
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="default", cronjob="recording-annotator-restore-drill"})
            and on()
            (time() - max(kube_cronjob_created{namespace="default", cronjob="recording-annotator-restore-drill"}) > 2764800)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator restore drill has never completed successfully
            description: No successful run of recording-annotator-restore-drill has ever been recorded, over at least 32 days of a monthly schedule. Expected briefly right after first deploy; if it persists, the offsite index backup has never been proven restorable by automation at all.

        # Closes the hole the three rules above share: all key on series that only exist WHILE the CronJob exists.
        # Delete the CronJob and `JobFailed` has no Jobs to match, `NotSucceeding` and `NeverSucceeded` both lose
        # the kube_cronjob_created/last-success series they depend on — so the drill stops running AND every alert
        # about it not running goes quiet at the same moment. That is the silent-failure shape this whole app
        # exists to prevent, so it gets its own detector, same as PostgresRestoreDrillCronJobMissing in
        # prometheusrule-postgres.yaml.
        - alert: RecordingAnnotatorRestoreDrillCronJobMissing
          expr: absent(kube_cronjob_created{namespace="default", cronjob="recording-annotator-restore-drill"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator restore-drill CronJob does not exist
            description: The recording-annotator-restore-drill CronJob is absent from the default namespace. No restore drills will run, and the other drill alerts are silent because they key on series this object produces. Either Flux has not reconciled it yet (expected briefly after first deploy), or it was removed. Restore it — an unverified backup is the failure mode this app exists to catch.

        # Gauges set on the live app process, scraped via the app's ServiceMonitor (spec section 9) — not from
        # the CronJob trigger containers themselves.
        - alert: RecordingAnnotatorReconciliationDanglingReferences
          expr: recording_annotator_reconciliation_dangling_references > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator has dangling artifact references
            description: "{{ $$value }} artifact(s) reference a MinIO object that does not exist. Write-order (docs/backup-recovery.md §4) makes this impossible in normal operation — treat as a real bug or a replication gap, i.e. broken playback."

        - alert: RecordingAnnotatorOrphanObjectsHigh
          expr: recording_annotator_reconciliation_orphan_objects > 50
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: RecordingAnnotator has a growing number of orphan blobs
            description: "{{ $$value }} MinIO objects have no owning artifact past the grace window (docs/backup-recovery.md §7) — expected to be small; a persistently high count is wasted space worth investigating."

        # The `> 0` guard on both staleness rules is load-bearing. AppMetrics declares these with prometheus-net's
        # Metrics.CreateGauge, which publishes the series immediately at 0 — so a bare
        # `time() - <gauge> > threshold` evaluates to ~1.7e9 the moment the pod starts and would fire on every
        # rollout, before the first scheduled run could possibly have happened. The paired *NeverSucceeded rules
        # close the hole that guard opens: a gauge pinned at 0 means the job has never once succeeded, which must
        # still page. Those lean on `for:` rather than a range-vector window because `for:` requires the condition
        # to hold for real elapsed time, which is what makes them behave correctly on a fresh install instead of
        # firing against a window that is not full yet. Caveat: a Prometheus restart resets `for:` state, so a
        # long-pending one starts its clock over.
        - alert: RecordingAnnotatorIndexBackupStale
          expr: |
            recording_annotator_index_snapshot_timestamp_seconds > 0
            and time() - recording_annotator_index_snapshot_timestamp_seconds > 5400
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator index backup has not run recently
            description: No successful index snapshot in over 90 minutes despite an hourly schedule — the backup pipeline may have silently stopped (docs/backup-recovery.md §5), which is exactly the failure mode an untested backup hides.

        - alert: RecordingAnnotatorIndexBackupNeverSucceeded
          expr: recording_annotator_index_snapshot_timestamp_seconds == 0
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator has never completed an index backup
            description: The index snapshot timestamp has been zero for 3 hours against an hourly schedule, so no snapshot has ever succeeded on this app instance. Briefly expected right after a first deploy; if it persists, the offsite index backup does not exist at all.

        - alert: RecordingAnnotatorReconciliationStale
          expr: |
            recording_annotator_reconciliation_timestamp_seconds > 0
            and time() - recording_annotator_reconciliation_timestamp_seconds > 129600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RecordingAnnotator reconciliation audit has not run recently
            description: No successful reconciliation audit in over 36 hours despite a daily schedule — the dangling/orphan gauges above are no longer trustworthy (docs/backup-recovery.md §7).

        - alert: RecordingAnnotatorReconciliationNeverSucceeded
          expr: recording_annotator_reconciliation_timestamp_seconds == 0
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: RecordingAnnotator has never completed a reconciliation audit
            description: The reconciliation timestamp has been zero for 26 hours against a daily schedule, so the audit has never succeeded on this app instance. The dangling-reference and orphan-object gauges read zero because nothing has ever measured them, not because the store is clean.

    # The dedicated Minio instance backing this app. The existing prometheusrule-minio.yaml rules are scoped to
    # the shared instance (`up{job="minio"}`, `pod=~"minio-.*"`) and do not match `recording-annotator-minio-*`,
    # so without this group the store holding every recording has no availability or replication alerting at all.
    - name: recording-annotator-minio.rules
      rules:
        - alert: RecordingAnnotatorMinioDown
          # Job label comes from the chart's Probe (jobName: recording-annotator-minio) and node ServiceMonitor;
          # confirm against `up{job=~"recording-annotator-minio.*"}` after the first scrape.
          expr: up{job=~"recording-annotator-minio.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator's Minio instance is down
            description: Target {{ $$labels.instance }} has been unreachable for 10 minutes. Media upload and playback are both broken while this is true.

        - alert: RecordingAnnotatorMinioPodNotReady
          expr: |
            sum(kube_pod_status_ready{namespace="storage", condition="true", pod=~"recording-annotator-minio-.*"}) < 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator's Minio pod is not ready
            description: No ready recording-annotator-minio pod in the storage namespace for 10 minutes.

        # Media has no Longhorn backup by design — the hourly `mc mirror` CronJob
        # (recording-annotator-mirror-cronjob.yaml) is the only offsite protection. Both rules below key on the
        # CronJob's last-success timestamp via kube-state-metrics so a stuck or never-run mirror is caught early.
        #
        # An alert keyed on absence would have been the wrong shape: absent() on a metric that never exists fires
        # forever and cannot self-clear. Both rules use kube_cronjob_status_last_successful_time instead.
        - alert: RecordingAnnotatorMediaMirrorNotSucceeding
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="storage", cronjob="recording-annotator-media-mirror"} > 10800
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator media mirror to S3 has no recent successful run
            description: The recording-annotator-media-mirror CronJob has not recorded a successful run in over 3 hours against an hourly schedule. Recently uploaded recordings are not reaching the Object-Locked S3 bucket, and the source PVC is on longhorn-2-no-backup — this mirror is their only offsite copy.

        # Separate rule because the one above evaluates empty, and so never fires, until the CronJob has succeeded
        # at least once — the state a fresh deploy or a rebuilt instance starts in, and precisely when a silent
        # failure matters most. `absent()` is safe here in a way it was not for the replication metrics: this
        # series does appear as soon as the first run succeeds, so the alert can resolve.
        - alert: RecordingAnnotatorMediaMirrorNeverSucceeded
          expr: absent(kube_cronjob_status_last_successful_time{namespace="storage", cronjob="recording-annotator-media-mirror"})
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: RecordingAnnotator media mirror to S3 has never completed
            description: No successful run of recording-annotator-media-mirror has ever been recorded, over at least 3 hours of an hourly schedule. Expected briefly after a first deploy; if it persists the recordings have NO offsite copy at all. Check the Job logs for credential or bucket errors.
