---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-and-host-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: longhorn.rules
      rules:
        - alert: LonghornManagerDown
          expr: up{job="longhorn-backend"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Longhorn manager target is down
            description: Longhorn manager target {{ $$labels.instance }} has been down for more than 10 minutes.

        - alert: LonghornNodeNotReady
          expr: max by (node) (longhorn_node_status{condition="ready"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Longhorn node is not ready
            description: Longhorn node {{ $$labels.node }} has reported not ready for more than 10 minutes.

        # longhorn_volume_robustness is one-hot: Longhorn emits a series per
        # state (healthy / degraded / faulted / unknown) and sets exactly one of
        # them to 1. This alert used to read `{state="healthy"} == 0`, i.e. "not
        # healthy" — which also matches `unknown`, and `unknown` is what Longhorn
        # reports for any *detached* volume. That is the normal, correct state
        # for an app that is deliberately not running: every KEDA scale-to-zero
        # app (audacity today; freecad and others behind it, see
        # docs/ephemeral-apps-keda.md) detaches its volume when it scales down
        # and fires a permanent critical alert 10m later.
        #
        # Alerting on the two states that actually mean replica loss fixes that
        # for every such app at once, with no allowlist of "expected down" apps
        # to maintain — a list that would go stale the first time an app is wired
        # to KEDA or unwired from it, and that would also mute a real fault on a
        # scaled-down app. Degraded/faulted are reported whether the volume is
        # attached or not, so nothing is lost by ignoring `unknown`: a volume
        # that should be attached and isn't shows up as its workload failing
        # (KubeDeploymentReplicasMismatch / KubePodNotReady), not as a storage
        # alert. Still critical, and still the one alert that must never be
        # inhibited during a Longhorn outage — see alertmanagerconfig.yaml.
        - alert: LonghornVolumeUnhealthy
          expr: max by (pvc, pvc_namespace) (longhorn_volume_robustness{state=~"degraded|faulted"}) == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Longhorn volume is unhealthy
            description: Longhorn volume {{ $$labels.pvc }} in namespace {{ $$labels.pvc_namespace }} has lost replicas (degraded or faulted).

        - alert: LonghornVolumeUsageHigh
          expr: 100 * max by (pvc, pvc_namespace) (longhorn_volume_actual_size_bytes) / clamp_min(max by (pvc, pvc_namespace) (longhorn_volume_capacity_bytes), 1) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn volume usage is high
            description: Longhorn volume {{ $$labels.pvc }} in namespace {{ $$labels.pvc_namespace }} is above 85% used. Currently {{ $$value | printf "%.1f" }}%.

        - alert: LonghornNodeStoragePressure
          expr: 100 * max by (node) (longhorn_node_storage_usage_bytes) / clamp_min(max by (node) (longhorn_node_storage_capacity_bytes) - max by (node) (longhorn_node_storage_reservation_bytes), 1) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn node storage pressure is high
            description: Longhorn node {{ $$labels.node }} is above 85% of usable storage capacity. Currently {{ $$value | printf "%.1f" }}%.

        - alert: LonghornInstanceManagerUnschedulable
          expr: max_over_time(kube_pod_status_unschedulable{namespace="storage", pod=~"instance-manager-.*"}[10m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Longhorn instance manager is unschedulable
            description: Longhorn instance-manager pod {{ $$labels.pod }} in {{ $$labels.namespace }} has been unschedulable for at least 10 minutes.

        - alert: NodeCpuRequestsHigh
          expr: |
            100 *
            (
              sum by (node) (
                kube_pod_container_resource_requests{resource="cpu", unit="core"}
                * on (namespace, pod) group_left(node)
                kube_pod_info
              )
              /
              clamp_min(max by (node) (kube_node_status_allocatable{resource="cpu", unit="core"}), 1)
            ) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node CPU requests are high
            description: Node {{ $$labels.node }} has CPU requests above 85% of allocatable for more than 10 minutes, which can block scheduling for critical pods. Currently {{ $$value | printf "%.1f" }}%.

        - alert: NodeCpuRequestsCritical
          expr: |
            100 *
            (
              sum by (node) (
                kube_pod_container_resource_requests{resource="cpu", unit="core"}
                * on (namespace, pod) group_left(node)
                kube_pod_info
              )
              /
              clamp_min(max by (node) (kube_node_status_allocatable{resource="cpu", unit="core"}), 1)
            ) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node CPU requests are critically high
            description: Node {{ $$labels.node }} has CPU requests above 95% of allocatable for more than 5 minutes. Critical pods like Longhorn instance-manager will fail to schedule. Currently {{ $$value | printf "%.1f" }}%.

        - alert: NodeMemoryRequestsHigh
          expr: |
            100 *
            (
              sum by (node) (
                kube_pod_container_resource_requests{resource="memory", unit="byte"}
                * on (namespace, pod) group_left(node)
                kube_pod_info
              )
              /
              clamp_min(max by (node) (kube_node_status_allocatable{resource="memory", unit="byte"}), 1)
            ) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node memory requests are high
            description: Node {{ $$labels.node }} has memory requests above 85% of allocatable for more than 10 minutes, reducing scheduling headroom for new workloads. Currently {{ $$value | printf "%.1f" }}%.

        - alert: NodeMemoryRequestsCritical
          expr: |
            100 *
            (
              sum by (node) (
                kube_pod_container_resource_requests{resource="memory", unit="byte"}
                * on (namespace, pod) group_left(node)
                kube_pod_info
              )
              /
              clamp_min(max by (node) (kube_node_status_allocatable{resource="memory", unit="byte"}), 1)
            ) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node memory requests are critically high
            description: Node {{ $$labels.node }} has memory requests above 95% of allocatable for more than 5 minutes. New pods requiring memory guarantees will fail to schedule. Currently {{ $$value | printf "%.1f" }}%.

        - alert: LonghornBackupFailuresDetected
          # Fires only when the count of failed backups is actively increasing,
          # i.e. new failures have appeared in the last 20 minutes.
          # Old stuck-failed backups that are no longer growing do not retrigger this alert.
          expr: increase(sum by (volume) (longhorn_backup_state == 4)[20m:]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Longhorn backup failures detected
            description: New backup failures have appeared for Longhorn volume {{ $$labels.volume }} in the last 20 minutes. Failure count now {{ $$value | humanize }}.

    - name: node-exporter.rules
      rules:
        - alert: NodeExporterDown
          expr: up{job="node-exporter"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Node exporter target is down
            description: Node exporter target {{ $$labels.instance }} has been down for more than 10 minutes.

        - alert: HostHighCpuUsage
          expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m]))) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Host CPU usage is high
            description: Host {{ $$labels.instance }} has sustained CPU usage above 90% for more than 15 minutes. Currently {{ $$value | printf "%.1f" }}%.

        - alert: HostMemoryPressure
          expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Host memory pressure is high
            description: Host {{ $$labels.instance }} has sustained memory usage above 90% for more than 15 minutes. Currently {{ $$value | printf "%.1f" }}%.

        - alert: HostRootFilesystemPressure
          expr: 100 * (1 - (node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!~"tmpfs|overlay"})) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Host root filesystem usage is high
            description: Host {{ $$labels.instance }} root filesystem has been above 90% used for more than 15 minutes. Currently {{ $$value | printf "%.1f" }}%.