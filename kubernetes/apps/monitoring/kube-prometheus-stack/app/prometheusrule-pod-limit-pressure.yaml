---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-limit-pressure-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes.pod-limit-pressure.rules
      rules:
        - alert: PodCpuLimitPressureHigh
          expr: |
            (
              sum by (namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{container!="", image!=""}[5m])
              )
              /
              on (namespace, pod, container)
              kube_pod_container_resource_limits{resource="cpu", unit="core", container!=""}
            ) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod container CPU usage is near its configured limit
            description: Container {{ $$labels.container }} in pod {{ $$labels.namespace }}/{{ $$labels.pod }} has used more than 85% of its CPU limit for 15 minutes. Currently {{ $$value | humanizePercentage }}.

        - alert: PodCpuLimitPressureCritical
          expr: |
            (
              sum by (namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{container!="", image!=""}[5m])
              )
              /
              on (namespace, pod, container)
              kube_pod_container_resource_limits{resource="cpu", unit="core", container!=""}
            ) > 0.95
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Pod container CPU usage is critically close to its configured limit
            description: Container {{ $$labels.container }} in pod {{ $$labels.namespace }}/{{ $$labels.pod }} has used more than 95% of its CPU limit for 10 minutes. Currently {{ $$value | humanizePercentage }}.

        # ---- Memory: three detectors for three different failure shapes -------
        #
        # Two bases on purpose. Working set (usage minus inactive page cache) is
        # what kubectl top and the sizing in this repo use, but it counts
        # reclaimable file cache as pressure: Prometheus sits near 90% of its
        # limit with only ~45% of it anonymous (RSS), so a working-set ratio
        # alert would fire on it forever. RSS (anonymous memory) is what the
        # kernel cannot reclaim, so the time-based tiers use it. RSS is blind
        # to tmpfs and /dev/shm though (Chromium in changedetection and
        # mcp-playwright), so the restart detector uses working set instead —
        # there the false-positive cost is gated by a restart, which is rare.
        #
        # Backtest 2026-10-02, 14d of live data: no container exceeded 76% RSS
        # (so the two tiers below would have been silent), and the restart
        # detector at 0.85 matched only the echo crash loop, no false positives.
        #
        # The RSS ratio is recorded because both time-based tiers share it. `max
        # by` on both sides makes the match one-to-one — cAdvisor briefly emits a
        # second series for a restarted container (new cgroup id), and an
        # un-deduped join errors on exactly that overlap. This group logged 30
        # failed evaluations in 14d before this change. The recording rule stays
        # above the alerts that read it; rules in a group evaluate in order.
        - record: namespace_pod_container:container_memory_rss_to_limit:ratio
          expr: |
            max by (namespace, pod, container) (
              container_memory_rss{container!="", image!=""}
            )
            /
            max by (namespace, pod, container) (
              kube_pod_container_resource_limits{resource="memory", unit="byte", container!=""}
            )

        # Creep: headroom eroding slowly. 6h so a daily peak does not trip it.
        - alert: PodMemoryLimitPressureHigh
          expr: namespace_pod_container:container_memory_rss_to_limit:ratio > 0.85
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: Pod container anonymous memory is eating its headroom
            description: Container {{ $$labels.container }} in pod {{ $$labels.namespace }}/{{ $$labels.pod }} has held more than 85% of its memory limit as anonymous (RSS) memory for 6 hours. Currently {{ $$value | humanizePercentage }}. Slow growth, likely a leak or a workload that outgrew its limit.

        # Plateau: sitting at the wall. Shorter `for` because it is closer.
        - alert: PodMemoryLimitPressureCritical
          expr: namespace_pod_container:container_memory_rss_to_limit:ratio > 0.95
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Pod container anonymous memory is at its limit
            description: Container {{ $$labels.container }} in pod {{ $$labels.namespace }}/{{ $$labels.pod }} has held more than 95% of its memory limit as anonymous (RSS) memory for 15 minutes. Currently {{ $$value | humanizePercentage }}. An OOM kill is imminent.

        # Slam: the two ratio alerts above cannot see a container that dies
        # faster than their `for` — every restart resets the ratio, so a crash
        # loop never stays over a threshold long enough. This looks back over
        # the 30m window instead, so it still sees the value from before the
        # restart, and it clears itself 30m after the last one.
        #
        # The hot reading must come from BEFORE the restart, not just somewhere
        # in the same window: otherwise a cold restart followed by ordinary
        # warm-up growth would satisfy both halves and page as a memory crash.
        # cAdvisor series carry the cgroup `id`, which is new for every
        # container instance, so `unless on (id)` against the live series
        # leaves only instances that no longer exist — the ones that died. Their
        # peak working set is, by construction, pre-restart evidence. (If a
        # live container's series drops out for one scrape it briefly looks
        # dead too, but it must also have restarted in the window to matter.)
        #
        # Working set rather than RSS here, and not keyed on an OOMKilled
        # termination reason: the one memory crash loop this cluster has had
        # (echo, 509 restarts) reported Error, not OOMKilled, and
        # node_vmstat_oom_kill read 0 on every host. The app (Node) aborted on
        # its own heap ceiling, which sits below the cgroup limit. Hence 0.85
        # rather than something closer to 1.
        - alert: PodMemoryRestartedWhileHot
          expr: |
            (
              sum by (namespace, pod, container) (
                increase(kube_pod_container_status_restarts_total{container!=""}[30m])
              ) > 0
            )
            and on (namespace, pod, container)
            (
              max by (namespace, pod, container) (
                max_over_time(container_memory_working_set_bytes{container!="", image!=""}[30m])
                unless on (id)
                container_memory_working_set_bytes{container!="", image!=""}
              )
              /
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory", unit="byte", container!=""}
              )
              > 0.85
            )
          labels:
            severity: critical
          annotations:
            summary: Pod container restarted after running near its memory limit
            description: Container {{ $$labels.container }} in pod {{ $$labels.namespace }}/{{ $$labels.pod }} restarted {{ $$value | printf "%.0f" }} time(s) in the last 30 minutes, and a previous instance of it had peaked above 85% of the memory limit before dying. Treat it as a memory-driven crash until shown otherwise. An in-process heap abort reports Error, not OOMKilled.
