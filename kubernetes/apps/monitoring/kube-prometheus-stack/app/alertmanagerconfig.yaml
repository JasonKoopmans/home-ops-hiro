---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram
  namespace: monitoring
spec:
  route:
    receiver: telegram
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # Required companion to alertmanagerConfigMatcherStrategy.type: None on the
    # HelmRelease. Without that setting this route also carried an injected
    # namespace="monitoring" matcher, which happened to exclude Watchdog. With
    # the injection gone the route has no matchers left, so it matches
    # everything — and because the operator inserts CR routes *before* the
    # chart's own routes and sets continue: true, Watchdog would match here
    # first and only then reach the chart's Watchdog-to-null route.
    #
    # Watchdog is the deadman's switch: it fires permanently by design. Left
    # unmatched it would send a Telegram message every repeatInterval (4h),
    # forever. Drop it explicitly.
    matchers:
      - name: alertname
        value: Watchdog
        matchType: "!="
    # Severity split. On 2026-08-16 a Longhorn outage produced 23 distinct alertnames
    # and ~200 Telegram messages in 8h — roughly one every 2.4 minutes. Detection was
    # never the problem (LonghornManagerDown fired critical at 05:45, as designed);
    # the two messages that mattered were buried in warning churn, because grouping
    # by alertname alone gives every alertname its own message and CrashLoopBackOff
    # pod churn keeps changing group membership, re-triggering each groupInterval.
    routes:
      # Criticals keep per-alertname granularity and nag more often than the 4h default.
      - receiver: telegram
        matchers:
          - name: severity
            value: critical
        groupBy: ["alertname"]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 1h
      # Node and kubelet health keeps the old fast cadence — a node degrading is
      # worth knowing about now, not in the next digest. Matched by alertname, not
      # by an absent namespace label: kube-prometheus-stack labels these with the
      # *rule's* namespace, so KubeNodeUnreachable and NodeDiskIOSaturation both
      # arrive as namespace="monitoring" and would otherwise land in that digest.
      - receiver: telegram
        matchers:
          - name: severity
            value: warning
          - name: alertname
            value: (Node|KubeNode|Host|Kubelet).*
            matchType: "=~"
        groupBy: ["alertname"]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
      # Everything else collapses into one digest per namespace, much more slowly.
      - receiver: telegram-warnings
        matchers:
          - name: severity
            value: warning
        groupBy: ["namespace", "severity"]
        groupWait: 5m
        groupInterval: 30m
        repeatInterval: 12h
  # The chart ships inhibit rules keyed on `equal: [namespace, alertname]`, so a
  # critical only ever silences the *same* alertname. That never suppresses a
  # cascade. When Longhorn's control plane is down, every pod-health alert in the
  # cluster is a symptom of it — both admission webhooks are failurePolicy: Fail,
  # so unrelated namespaces start failing admission too. Mute the symptoms while
  # the root cause is firing; they return the moment it resolves.
  #
  # Like the route above, this depends on alertmanagerConfigMatcherStrategy.type:
  # None. Under the default strategy the operator's namespaceEnforcer appends a
  # namespace="monitoring" matcher to both sides (see processInhibitRule), which
  # would silently reduce this rule to a no-op — every alert here carries a
  # different namespace.
  inhibitRules:
    - sourceMatch:
        # LonghornNodeNotReady only. LonghornManagerDown is `up{job=...} == 0`,
        # which cannot tell "manager is down" from "Prometheus cannot reach the
        # manager" — on 2026-08-16 a NetworkPolicy blocking the scrape path had
        # it firing critical for hours while Longhorn was entirely healthy. As an
        # inhibit source that would have muted pod-health warnings cluster-wide
        # over a monitoring-path problem. LonghornNodeNotReady reads
        # longhorn_node_status, so the same scrape failure makes its data absent
        # and it simply stops evaluating — it fails safe, which is what an
        # inhibit source has to do.
        - name: alertname
          value: LonghornNodeNotReady
      targetMatch:
        - name: alertname
          value: KubePodCrashLooping|KubePodNotReady|KubeContainerWaiting|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeJobFailed|TargetDown
          matchType: "=~"
        # Symptoms only. Matching on alertname alone would also mute critical
        # instances of these alerts — LonghornVolumeUnhealthy is critical, and it
        # is the one alert that reports actual data risk during a Longhorn outage,
        # so it must never be inhibited. This guard also protects any target above
        # that a future chart version promotes to critical.
        - name: severity
          value: critical
          matchType: "!="
      # No `equal:` on purpose — the blast radius of a Longhorn outage is
      # cluster-wide, not confined to the storage namespace.
  receivers:
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram-secret
            key: bot-token
          chatID: 8854064758
          sendResolved: true
          parseMode: HTML
          # job_name wins over pod when both are set: KubeJobFailed carries
          # job_name for the batch Job that actually failed *and* pod for
          # whichever kube-state-metrics replica happened to scrape it — the
          # exporter's own identity, not the failure's. Showing pod there
          # named kube-state-metrics itself in every one of these alerts.
          message: |-
            {{ if gt (len .Alerts.Firing) 0 }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} ({{ .Alerts.Firing | len }} firing, {{ .Alerts.Resolved | len }} resolved)
            {{ range .Alerts.Firing }}
            {{ if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
            {{ if .Labels.node }}node: <code>{{ .Labels.node }}</code>{{ end }}{{ if .Labels.namespace }} ns: <code>{{ .Labels.namespace }}</code>{{ end }}{{ if .Labels.job_name }} job: <code>{{ .Labels.job_name }}</code>{{ else if .Labels.pod }} pod: <code>{{ .Labels.pod }}</code>{{ end }}{{ if .Labels.instance }} instance: <code>{{ .Labels.instance }}</code>{{ end }}
            {{ .Annotations.description }}
            since {{ .StartsAt.Format "15:04 MST" }}
            {{ end }}{{ range .Alerts.Resolved }}
            ✅ <b>{{ .Labels.alertname }}</b> resolved{{ if .Labels.node }} — <code>{{ .Labels.node }}</code>{{ end }}{{ if .Labels.job_name }} — <code>{{ .Labels.job_name }}</code>{{ else if .Labels.pod }} — <code>{{ .Labels.pod }}</code>{{ end }}{{ if .Labels.instance }} — <code>{{ .Labels.instance }}</code>{{ end }} (was {{ .Labels.severity }}, {{ .StartsAt.Format "15:04" }}–{{ .EndsAt.Format "15:04 MST" }})
            {{ end }}
    # Separate receiver purely for the template: a namespace digest can carry 20+
    # alerts, and the verbose per-alert format above would blow past Telegram's
    # 4096-character message limit and fail the notification. One line each.
    - name: telegram-warnings
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram-secret
            key: bot-token
          chatID: 8854064758
          sendResolved: true
          parseMode: HTML
          message: |-
            🟠 <b>{{ .Alerts.Firing | len }} warning(s)</b>{{ if .GroupLabels.namespace }} in <code>{{ .GroupLabels.namespace }}</code>{{ end }}
            {{ range .Alerts.Firing }}• <b>{{ .Labels.alertname }}</b>{{ if .Labels.job_name }} <code>{{ .Labels.job_name }}</code>{{ else if .Labels.pod }} <code>{{ .Labels.pod }}</code>{{ else if .Labels.node }} <code>{{ .Labels.node }}</code>{{ else if .Labels.instance }} <code>{{ .Labels.instance }}</code>{{ end }} — since {{ .StartsAt.Format "15:04" }}
            {{ end }}{{ if gt (len .Alerts.Resolved) 0 }}
            ✅ <b>{{ .Alerts.Resolved | len }} resolved</b>: {{ range .Alerts.Resolved }}{{ .Labels.alertname }} {{ end }}{{ end }}
