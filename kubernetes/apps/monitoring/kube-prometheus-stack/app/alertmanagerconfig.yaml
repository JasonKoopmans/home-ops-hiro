---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram
  namespace: monitoring
spec:
  route:
    receiver: telegram
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # Required companion to alertmanagerConfigMatcherStrategy.type: None on the
    # HelmRelease. Without that setting this route also carried an injected
    # namespace="monitoring" matcher, which happened to exclude Watchdog. With
    # the injection gone the route has no matchers left, so it matches
    # everything — and because the operator inserts CR routes *before* the
    # chart's own routes and sets continue: true, Watchdog would match here
    # first and only then reach the chart's Watchdog-to-null route.
    #
    # Watchdog is the deadman's switch: it fires permanently by design. Left
    # unmatched it would send a Telegram message every repeatInterval (4h),
    # forever. Drop it explicitly.
    matchers:
      - name: alertname
        value: Watchdog
        matchType: "!="
  receivers:
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram-secret
            key: bot-token
          chatID: 8854064758
          sendResolved: true
          parseMode: HTML
          message: |-
            {{ if gt (len .Alerts.Firing) 0 }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} ({{ .Alerts.Firing | len }} firing, {{ .Alerts.Resolved | len }} resolved)
            {{ range .Alerts.Firing }}
            {{ if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
            {{ if .Labels.node }}node: <code>{{ .Labels.node }}</code>{{ end }}{{ if .Labels.namespace }} ns: <code>{{ .Labels.namespace }}</code>{{ end }}{{ if .Labels.pod }} pod: <code>{{ .Labels.pod }}</code>{{ end }}{{ if .Labels.instance }} instance: <code>{{ .Labels.instance }}</code>{{ end }}
            {{ .Annotations.description }}
            since {{ .StartsAt.Format "15:04 MST" }}
            {{ end }}{{ range .Alerts.Resolved }}
            ✅ <b>{{ .Labels.alertname }}</b> resolved{{ if .Labels.node }} — <code>{{ .Labels.node }}</code>{{ end }}{{ if .Labels.pod }} — <code>{{ .Labels.pod }}</code>{{ end }}{{ if .Labels.instance }} — <code>{{ .Labels.instance }}</code>{{ end }} (was {{ .Labels.severity }}, {{ .StartsAt.Format "15:04" }}–{{ .EndsAt.Format "15:04 MST" }})
            {{ end }}
