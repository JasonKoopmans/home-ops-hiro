---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - name: loki-objstore-config
      kind: Secret
      valuesKey: accessKey
      targetPath: loki.storage.s3.accessKeyId
    - name: loki-objstore-config
      kind: Secret
      valuesKey: secretKey
      targetPath: loki.storage.s3.secretAccessKey
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      ingester:
        wal:
          # Upstream defaults this false, correctly, for distributed Loki: the WAL
          # already recovers everything on restart, and flushing on every rolling
          # restart writes partial chunks well under the 1.5MiB target -- more
          # objects, worse compression, more chunk fetches per query.
          #
          # Neither reason holds here. This is singleBinary/replicas:1 with 0
          # restarts in 9 days, so fragmentation is noise; and the WAL only saves
          # you while the PVC survives, which is exactly the assumption the
          # upcoming Talos node roll (5 drains) and a possible storage-class move
          # are about to break. Without this, each restart carries a window of
          # chunks that exist only in /var/loki/wal on that one volume -- up to
          # max_chunk_age (2h) for a stream busy enough never to idle out.
          #
          # Only fires on graceful SIGTERM. OOMKill / node power loss still land
          # on WAL replay, so this supplements the WAL, it does not replace it.
          # Also NOT sufficient for a deliberate PVC delete: that needs an
          # explicit POST /flush plus verification that the bucket stopped
          # growing, not a best-effort window.
          flush_on_shutdown: true
      # Long-term storage: Minio (observability-loki bucket), via a dedicated
      # bucket-scoped IAM user (kubernetes/apps/storage/minio/app/loki-user-bootstrap-job.yaml),
      # not Minio root credentials. accessKeyId/secretAccessKey come from
      # loki-objstore-config via valuesFrom above.
      storage:
        type: s3
        bucketNames:
          chunks: observability-loki
          ruler: observability-loki
        s3:
          endpoint: minio.storage.svc.cluster.local:9000
          region: us-east-1
          # Minio requires path-style bucket addressing, not virtual-hosted-style.
          s3ForcePathStyle: true
          insecure: true
      # loki.storage.filesystem (chart's own toggle) is dead once storage.type: s3
      # is set — the chart's common-storage template is an if/else and only
      # renders one backend. storage_config (snake_case, distinct from `storage`
      # above) is a raw passthrough straight into the rendered storage_config:
      # section, which is how the pre-cutover schemaConfig period below (still
      # object_store: filesystem) gets a real backend to read existing logs from,
      # alongside the s3 backend the new period uses via common.storage.s3.
      storage_config:
        filesystem:
          directory: /var/loki/chunks
      limits_config:
        retention_period: 14d
      compactor:
        retention_enabled: true
        # Keep delete-request markers on the local volume until the S3 cutover
        # has been validated in-cluster; this avoids hard-failing startup if
        # object storage connectivity is degraded during rollout.
        delete_request_store: filesystem
      schemaConfig:
        configs:
          # Pre-cutover: existing logs already written to the local filesystem
          # volume. Left unchanged so they remain queryable — do not edit
          # object_store here, only add new periods for storage changes.
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
          # Phase 6 cutover: new logs from this date land in Minio (observability-loki)
          # instead of the local filesystem volume. Deliberately set to the day
          # AFTER merge/deploy (not the deploy day itself): Loki resolves a
          # period's `from` at UTC day granularity, so if this were set to
          # today, logs already ingested earlier today under the filesystem
          # period would have their queries incorrectly routed to the s3
          # period for the rest of today — a partial-day query gap where
          # chunks exist on disk but Loki looks for them in Minio instead.
          # A future UTC day boundary keeps the cutover clean: everything
          # before this date reads from filesystem, everything from this date
          # forward reads from S3, with no overlap or gap. Update this date if
          # merge/deploy slips past 2026-07-04.
          - from: "2026-07-04"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

    singleBinary:
      replicas: 1
      # Paired with ingester.wal.flush_on_shutdown above. The chart default is
      # 30s, and flush_op_timeout is 10m -- so a flush that needs longer than the
      # grace period gets SIGKILLed partway, leaving partial chunks in Minio AND
      # still depending on WAL replay: the worst of both. 120s is generous for
      # ~0.11GB of local data. Do not lower this without also reverting
      # flush_on_shutdown.
      terminationGracePeriodSeconds: 120
      persistence:
        # StatefulSet volumeClaimTemplates are IMMUTABLE. Editing this value does
        # not move an existing PVC -- the rebuilt StatefulSet just adopts the old
        # one. Changing it requires deleting the PVC so it reprovisions, and that
        # must be preceded by an explicit `POST /flush` plus confirmation that the
        # observability-loki bucket stopped growing — graceful shutdown alone is
        # best-effort, not a guarantee.
        #
        # longhorn-tsdb, moved off `longhorn` (2026-07-28): aligns Loki's RPO with
        # Prometheus, which is the right shape for it -- chunks and index ship to
        # MinIO continuously, so
        # the local volume is a buffer, not the durable copy. The class name is
        # accurate despite the workload not being metrics: Loki's own schema is
        # `store: tsdb` with a tsdb_shipper index.
        #
        # Consequences, accepted deliberately: 3 replicas -> 2; daily AWS S3
        # backups via the `default` recurring-job group are LOST (the tsdb group
        # has no backup job); 6-hourly snapshots become daily/retain-2; and
        # filesystem-trim will collapse the snapshot chain, so there are windows
        # with no local restore point. All fine given a few hours of log loss is
        # tolerable here and older data lives in MinIO.
        storageClass: longhorn-tsdb
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Disable separate read/write/backend components (single binary mode)
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Keep chunks cache lightweight but avoid OOM/restarts on small clusters.
    chunksCache:
      enabled: true
      replicas: 1
      allocatedMemory: 768
      maxItemMemory: 5
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Conservative right-sizing: results cache defaults to 500m CPU request,
    # which is high for this cluster's observed usage.
    resultsCache:
      enabled: true
      replicas: 1
      allocatedCPU: 100m
      resources:
        requests:
          cpu: 100m
        limits:
          cpu: 500m

    # Disable self-monitoring to reduce resource usage
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false

    test:
      enabled: false
