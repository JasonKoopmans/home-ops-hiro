# Grafana service-account token for this MCP server's access into the
# monitoring Grafana instance (kube-prometheus-stack, in
# kubernetes/apps/monitoring/kube-prometheus-stack).
#
# Create it in that Grafana's own UI, not via kubectl or this repo:
#   Administration -> Users and access -> Service accounts -> Add service
#   account (role: Viewer — --disable-write in helmrelease.yaml is the second
#   lock, so the token doesn't also need to be low-privilege on its own) ->
#   Add service account token -> copy it, then edit this already-encrypted
#   file in place (decrypts to $EDITOR, re-encrypts on save):
#     sops kubernetes/apps/mcp/mcp-grafana-monitoring/app/secret.sops.yaml
