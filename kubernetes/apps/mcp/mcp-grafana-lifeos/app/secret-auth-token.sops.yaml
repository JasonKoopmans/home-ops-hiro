# Caller-auth bearer token for this MCP server itself (auth-ladder step 2),
# separate from secret.sops.yaml's GRAFANA_SERVICE_ACCOUNT_TOKEN — the two
# guard different legs and are deliberately different Secrets so that adding
# this one never requires decrypting the one holding your real Grafana
# credential:
#
#   caller -> mcp-grafana-lifeos     gated by MCP_GRAFANA_SERVER_TOKEN (this file)
#   mcp-grafana-lifeos -> Grafana    gated by GRAFANA_SERVICE_ACCOUNT_TOKEN (secret.sops.yaml)
#
# Generated locally (openssl rand -hex 32) — it's an arbitrary shared secret
# invented for this purpose, not issued by Grafana, so there's no UI step to
# reproduce it. Every client (n8n, Hermes, Claude Code, mcp-remote for
# Desktop) must send it back as `Authorization: Bearer <token>` once wired up.
#
# Rotate by generating a new value and re-encrypting:
#   openssl rand -hex 32 | xargs -I{} sops set kubernetes/apps/mcp/mcp-grafana-lifeos/app/secret-auth-token.sops.yaml '["stringData"]["MCP_GRAFANA_SERVER_TOKEN"]' '"{}"'
