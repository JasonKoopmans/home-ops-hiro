# Grafana service-account token for this MCP server's access into the LifeOS
# Grafana instance (kubernetes/apps/lifeos/grafana).
#
# Create it in that Grafana's own UI, not via kubectl or this repo:
#   Administration -> Users and access -> Service accounts -> Add service
#   account (role: Viewer — --disable-write in helmrelease.yaml is the second
#   lock, so the token doesn't also need to be low-privilege on its own) ->
#   Add service account token -> copy it, then edit this already-encrypted
#   file in place (decrypts to $EDITOR, re-encrypts on save):
#     sops kubernetes/apps/mcp/mcp-grafana-lifeos/app/secret.sops.yaml
#
# Real token, filled in 2026-08-29. To rotate: generate a new service
# account token in Grafana's UI (same steps above), then run the same `sops`
# command to replace the value — the pod starts fine regardless (nothing
# checks this at startup) but every Grafana-calling tool 401s until it's
# current.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-grafana-lifeos-secret
stringData:
