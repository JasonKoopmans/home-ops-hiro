# PLACEHOLDER VALUES — must be filled in and encrypted before this app will run.
# The ENC[...] strings below are not real ciphertext.
#
#   AUTH_TOKEN:   bearer token every MCP client must send as
#                 `Authorization: Bearer <value>`. The image warns and keeps
#                 serving if this is under 32 characters, so make it long:
#                   openssl rand -hex 32
#                 Without it the endpoint is unauthenticated on the whole LAN.
#
#   N8N_API_KEY:  an n8n Public API key — n8n UI > Settings > n8n API >
#                 "Create an API key". This is the credential that promotes the
#                 server from 7 read-only reference tools to 26 tools that act
#                 on the real instance. Omit this key entirely and the app still
#                 runs, just in the reference-only tier.
#
# To encrypt:
#   sops --encrypt --in-place kubernetes/apps/mcp/mcp-n8n/app/secret.sops.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-n8n-secret
stringData:
  AUTH_TOKEN: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
  N8N_API_KEY: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
