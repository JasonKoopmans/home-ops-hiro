# DATABASE_URI is the only env var this image reads (crystaldba/postgres-mcp
# has no libpq PG*-style vars, just this one connection string). Same
# password as kubernetes/apps/database/postgres/app/mcp-postgres-credentials.sops.yaml
# — that copy is what the CNPG operator uses to create the role; this one is
# what the MCP server connects with. Whichever one you rotate, rotate both.
#
# -rw (not -ro) on purpose, matching the same choice made for Grafana's
# read-only lifeos_reader connection: -ro only exists while replicas are
# healthy, and a single-instance degradation would take this down with it.
