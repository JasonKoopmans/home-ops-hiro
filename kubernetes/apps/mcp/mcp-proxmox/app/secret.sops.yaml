# PLACEHOLDER VALUES — this file must be filled in and encrypted by hand before
# the app can start. The ENC[...] strings below are not real ciphertext.
#
#   MCP_API_KEY:         bearer token every MCP client must send as
#                        `Authorization: Bearer <value>`. Without it the server
#                        serves Streamable HTTP unauthenticated and only logs a
#                        warning, so this is the control that keeps the LAN out.
#                        Generate with: openssl rand -hex 32
#   PROXMOX_USER:        e.g. root@pam — the user the API token belongs to.
#   PROXMOX_TOKEN_NAME:  the token's ID, not the full user!token string.
#   PROXMOX_TOKEN_VALUE: the secret shown once at token creation.
#
# This token is FULL-PRIVILEGE by decision — see the blast-radius note at the
# top of helmrelease.yaml. To narrow later, issue a PVEAuditor-only token and
# replace the values here; no manifest change is needed.
#
# To encrypt:  sops --encrypt --in-place kubernetes/apps/mcp/mcp-proxmox/app/secret.sops.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-proxmox-secret
stringData:
  MCP_API_KEY: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
  PROXMOX_USER: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
  PROXMOX_TOKEN_NAME: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
  PROXMOX_TOKEN_VALUE: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
