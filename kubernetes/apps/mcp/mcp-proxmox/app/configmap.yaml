# Proxmox's cluster CA — the public half, which is why this is a ConfigMap and
# not the SOPS Secret. Fetched 2026-08-15 from the API rather than by SSH:
#
#   GET /api2/json/nodes/vm01/certificates/info  ->  filename pve-root-ca.pem
#
# and verified to sign the certificate vm01:8006 actually presents
# (`openssl verify -CAfile` => OK). Expires 2035-10-14.
#
# It is needed because the image refuses to start with TLS verification
# disabled and Proxmox signs its own certificates. If Proxmox regenerates them
# (`pvecm updatecerts -f`), refresh this file the same way.
