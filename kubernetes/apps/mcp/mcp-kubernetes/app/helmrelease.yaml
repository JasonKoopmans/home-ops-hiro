---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-kubernetes
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      main:
        # This server runs Streamable HTTP statelessly (sessionIdGenerator is
        # undefined upstream, so every request gets a fresh transport), so it
        # would scale horizontally. One replica because the load doesn't justify
        # more — not because sessions pin to a pod. Don't copy this as a
        # constraint: an MCP server that issues session IDs *would* need sticky
        # sessions the gateway doesn't provide.
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: flux159/mcp-server-kubernetes
              tag: v4.1.4
            env:
              # Upstream labels the HTTP transports "unsafe" because the server
              # ships no authn. Internal-only and unauthenticated is the phase-1
              # choice; MCP_AUTH_TOKEN (X-MCP-AUTH header) is the seam for
              # adding auth later without touching anything else here.
              ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT: "1"
              HOST: 0.0.0.0
              PORT: &port 3000
              # Second lock on the read-only door: even if the ServiceAccount
              # were widened by mistake, the server refuses write tools. Leaves
              # kubectl_get, kubectl_describe, kubectl_logs, kubectl_context,
              # kubectl_reconnect, explain_resource, list_api_resources, ping —
              # dropping kubectl_generic, apply/create/patch/scale/rollout, the
              # Helm tools and port-forward. Note this is stricter than
              # ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS, which still permits writes.
              # Those survivors are generic over resource type, so rbac.yaml is
              # what actually bounds this server's reach.
              ALLOW_ONLY_READONLY_TOOLS: "true"
              MASK_SECRETS: "true"
              # The server's Host allow-list holds exactly one value upstream
              # (DNS_REBINDING_ALLOWED_HOST is wrapped as [value], no comma
              # splitting), so it cannot cover both the gateway hostname and
              # <svc>.<ns>.svc.cluster.local. This repo addresses every
              # service-to-service call by Service DNS, and in-cluster pods
              # can't resolve the gateway name anyway — CoreDNS forwards to
              # 1.1.1.1/8.8.8.8, and internal-only hostnames exist only in
              # k8s_gateway. So a single-value allow-list locks out n8n and
              # Hermes no matter which value it holds.
              #
              # Turned off rather than worked around, because the check is
              # redundant exactly where the threat is real: a rebinding attack
              # arrives with Host: attacker.com, matches no HTTPRoute, and Envoy
              # 404s it before this server sees the request. Pod IPs and
              # ClusterIPs aren't reachable from a LAN browser at all. Envoy's
              # hostname matching is the enforcement point; this was a second
              # copy of it that only ever rejected legitimate callers.
              #
              # The server logs a startup warning about this. Expected.
              DNS_REBINDING_PROTECTION: "false"
              # The server shells out to kubectl, which writes a discovery cache
              # under $HOME/.kube. Pointing HOME at the emptyDir below is what
              # lets readOnlyRootFilesystem stay true. In-cluster credentials
              # outrank ~/.kube/config, so this doesn't affect auth.
              HOME: /tmp
            probes:
              # Health/readiness paths are undocumented upstream, so probe the
              # socket rather than guess a URL. Swap to httpGet once confirmed.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    # Creates the ServiceAccount named `mcp-kubernetes`; rbac.yaml binds it to
    # the built-in `view` role plus a read-only supplement. The mounted token is
    # the server's credential — it uses in-cluster auth, which outranks every
    # KUBECONFIG_* / K8S_* source.
    serviceAccount:
      mcp-kubernetes: {}

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        # UID/GID read off the running pod rather than guessed —
        # `kubectl -n mcp exec deploy/mcp-kubernetes -- id` reports
        # uid=1001(appuser) gid=1001(appuser). This is the image's own USER, so
        # pinning it changes nothing at runtime; it just stops the pod from
        # being *able* to start as root if a future image tag drops its USER.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # Not needed by the /tmp emptyDir, which kubelet already creates
        # writable. Set so that a copy of this template which swaps in a PVC
        # gets a mount the non-root user can write to without a second debug
        # round-trip.
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      # Writable scratch for the kubectl discovery cache (see HOME above).
      # No globalMounts needed — app-template mounts an unqualified volume at
      # /<name>, so this lands on /tmp.
      tmp:
        type: emptyDir

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      main:
        # Single-label hostname on purpose: the wildcard cert is
        # ["${SECRET_DOMAIN}", "*.${SECRET_DOMAIN}"] and does not cover a second
        # label, so mcp-kubernetes.mcp.${SECRET_DOMAIN} would fail TLS.
        hostnames: ["mcp-kubernetes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Path-scoped so only the MCP endpoint is reachable through the
          # gateway. Widen if a client needs /.well-known OAuth discovery.
          - matches:
              - path:
                  value: /mcp
            backendRefs:
              - identifier: main
                port: *port
