# Shared by every agent-pipeline repo: the Claude subscription token.
# Owner: run `claude setup-token` on your own machine (valid one year), put the
# value below, then `sops -e -i` this file. Never paste the token into chat,
# issues or logs. Only the `agent` container of each pod receives it.
apiVersion: v1
kind: Secret
metadata:
  name: agent-claude-oauth
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: ENC[AES256_GCM,data:PLACEHOLDER_FILL_AND_ENCRYPT,type:str]
