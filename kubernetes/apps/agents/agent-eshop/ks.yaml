---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-eshop
spec:
  dependsOn:
    - name: agent-shared
  interval: 1h
  path: ./kubernetes/apps/agents/agent-eshop/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: false
