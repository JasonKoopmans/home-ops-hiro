---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.25.100"
      externalTrafficPolicy: Cluster
    # Two replicas on different nodes: this is the LAN's resolver for every
    # internal hostname, so a node loss must not be a DNS outage.
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: k8s-gateway
                app.kubernetes.io/instance: k8s-gateway
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      maxUnavailable: 1
    # Surge, never drop: keep both replicas serving through a rollout.
    # Chart default is maxUnavailable: 1. The surge pod needs a free node
    # under the anti-affinity (5 nodes, 2 replicas).
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    # 4.x drops the chart's runAsUser and the image has no USER, so it would
    # run as root. Stay uid 1000 on :1053, as 3.x did.
    securityContext:
      runAsUser: 1000
    # Measured 14d peak: 33Mi working set, ~2m CPU (2026-10-17).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: null # chart default is 100m; no CPU limits here
        memory: 128Mi
    # CoreDNS metrics (coredns_*), scraped by kube-prometheus-stack; alerts
    # in monitoring/kube-prometheus-stack/app/prometheusrule-k8s-gateway.yaml.
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: true
    readinessProbe:
      initialDelaySeconds: 10
      failureThreshold: 5
    servers:
      - zones:
          - zone: .
        port: 1053
        servicePort: 53
        plugins:
          # The chart derives RBAC from the "resources" line below; a typo
          # there drops the permission without any error.
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute Service
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
