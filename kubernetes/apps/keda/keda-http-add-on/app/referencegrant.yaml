---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: keda-interceptor-from-default
spec:
  # Ephemeral apps in `default` keep their own HTTPRoute but point its backendRef at
  # the interceptor proxy here in `keda`. Gateway API requires an explicit grant for
  # any cross-namespace backendRef. Scoped to the one Service by name, and to the one
  # namespace that needs it today — extending to another namespace is one more entry.
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
