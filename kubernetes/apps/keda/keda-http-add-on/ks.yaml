---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda-http-add-on
spec:
  dependsOn:
    - name: keda-core
      namespace: keda
    # The ReferenceGrant below is a Gateway API resource; envoy-gateway owns those CRDs.
    - name: envoy-gateway
      namespace: network
  # Apps that ship an HTTPScaledObject must set
  # dependsOn: [{name: keda-http-add-on, namespace: keda}] so the http.keda.sh CRDs
  # are guaranteed to exist before their CRs are applied.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/keda/keda-http-add-on/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: keda
  wait: false
