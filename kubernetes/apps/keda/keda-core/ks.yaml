---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda-core
spec:
  # Gate the add-on (and any HTTPScaledObject consumer) on core KEDA actually being
  # ready: the add-on's operator needs keda.sh CRDs + the admission webhook running
  # before it can create the interceptor's own ScaledObject.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda-core
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/keda/keda-core/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: keda
  wait: false
