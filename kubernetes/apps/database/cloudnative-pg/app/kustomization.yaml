---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./plugin-barman-cloud-manifest.yaml

patches:
  # The vendored upstream manifest ships the plugin controller with
  # `resources: {}`. Bound it here rather than editing the vendored file, so
  # re-vendoring on a plugin upgrade stays a clean copy of the release asset.
  #
  # INFORMED GUESS — a single mostly-idle Go gRPC service that brokers backup
  # calls; it does not move backup data itself (the per-instance sidecars do).
  # Memory limit only, per repo convention. See docs/plan-cloudnative-pg.md §3.
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            containers:
              - name: barman-cloud
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
