---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # `required`, not the operator's `preferred` default. Under scheduling
  # pressure `preferred` permits all three instances onto one node, which would
  # silently yield zero node-failure tolerance while still looking like HA.
  # The trade-off is that instances stay Pending rather than co-locating if
  # fewer than three eligible nodes are available — the correct failure mode
  # here, and visible rather than silent.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  # No archive_timeout override on purpose. The operator injects a global
  # default of archive_timeout = '5min', which already bounds worst-case RPO
  # to 5 minutes — well inside the ~1h target. Setting it higher here would
  # only loosen that bound; setting it lower mostly buys padded 16MB segment
  # uploads on an idle database. Revisit only with real write-rate data.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup

  # Login roles, reconciled by the operator from Git. Declared here rather than
  # created by SQL because this cluster has no superuser secret
  # (enableSuperuserAccess defaults to false), so nothing else could issue
  # CREATE ROLE — and because a role that exists only as a side effect of a
  # migration script is invisible to anyone reading the cluster definition.
  #
  # Three roles, three different reaches — "the consumer cannot do more than
  # its job needs," applied twice. Grafana connects as the reader and holds
  # SELECT on the view layers only. n8n connects as the ingest role and can
  # write and read raw data, nothing else. lifeos_writer, which owns the
  # database and can run arbitrary DDL, is used by nothing except the schema
  # CronJob — no human-editable workflow holds schema-level rights. See
  # docs/lifeos-warehouse.md.
  managed:
    roles:
      - name: lifeos_writer
        login: true
        # Owns database `lifeos` (see database-lifeos.yaml) and every object the
        # schema CronJob creates in it. Deliberately not SUPERUSER, CREATEDB or
        # CREATEROLE — owning one database is the whole job. Schema management
        # only: ingestion connects as lifeos_ingest below, not this role. It
        # used to be this role too, until a review pass over this file asked
        # whether the role that writes data needs the same reach as the role
        # that owns the schema — it should not, since a workflow mistake or a
        # compromised credential should be able to write a bad row, not run
        # DROP TABLE.
        passwordSecret:
          name: lifeos-writer-credentials
      - name: lifeos_ingest
        login: true
        # n8n's connection for writing raw data. The schema DDL grants it
        # SELECT + INSERT on raw only — SELECT because the documented ingest
        # contract's idempotent-insert check reads the table it is about to
        # write to. No CREATE, ALTER or DROP anywhere, and no reach into core
        # or mart at all.
        passwordSecret:
          name: lifeos-ingest-credentials
      - name: lifeos_reader
        login: true
        # Holds no privileges at creation. The schema DDL grants it SELECT on
        # core and mart, and never on raw — the view layers read raw through
        # their owner's rights, so the reader gets curated data without being
        # able to touch the landing tables.
        passwordSecret:
          name: lifeos-reader-credentials
      - name: mcp_postgres
        login: true
        # Dedicated credential for the mcp-postgres MCP server
        # (kubernetes/apps/mcp/mcp-postgres) — deliberately a separate role
        # from lifeos_reader rather than sharing it, so an LLM-driven client's
        # access can be revoked or narrowed without touching Grafana's. Same
        # scope as lifeos_reader in practice: the schema DDL (see
        # kubernetes/apps/lifeos/warehouse/app/schema.yaml) grants it SELECT
        # on core and mart only, never raw.
        passwordSecret:
          name: mcp-postgres-credentials

  # Single Longhorn replica on purpose: PostgreSQL is already replicating across
  # the three instances, so 3-replica Longhorn underneath would store 9 physical
  # copies of the same data. 3 instances x 1 replica == the same 3 copies a
  # single instance on `longhorn-no-backup` would have kept.
  # Trade-off: losing a node destroys that instance's volume outright, so CNPG
  # re-clones the replica from the primary rather than re-attaching. Normal
  # CNPG behaviour, but I/O-heavy for a large database.
  # Scraping is wired by an explicit PodMonitor in ./podmonitor.yaml, NOT by
  # `monitoring.enablePodMonitor`. That field is marked Deprecated in the CNPG
  # API ("This feature will be removed in an upcoming release. If you need this
  # functionality, you can create a PodMonitor manually") — relying on it means
  # an operator upgrade could silently delete the generated PodMonitor and take
  # every Postgres alert blind, which is the exact fail-open condition this work
  # exists to remove. Owning the object outright survives that.
  #
  # Without some PodMonitor, nothing scrapes the instances at all: the operator's
  # own (from the Helm chart) covers only the controller, while the ~460 `cnpg_*`
  # and `barman_cloud_cloudnative_pg_io_*` series that describe this database are
  # served on port 9187 of each instance pod.

  storage:
    storageClass: longhorn-1-no-backup
    size: 10Gi

  # INFORMED GUESS — no workload on this cluster yet, so these are not measured.
  # Revisit once there is ~14d of real data (see docs/plan-cloudnative-pg.md).
  # No CPU limit by repo convention: CFS throttling is especially harmful to a
  # database (latency spikes while locks are held). Memory limit only.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
