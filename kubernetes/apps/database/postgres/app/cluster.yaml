---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # `required`, not the operator's `preferred` default. Under scheduling
  # pressure `preferred` permits all three instances onto one node, which would
  # silently yield zero node-failure tolerance while still looking like HA.
  # The trade-off is that instances stay Pending rather than co-locating if
  # fewer than three eligible nodes are available — the correct failure mode
  # here, and visible rather than silent.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  # No archive_timeout override on purpose. The operator injects a global
  # default of archive_timeout = '5min', which already bounds worst-case RPO
  # to 5 minutes — well inside the ~1h target. Setting it higher here would
  # only loosen that bound; setting it lower mostly buys padded 16MB segment
  # uploads on an idle database. Revisit only with real write-rate data.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup

  # Single Longhorn replica on purpose: PostgreSQL is already replicating across
  # the three instances, so 3-replica Longhorn underneath would store 9 physical
  # copies of the same data. 3 instances x 1 replica == the same 3 copies a
  # single instance on `longhorn-no-backup` would have kept.
  # Trade-off: losing a node destroys that instance's volume outright, so CNPG
  # re-clones the replica from the primary rather than re-attaching. Normal
  # CNPG behaviour, but I/O-heavy for a large database.
  # Without this, nothing scrapes the instances. The operator's own PodMonitor
  # (from the Helm chart) covers only the controller; the ~460 `cnpg_*` series
  # that actually describe this database — backup age, WAL archiver counters,
  # replication lag — are served on port 9187 of each instance pod and were
  # being generated and discarded. `cnpg-default-monitoring` defines the queries
  # but does not cause anything to collect their results.
  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: longhorn-1-no-backup
    size: 10Gi

  # INFORMED GUESS — no workload on this cluster yet, so these are not measured.
  # Revisit once there is ~14d of real data (see docs/plan-cloudnative-pg.md).
  # No CPU limit by repo convention: CFS throttling is especially harmful to a
  # database (latency spikes while locks are held). Memory limit only.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
