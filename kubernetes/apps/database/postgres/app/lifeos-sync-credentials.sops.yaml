# PLACEHOLDER — not real SOPS ciphertext. The repo owner must replace both
# stringData values below with real ones and encrypt the file before this
# merges:
#   sops -e -i kubernetes/apps/database/postgres/app/lifeos-sync-credentials.sops.yaml
# username is lifeos_sync. Generate the password yourself (at least 32 random
# characters). DO NOT MERGE with the placeholders in place: Flux would apply the
# literal text as the role's password.
#
# Password for the lifeos_sync role CNPG manages (cluster.yaml). The role reads
# the work-calendar views in schema `sync` for n8n's calendar-apply workflow
# (docs/lifeos-calendar.md).
#
# Only this one copy exists. lifeos_ingest has no copy in the default namespace
# either: n8n keeps its database credentials in its own store, entered by hand in
# the UI, so the same password is typed into an n8n "Postgres" credential for
# this role. Whichever you rotate, rotate both. See "Roles and credentials" in
# docs/lifeos-calendar.md.
apiVersion: v1
kind: Secret
metadata:
  name: lifeos-sync-credentials
type: kubernetes.io/basic-auth
stringData:
  username: ENC[AES256_GCM,data:REPLACE_ME]
  password: ENC[AES256_GCM,data:REPLACE_ME]
