# Passwords for the three LifeOS roles CNPG manages on this cluster.
#
# lifeos_writer and lifeos_reader also exist in the lifeos namespace
# (kubernetes/apps/lifeos/warehouse/app/secret.sops.yaml and the Grafana
# HelmRelease's env respectively) because a Secret cannot be read across
# namespaces. lifeos_ingest does not — it belongs to n8n, which runs in the
# default namespace, and needs its own copy created there once that
# integration is built. Whichever role you rotate, rotate every copy.
