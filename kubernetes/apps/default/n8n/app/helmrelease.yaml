---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: n8n
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.36.5
            envFrom:
              - secretRef:
                  name: n8n-smtp-secret
            env:
              DB_SQLITE_VACUUM_ON_STARTUP: true
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 336
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
              GENERIC_TIMEZONE: ${TIMEZONE}
              N8N_METRICS: "true"
              # N8N_METRICS alone only serves the endpoint with process/default
              # metrics. The workflow success/failure counters come from n8n's
              # internal event bus, which is gated separately and defaults to off.
              # Without this the n8n PrometheusRule and dashboards query series that
              # never exist — and an alert on an absent series does not error, it
              # silently never fires. Verified against n8n 2.33.3's
              # PrometheusMetricsConfig (includeMessageEventBusMetrics, default false).
              N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
              # Attributes a failure to a specific workflow. Adds workflow_id to the
              # event-bus counters (one series per workflow — cheap) and also to the
              # n8n_workflow_execution_duration_seconds histogram (16 buckets x 2
              # statuses x mode per workflow — the costly one). If that histogram's
              # cardinality ever needs trimming, drop its _bucket series with a
              # metricRelabeling on the ServiceMonitor rather than unsetting this:
              # _count/_sum keep working and per-workflow attribution is the point.
              N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
              # Publishes n8n_workflow_info / n8n_active_workflow_info — a
              # workflow_id -> workflow_name gauge the rules and dashboards join
              # against. Deliberately used INSTEAD of
              # N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: stamping the user-editable
              # name onto every counter means renaming a workflow orphans its old
              # series and splits its history. The join keeps names in one place.
              N8N_METRICS_INCLUDE_WORKFLOW_INFO: "true"
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"
              N8N_PORT: &port 443
              N8N_HOST: &hostName workflow.${SECRET_DOMAIN}
              N8N_EDITOR_BASE_URL: https://workflow.${SECRET_DOMAIN}
              WEBHOOK_URL: https://workflow-hook.${SECRET_DOMAIN}/
              N8N_PROXY_HOPS: 1
              N8N_LOG_LEVEL: warn
              N8N_LOG_OUTPUT: console
            resources:
              requests:
                # Idles ~6m; 50m keeps burst headroom without over-reserving
                # scheduling capacity (limits below still allow bursting).
                cpu: 50m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: n8n
          gethomepage.dev/title: n8n
          gethomepage.dev/description: "N8N Automation Platform"
          gethomepage.dev/group: "Automation"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=n8n"
        hostnames:
          - *hostName
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
      webhooks:
        hostnames:
          - workflow-hook.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  value: /webhook
            backendRefs: [{}]
    persistence:
      data:
        existingClaim: n8n
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n

      tmp:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.cache