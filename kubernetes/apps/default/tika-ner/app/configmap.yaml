---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tika-ner-config
data:
  # Order matters: Tika composes parsers per mime-type and the LAST entry wins a
  # given type. default-parser and named-entity-parser both claim text/plain, so
  # named-entity-parser must stay after default-parser or NER silently stops
  # working (server starts fine, /rmeta returns 200, just no ner:* fields).
  tika-config.json: |
    {
      "server": {},
      "parsers": [
        { "default-parser": {} },
        { "named-entity-parser": {} }
      ]
    }
