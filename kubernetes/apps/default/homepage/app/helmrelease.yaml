---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: homepage
  values:
    controllers:
      main:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.0.0
            env:
              HOMEPAGE_ALLOWED_HOSTS: "home.${SECRET_DOMAIN},grafana.koopmans.co,longhorn.koopmans.co"
            # envFrom:
            #   - secretRef:
            #       name: homepage-secret
            # OOMKilled within the 14d window ending 2026-08-06 despite a
            # measured peak of 126.2Mi against the previous 200Mi limit. Steady
            # state is ~113Mi, so the kill came from a spike the 30s scrape
            # never sampled — headroom that looks sufficient on paper isn't.
            # Request was still 10Mi (pre-measurement placeholder) — far below
            # steady state, under-booking the node's schedulable memory and
            # leaving the pod first in line for eviction under pressure.
            # Bumped to match steady state (2026-08-08).
            resources:
              requests:
                memory: 128Mi
                cpu: 10m
              limits:
                memory: 384Mi

    serviceAccount:
      homepage: {}

    defaultPodOptions:
      automountServiceAccountToken: true

    service:
      main:
        ports:
          http:
            port: &port 3000

    route:
      main:
        hostnames: [&host "home.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port

    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml
