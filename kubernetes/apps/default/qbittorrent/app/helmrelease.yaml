---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          browser:
            image:
              repository: docker.io/library/caddy
              tag: 2.11.4-alpine

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                add: [NET_BIND_SERVICE]
              readOnlyRootFilesystem: true
              runAsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001

            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3

            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN

            env:
              FIREWALL_INPUT_PORTS: "8080,8081"
              LOG_LEVEL: warn
              OPENVPN_VERBOSITY: "1"
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: gluetun-secret

            # Sidecar carries the whole pod's network path. Sized off a measured
            # 14d peak of ~103Mi (Thanos, container_memory_working_set_bytes):
            # request covers the observed high-water mark, limit leaves 2.5x for
            # reconnect bursts the 30s scrape interval can't see.
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi

          main:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3

            tty: true
            stdin: true

            dependsOn:
              - gluetun

            env:
              QBT_WEBUI_PORT: &webPort 8080
              QBT_TORRENTING_PORT: &torrentPort 53712
            nameOverride: *app

            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001


    defaultPodOptions:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [1001]

    configMaps:
      browser-caddyfile:
        data:
          Caddyfile: |-
            {
              admin off
            }

            :8081 {
              root * /downloads
              file_server browse
            }

    service:
      main:
        controller: main
        ports:
          http:
            port: *webPort
      browser:
        ports:
          http:
            port: &browserPort 8081

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: https://qbittorrent.${SECRET_DOMAIN}/favicon.ico
          gethomepage.dev/title: qBittorrent
          gethomepage.dev/description: "qBittorrent Download Manager"
          gethomepage.dev/group: "Downloads"
        hostnames: ["qbittorrent.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *webPort

      browser:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: https://downloads.${SECRET_DOMAIN}/favicon.ico
          gethomepage.dev/title: Download Files
          gethomepage.dev/description: "Download File Browser"
          gethomepage.dev/group: "Downloads"
        hostnames: ["downloads.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: browser
                port: *browserPort

    persistence:
      config:
        existingClaim: qbittorrent-config

      downloads:
        existingClaim: qbittorrent-downloads

      tmp:
        type: emptyDir

      browser-caddyfile:
        type: configMap
        identifier: browser-caddyfile
        advancedMounts:
          main:
            browser:
              - path: /etc/caddy
                readOnly: true

      browser-data:
        type: emptyDir
        advancedMounts:
          main:
            browser:
              - path: /data