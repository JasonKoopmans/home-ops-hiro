---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 30m
  values:
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.10.0-java25
    # Memory/CPU are informed guesses for ~10 players (Paper + Geyser + ViaVersion),
    # not measured: revisit with max_over_time(container_memory_working_set_bytes) after a
    # week of real play. Heap is explicit (MEMORY) so it cannot drift with the limit.
    resources:
      limits:
        memory: 5Gi
      requests:
        cpu: 500m
        memory: 4Gi
    securityContext:
      runAsUser: &APP_UID 568
      fsGroup: &APP_GID 568
    livenessProbe:
      initialDelaySeconds: 0
    readinessProbe:
      initialDelaySeconds: 0
    startupProbe:
      enabled: true
    extraEnv:
      TZ: "${TIMEZONE}"
      ENABLE_ROLLING_LOGS: true
      UID: *APP_UID
      GID: *APP_GID
      # Enforce the allowlist for Java and Floodgate (Bedrock) players alike.
      ENFORCE_WHITELIST: "TRUE"
      # ViaVersion: Geyser imitates a newer Java client than Paper 1.21.10 speaks.
      SPIGET_RESOURCES: "19254"
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft-pvc
    minecraftServer:
      eula: true
      version: 1.21.10
      type: PAPER
      difficulty: normal
      whitelist: "GachouGoose,movi"
      ops: "movi,GachouGoose"
      pvp: false
      motd: Family Minecraft
      # New world for the family server; the old Kubeworld stays on the volume.
      worldSaveName: FamilyWorld
      viewDistance: 9
      maxPlayers: 20
      forceReDownload: true
      memory: 3G
      jvmXXOpts: "-Ddisable.watchdog=true -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"
      # Geyser reads these system properties ahead of its config.yml, so the transport lives
      # in Git rather than in a plugin file generated on first start. NetherNet (Bedrock
      # 26.60+ rejects RakNet): built-in signaling uses TCP on the port and gameplay uses UDP
      # on the same port; the advertised address is the envoy-internal LAN VIP. Raw -D flags
      # in JVM_OPTS: itzg's JVM_DD_OPTS splits on spaces, so a comma list arrived as one
      # value and Geyser ignored it.
      jvmOpts: "-DgeyserTransport=nethernet -DgeyserUdpPort=19132 -DgeyserSignalingMode=builtin -DgeyserAdvertiseAddresses=${ENVOY_INTERNAL_ADDR}"
      pluginUrls:
        - https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        - https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      # RCON is for the mc-backup sidecar only (localhost); it is never routed.
      rcon:
        enabled: true
        existingSecret: minecraft-rcon
      # Must sit under minecraftServer: at the top level the chart ignored it, which is
      # why the Service carried only 25565. Both entries share the Service so the
      # gateway routes can reach 19132 over TCP (NetherNet signaling) and UDP (gameplay).
      extraPorts:
        - name: bedrock-tcp
          containerPort: 19132
          protocol: TCP
          service:
            enabled: true
            embedded: true
            port: 19132
        - name: bedrock-udp
          containerPort: 19132
          protocol: UDP
          service:
            enabled: true
            embedded: true
            port: 19132
    mcbackup:
      enabled: true
      image:
        tag: 2026.10.3
      backupInterval: 6h
      initialDelay: 5m
      # Time-only retention: 6h x 3d = 12 archives must fit in the 5Gi backup PVC, so this
      # holds while an archive stays under ~400MB. Guess; raise PVC and days together.
      pruneBackupsDays: 3
      pauseIfNoPlayers: "true"
      persistence:
        # The chart reads storageClass here, not under backupDir.
        storageClass: longhorn-no-backup
        backupDir:
          enabled: true
          Size: 5Gi
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
