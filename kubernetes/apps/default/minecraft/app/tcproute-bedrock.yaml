---
# yaml-language-server: $schema=https://crd.movishell.pl/gateway.networking.k8s.io/tcproute_v1alpha2.json
# NetherNet signaling: Geyser listens on TCP and UDP of the same port.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: minecraft-bedrock-signaling
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: minecraft-bedrock-signaling
  rules:
    - backendRefs:
        - name: minecraft
          port: 19132
