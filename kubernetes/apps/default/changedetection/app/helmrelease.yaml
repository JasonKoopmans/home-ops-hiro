---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app changedetection
spec:
  interval: 1h
  # An image bump can leave the pod in ContainerCreating for ~10 min when it lands
  # on hiro-cmp-05, whose system disk is ~10-30x slower than the other nodes'
  # (2026-10-03: 9m40s to Ready; Helm's 5m default gave up and Flux stalled the
  # release). `legacy` wait so this timeout is the only clock: the default `poller`
  # strategy also fails the release once the Deployment passes its fixed 10m
  # progressDeadlineSeconds, which app-template cannot raise. See freecad.
  timeout: 20m
  waitStrategy:
    name: legacy
  chartRef:
    kind: OCIRepository
    name: changedetection
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.70.4
            env:
              TZ: ${TIMEZONE}
              BASE_URL: https://changedetection.${SECRET_DOMAIN}
              PLAYWRIGHT_DRIVER_URL: ws://127.0.0.1:3000
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

          playwright:
            image:
              repository: dgtlmoon/sockpuppetbrowser
              tag: 0.0.5
            securityContext:
              capabilities:
                add:
                  - SYS_ADMIN
            # sockpuppetbrowser (headless Chrome) idles at 100-310MiB, then steps to
            # the limit within one 30m window and is OOMKilled (2026-11-14 to 11-16:
            # 4 kills, then 12 restarts by 11-19; PodMemoryRestartedWhileHot,
            # critical). Not steady growth. Every peak reads exactly the old 1Gi
            # limit, so real demand is UNKNOWN; 14d peaks on 0.0.3 were
            # 0.68-0.82GiB. 2Gi is a guess at ~2x that, not a measured ceiling.
            # If the working set still hits 2Gi, raising it again will not help:
            # cap concurrent Chrome sessions or restart the sidecar instead.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: &port 5000

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: https://changedetection.io/favicon.ico
          gethomepage.dev/title: changedetection
          gethomepage.dev/description: "Website change detection"
          gethomepage.dev/group: "Automation"
        hostnames:
          - changedetection.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port

    persistence:
      data:
        existingClaim: changedetection-data
        globalMounts:
          - path: /datastore

      tmp:
        type: emptyDir
