---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app audacity
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: audacity
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/audacity
              tag: latest@sha256:ea751b7f0d9a711ea3268c443bbee820dc89b9bf7c7b8f3971fac70c65c13b5b
            env:
              TZ: ${TIMEZONE}
              PUID: "1001"
              PGID: "1001"
              DOCKER_MODS: linuxserver/mods:universal-package-install
              INSTALL_PACKAGES: ffmpeg
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 1001

    service:
      app:
        controller: main
        ports:
          http:
            port: 3000

    # No `route:` block on purpose. audacity's HTTPRoute lives in ./httproute.yaml so
    # its backendRef can point at the KEDA interceptor in the `keda` namespace instead
    # of this app's own Service — a cross-namespace ref the chart's route helper
    # cannot express. Traffic path and idle policy are in ./httpscaledobject.yaml.
    # See docs/ephemeral-apps-keda.md.

    persistence:
      config:
        existingClaim: audacity-config
        globalMounts:
          - path: /config

      tmp:
        type: emptyDir
