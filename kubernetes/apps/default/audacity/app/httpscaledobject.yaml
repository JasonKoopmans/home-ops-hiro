---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: audacity
spec:
  hosts: ["audacity.${SECRET_DOMAIN}"]
  scaleTargetRef:
    # One object carries both the workload and the Service. `service` is required;
    # `port` and `portName` are mutually exclusive (CEL-validated by the CRD).
    name: audacity
    service: audacity
    port: 3000
  replicas:
    min: 0
    max: 1
  # Seconds of no in-flight requests before scaling back to zero. 300 is a guess:
  # long enough that closing a browser tab briefly does not cost a full cold start,
  # short enough to observe the cycle during this pilot. UNMEASURED — revisit once
  # there is real usage data. See docs/ephemeral-apps-keda.md.
  scaledownPeriod: 300
  scalingMetric:
    # concurrency (in-flight requests), NOT requestRate. audacity is a Selkies GUI
    # stream: an active session is one long-lived websocket that generates no new
    # requests once established. Under requestRate that session reads as idle and
    # gets scaled out from under the user mid-use. Under concurrency the held
    # connection counts as in-flight for its whole duration.
    concurrency:
      targetValue: 100
  timeouts:
    # How long the interceptor holds a cold request while the pod comes up. Now that
    # audacity has a readiness probe, "ready" genuinely means "serving", so this has to
    # cover real app boot: 4m11s measured on 2026-08-30 (Selkies + Xwayland, then the
    # DOCKER_MODS ffmpeg apt install, which is network-dependent). 10m gives ~2x margin.
    #
    # This deliberately does NOT try to cover a cold image pull. audacity's image is
    # 1.07 GB and took 15m50s to pull onto a node that had no layers cached. Stretching
    # this to 20m would just hang the browser for 20 minutes; failing and letting the
    # retry land after the pull completes is the better outcome. The real fix is a LAN
    # registry pull-through cache — see docs/ephemeral-apps-keda.md.
    conditionWait: 10m
