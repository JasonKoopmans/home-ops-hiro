---
# PLACEHOLDER — NOT YET ENCRYPTED. The value below is a literal placeholder string, not ciphertext, and
# this app will not reconcile until it is replaced and the file is encrypted by the repo owner:
#
#   1. Build the dockerconfigjson for a ghcr.io PAT (classic, read:packages only) scoped to
#      jasonkoopmans/pocket-bridge, and put it in .dockerconfigjson as a base64 string.
#   2. sops --encrypt --in-place kubernetes/apps/default/pocket-bridge/app/pocket-bridge-pullsecret.sops.yaml
#
# ghcr.io/jasonkoopmans/pocket-bridge is a private package, so the sync CronJob cannot pull without this.
# Deliberately a separate Secret from recording-annotator-pullsecret even though the registry and account
# are the same: that one belongs to a different Flux Kustomization, and a shared Secret would be co-owned
# and pruned out from under whichever app outlives the other.
apiVersion: v1
kind: Secret
metadata:
  name: pocket-bridge-pullsecret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ENC[AES256_GCM,placeholder]
