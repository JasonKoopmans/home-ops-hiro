# Hermes AI Agent — provider + platform secrets (SOPS/age encrypted).
# Single source of truth for Hermes credentials (migrated from /opt/data/.env).
# Injected as container env via HelmRelease `envFrom: secretRef`.
#
# PROVIDER ROUTING (see README) — rebuilt 2026-08-29:
#   Primary  : OpenRouter free tier -> OPENROUTER_API_KEY  (minimax/minimax-m3:free)
#              Free tier = 20 req/min, 50 req/day at $0 lifetime credits (1000/day once
#              >=$10 has ever been purchased). The daily cap is the binding constraint.
#   Fallback : Gemini -> GOOGLE_API_KEY  (gemini-flash-lite-latest; FREE-tier key.
#              gemini-flash-latest was 503 UNAVAILABLE on 2026-08-29, flash-lite was not)
#   Anthropic: NOT in the chain — cannot succeed for Hermes-shaped traffic, see below.
#
# ANTHROPIC_API_KEY IS DELIBERATELY BLANK — DO NOT REFILL WITHOUT READING THIS.
#   Hermes does not treat the Anthropic credentials as "primary + manual backup". It
#   auto-seeds EVERY Anthropic env var it finds into one credential pool
#   (agent/credential_pool.py::_seed_from_env, priority: OAuth 1, ANTHROPIC_API_KEY 4)
#   and rotates down that pool with `fill_first`. So whenever the OAuth entry is marked
#   exhausted — which happens on every Hermes request, see below — the pool silently
#   rotates onto ANTHROPIC_API_KEY, which bills a SEPARATE metered Console org
#   (verified 2026-08-09: OAuth org 3878b11e-…, API-key org 67b048cd-…). That rotation is
#   the credit-spend path, and nothing in the logs announces it (only failures log).
#   Keeping this blank makes the pool OAuth-only. Old value is recoverable from git
#   history with age.key if a metered backstop is ever wanted again.
#
# CLAUDE CANNOT SERVE HERMES ON THE PLAN. The billing lane is chosen by REQUEST SHAPE, not
# by the token: Anthropic's classifier demotes anything resembling a third-party agent
# harness to the extra-usage lane, and a $0 extra-usage balance makes that an instant
# HTTP 400 "You're out of extra usage". Bisected 2026-08-09 against Hermes' own captured
# payload and re-verified unchanged 2026-08-29 — it is the SYSTEM PROMPT that trips it, not
# tool names, size, or the product name. Affects every model, Haiku included.
# NOTE: an earlier version of this comment blamed per-model weekly caps. That was wrong.
# A short Claude-Code-shaped curl still gets plan billing, so probes like that mislead.
# CLAUDE_CODE_OAUTH_TOKEN is retained but unused; see README before re-adding Anthropic.
#
# Fill/rotate:  sops kubernetes/apps/default/hermes-ai-agent/app/secret.sops.yaml
# Set CLAUDE_CODE_OAUTH_TOKEN with the output of `claude setup-token`. Note a setup-token
# carries no `user:profile` scope, so /api/oauth/usage 403s and `hermes` cannot read your
# plan windows; `hermes login` mints a full-scope, refreshable token instead.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-ai-agent-secret
  namespace: default
  labels:
    app.kubernetes.io/name: hermes-ai-agent
type: Opaque
