---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-ai-agent
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: hermes-ai-agent
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31
            tty: true
            stdin: true
            args:
              - gateway
              - run
            envFrom:
              - secretRef:
                  name: hermes-ai-agent-secret
            env:
              TZ: ${TIMEZONE}
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              # Pin the Hermes data/config dir onto the persistent volume.
              # Holds config.yaml, .env, auth.json, state.db (FTS5 memory),
              # skills/, cron/, sessions/. Matches the image default today;
              # pinned so an upstream image change can't silently move it off
              # the PVC and drop memory/skills on restart.
              HERMES_HOME: /opt/data
              # Locked-down posture: confine the agent's write_file/patch tool
              # to a scratch dir so it can't clobber its own config/skills/DB or
              # anything else under /opt/data. Result filing to Obsidian/Todoist
              # goes via their REST APIs (network), not disk, so this doesn't
              # block dispatch. Widen to /opt/data to relax.
              HERMES_WRITE_SAFE_ROOT: /opt/data/workspace
              # Web dashboard (config/API-keys/sessions UI). The image already
              # ships a supervised s6 slot for this — gated by HERMES_DASHBOARD,
              # a no-op/down slot otherwise. Auth is the bundled basic_auth
              # provider (HERMES_DASHBOARD_BASIC_AUTH_* in the Secret); a
              # non-loopback bind hard-fails closed without it.
              HERMES_DASHBOARD: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &healthPath /health
                    port: &apiPort 8642
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *healthPath
                    port: *apiPort
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *healthPath
                    port: *apiPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                # Idles ~3m; 50m keeps burst headroom without over-reserving
                # scheduling capacity (limits below still allow bursting).
                cpu: 50m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *apiPort
          dashboard:
            port: &dashboardPort 9119

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/title: Hermes
          gethomepage.dev/description: "Hermes AI Agent Gateway"
          gethomepage.dev/group: "Automation"
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Dashboard mounted at /dashboard on the same host, ahead of the
          # catch-all API rule below (Gateway API evaluates in list order).
          # The app's own auth-gate allowlist (_GATE_PUBLIC_PREFIXES in
          # hermes_cli/dashboard_auth/middleware.py) matches literal paths
          # like "/login" with NO prefix awareness — it expects the proxy
          # to strip the mount prefix before forwarding, and only uses
          # X-Forwarded-Prefix to reconstruct the prefix back onto outgoing
          # Location headers / cookie paths / asset URLs (see
          # hermes_cli/dashboard_auth/prefix.py). Forwarding "/dashboard/login"
          # unrewritten made every request — including the login page itself —
          # look non-public, causing a redirect loop. URLRewrite strips the
          # prefix for the backend; the header lets it add "/dashboard" back
          # for the browser.
          - matches:
              - path:
                  type: PathPrefix
                  value: /dashboard
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-Prefix
                      value: /dashboard
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - identifier: app
                port: *dashboardPort
          # The dashboard's login page (hermes_cli/dashboard_auth/login_page.py)
          # POSTs via a hardcoded absolute path — fetch('/auth/password-login') —
          # with no prefix awareness at all (unlike the OAuth redirect_uri/cookie
          # logic, which does honour X-Forwarded-Prefix). Loaded from
          # /dashboard/login, that fetch still targets root /auth/password-login,
          # which would otherwise fall through to the API catch-all below and
          # 403 (the aiohttp API server on *apiPort has no such route). Root
          # /auth/* doesn't collide with the API server's routes (/api/*, /v1/*,
          # /health) so it's safe to send straight to the dashboard, unrewritten.
          - matches:
              - path:
                  type: PathPrefix
                  value: /auth
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-Prefix
                      value: /dashboard
            backendRefs:
              - identifier: app
                port: *dashboardPort
          - backendRefs:
              - identifier: app
                port: *apiPort

    persistence:
      data:
        existingClaim: hermes-ai-agent-data
        advancedMounts:
          hermes:
            app:
              - path: /opt/data

      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
