---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
spec:
  # The Ollama API is unauthenticated and can pull arbitrary models, so only
  # n8n (the classifier caller) may reach it. Scoped to the pod, not the
  # namespace. Dropped traffic is DROPPED, not refused: other callers see a
  # hang-then-timeout.
  #
  # Ingress only, deliberately: the model-pull sidecar needs outbound HTTPS to
  # registry.ollama.ai, and an egress allowlist by FQDN is not expressible in a
  # plain NetworkPolicy. Tighten with a CiliumNetworkPolicy if that matters.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - protocol: TCP
          port: 11434
