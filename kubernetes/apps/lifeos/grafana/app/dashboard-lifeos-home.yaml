---
# Seed dashboard for the Git plane. Two jobs: it documents the workflow where
# the workflow is actually used, and it proves the ConfigMap → sidecar →
# provisioning path works on day one, before any real dashboard depends on it.
#
# Copy this file's shape for real dashboards — label + folder annotation are
# what the sidecar keys on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lifeos-home
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: GitOps
data:
  lifeos-home.json: |
    {
      "uid": "lifeos-home",
      "title": "LifeOS — Start Here",
      "tags": ["lifeos", "gitops"],
      "editable": false,
      "schemaVersion": 39,
      "graphTooltip": 0,
      "time": {"from": "now-6h", "to": "now"},
      "annotations": {"list": []},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Two planes",
          "gridPos": {"h": 13, "w": 12, "x": 0, "y": 0},
          "options": {
            "mode": "markdown",
            "content": "## Git plane — provisioned dashboards\n\nDashboards that come from ConfigMaps in `kubernetes/apps/lifeos/grafana/app/`. Like this one. Each names its folder with a `grafana_folder` annotation; **GitOps** is the convention.\n\nThey are provisioned read-only — Save is disabled on purpose, so a browser edit can never be thrown away by the next reconcile. To change one, edit its ConfigMap and let Flux apply it.\n\n## UI plane — everything authored here\n\nAnything created in the browser lives in Grafana's own database on the Longhorn volume. Draft freely: dashboards, folders, alert rules, playlists, preferences.\n\nThe volume is on the backed-up storage class, so this plane survives pod or node loss — but it is *not* reproducible from Git.\n\n## Which is which\n\nRead-only is enforced per **dashboard**, not per folder. Folder names are not reserved, so a dashboard created here inside the GitOps folder is still a UI dashboard. When it matters, check Dashboard settings → JSON Model.\n\n## Promotion\n\nWhen a UI draft has earned it:\n\n```\ntask lifeos:dashboard:export uid=<dashboard-uid>\n```\n\nThat writes the ConfigMap; commit it, let Flux apply, then delete the UI copy so there is exactly one source of truth."
          }
        },
        {
          "id": 2,
          "type": "text",
          "title": "Data sources",
          "gridPos": {"h": 13, "w": 12, "x": 12, "y": 0},
          "options": {
            "mode": "markdown",
            "content": "### LifeOS Warehouse — uid `lifeos-warehouse`\n\nThe reporting warehouse (`docs/lifeos-warehouse.md`), on the shared CNPG Postgres cluster. Connects as `lifeos_reader`, a role with SELECT on the `core` and `mart` schemas only — nothing on `raw`, the append-only landing tables ingestion writes to. Provisioned from Git and locked for editing in the browser.\n\n### Adding another source\n\n**Credentials belong in Git** → add it to `datasources:` in the HelmRelease with an explicit `uid`, and its secret to `secret.sops.yaml`. Provisioned sources are locked for editing in the browser.\n\n**Just trying something out** → configure it in the UI. It is stored encrypted in the database and backed up with the volume. Move it into Git when it becomes load-bearing.\n\nThe `uid` is the part that matters. Dashboard JSON references sources by uid, so a stable one is what lets a dashboard exported to Git keep working."
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Warehouse typing failures",
          "description": "Non-zero means a source payload stopped matching what a core view expects. Diagnose with: SELECT * FROM core.typing_failures. See docs/lifeos-warehouse.md.",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 13},
          "datasource": {"type": "postgres", "uid": "lifeos-warehouse"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "postgres", "uid": "lifeos-warehouse"},
              "format": "table",
              "rawSql": "SELECT count(*) AS value FROM core.typing_failures"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        }
      ]
    }
