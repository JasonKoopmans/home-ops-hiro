---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  values:
    # ------------------------------------------------------------------------
    # Two planes of configuration, on purpose.
    #
    # This instance is deliberately NOT a clone of monitoring/grafana. That one
    # is 100% declarative and disposable — wipe the PVC and Flux rebuilds it.
    # This one is a personal workspace where dashboards get *drafted* in the UI,
    # so its database holds state that exists nowhere else. The split:
    #
    #   Git plane  — everything below, plus dashboard ConfigMaps in this
    #                directory. Provisioned read-only (allowUiUpdates: false),
    #                so the UI physically cannot drift from Git.
    #   UI plane   — dashboards, folders, playlists, alert rules, preferences
    #                and API tokens created in the browser. Lives in the SQLite
    #                DB on the PVC below.
    #
    # The PVC is therefore load-bearing, not a cache: it uses the backed-up
    # `longhorn` class, unlike the monitoring instance. Draft in the UI, then
    # promote what proves useful into Git (`task lifeos:dashboard:export`).
    # See docs/lifeos-grafana.md.
    # ------------------------------------------------------------------------

    # RWO volume — a rolling update would deadlock on the old pod holding it.
    deploymentStrategy:
      type: Recreate

    replicas: 1

    # Deployment-level, which is where Reloader looks. `auto` rather than
    # naming grafana-secret explicitly: the pod now pulls from two Secrets
    # (grafana-secret directly, warehouse-credentials via
    # GF_WAREHOUSE_READER_PASSWORD below), and a single explicit-name
    # annotation only watches the one Secret it names — a rotation of the other
    # would silently need a manual restart. `auto` watches every
    # ConfigMap/Secret the pod spec actually references, so a third one added
    # later is covered without remembering to update this line. The chart
    # already checksums its own ConfigMaps into the pod template regardless.
    #
    # Note what a Secret-triggered restart does and does not buy: a changed
    # `secret-key` or `reader-password` takes effect on the restart, but a
    # changed `admin-password` does not — see the bootstrap-only note on
    # `admin:` below.
    annotations:
      reloader.stakater.com/auto: "true"

    persistence:
      enabled: true
      type: pvc
      accessModes: ["ReadWriteOnce"]
      # 3 replicas + recurring backups to S3. The UI plane is not reproducible
      # from Git, so this is the only copy of it — do not downgrade to a
      # -no-backup class.
      storageClassName: longhorn
      # INFORMED GUESS — nothing has been written yet. Holds the SQLite DB, the
      # plugin tree under /var/lib/grafana/plugins and the bleve search index.
      # Single-user scale, so 5Gi is headroom rather than a projection. Revisit
      # once there is real dashboard and plugin volume.
      size: 5Gi

    # The chart's default init container runs as root with CHOWN + DAC_OVERRIDE
    # to fix ownership of /var/lib/grafana. `securityContext.fsGroup: 472` (a
    # chart default we keep) already makes kubelet chown the volume recursively
    # on mount, so this is a root container doing work Kubernetes has already
    # done. Off, to keep the pod root-free — matching the posture the rest of
    # the repo takes.
    # If Grafana ever fails to start with a permission error on
    # /var/lib/grafana, flip this back to true and file a follow-up: it means
    # the fsGroup chown did not apply, which would be worth understanding.
    initChownData:
      enabled: false

    # BOOTSTRAP ONLY. Grafana writes this password into its database when it
    # first creates the admin user and never reads it again — on every later
    # start the stored hash wins. So editing the Secret and letting Reloader
    # restart the pod looks like a successful rotation while the old password
    # goes on working. To actually rotate:
    #   kubectl -n lifeos exec deploy/grafana -- \
    #     grafana cli admin reset-admin-password '<new>'
    # then update the Secret to match. That second step is not just tidiness:
    # the dashboard sidecar authenticates to Grafana with these same two keys
    # (REQ_USERNAME/REQ_PASSWORD) to POST the provisioning-reload endpoint, so a
    # Secret left stale gives a permanent 401 loop in the sidecar's logs. Not
    # fatal — the provider re-scans its path every 30s on its own — but it turns
    # dashboard reloads into a polling delay and buries a real error in noise.
    admin:
      existingSecret: grafana-secret
      userKey: admin-user
      passwordKey: admin-password

    envValueFrom:
      # Encrypts secureJsonData rows in the Grafana DB — datasource credentials
      # entered through the UI, among others. Grafana falls back to a published
      # default when unset. It must never change once set: rotating it makes
      # every already-encrypted row undecryptable.
      GF_SECURITY_SECRET_KEY:
        secretKeyRef:
          name: grafana-secret
          key: secret-key
      # Interpolated into the warehouse data source below. The Secret is owned
      # by the warehouse app, not this one — optional: true so that a cold
      # bootstrap where warehouse has not reconciled yet leaves Grafana
      # starting normally with a data source that fails its health check,
      # rather than wedging the pod in CreateContainerConfigError.
      GF_WAREHOUSE_READER_PASSWORD:
        secretKeyRef:
          name: warehouse-credentials
          key: reader-password
          optional: true

    # ---- Git plane: datasources -------------------------------------------
    # The reporting warehouse, on the shared CNPG cluster in the `database`
    # namespace. See docs/lifeos-warehouse.md.
    #
    # The explicit uid is load-bearing: dashboard JSON references data sources
    # by uid, so a stable one is what lets a dashboard exported into Git keep
    # working. Without it Grafana mints a random uid per provisioning run and
    # every promoted dashboard breaks on the next reprovision.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: LifeOS Warehouse
            uid: lifeos-warehouse
            type: postgres
            access: proxy
            isDefault: true
            editable: false
            url: postgres-rw.database.svc.cluster.local:5432
            # -rw resolves to the current primary. Reads could go to -ro and
            # spare the primary, but that service only exists while replicas
            # are healthy, so a single-instance degradation would take the
            # dashboards down with it. Personal-scale reads are not worth that.
            user: lifeos_reader
            jsonData:
              # Modern location for this field — Grafana moved it out of the
              # top level, where it is now ignored for postgres.
              database: lifeos
              sslmode: require
              # postgresVersion deliberately unset. It only gates which query
              # builder features Grafana offers, and guessing it wrong is worse
              # than letting Grafana decide.
              maxOpenConns: 5
              maxIdleConns: 2
              connMaxLifetime: 14400
            secureJsonData:
              # $VAR is Grafana's provisioning interpolation; $$ escapes it past
              # Flux's postBuild substitution.
              password: $$GF_WAREHOUSE_READER_PASSWORD

    # ---- Git plane: alerting ------------------------------------------------
    # The rule logic — what counts as broken — is shared and versionable, so it
    # lives in Git. Where the notification goes is not: this namespace has no
    # SMTP or Telegram token configured, and "which channel should my personal
    # alerts ring on" is a preference rather than a fact about the warehouse.
    # That fits this instance's existing UI-plane philosophy, so it is left
    # unset here on purpose — the rule evaluates and its state is visible under
    # Alerting in the UI, and stays a no-op delivery (Grafana's built-in
    # `grafana-default-email` receiver, unconfigured) until a contact point is
    # wired, in the UI or by name in a follow-up here.
    #
    # Schema confidence, worth recording since this cannot be checked against a
    # live Grafana from here: the top-level shape (groups/rules/data/condition/
    # noDataState/execErrState/for) is copied from Grafana's own docs source
    # (grafana/grafana, docs/sources/alerting/.../file-provisioning/index.md),
    # fetched directly since grafana.com itself is unreachable from this
    # environment. The query -> reduce -> threshold expression chain is the
    # standard idiom for alerting on a non-Prometheus datasource and is
    # corroborated by multiple independent sources, but unlike the schema SQL
    # (parsed with pglast) there was no way to validate this against a real
    # Grafana instance. If it fails to provision, Grafana's dashboard and
    # datasource provisioning are both known to fail closed per-resource rather
    # than aborting startup; alerting is documented as following the same
    # model, but that specific behavior is not verified from here either.
    # Confirm after deploy:
    #   kubectl -n lifeos logs deploy/grafana -c grafana | grep -i provisioning
    alerting:
      warehouse-rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: warehouse
            # Same folder the Git-plane dashboards use, so provisioned
            # resources are grouped together in the UI regardless of type.
            folder: GitOps
            # Tied to the schema CronJob's own cadence — no point checking
            # faster than the data the check depends on can change.
            interval: 1h
            rules:
              - uid: warehouse-typing-failures
                title: Warehouse ingest has typing failures
                condition: C
                data:
                  # A: the check itself. count(*) always returns exactly one
                  # row, so noDataState below is unreachable in practice and set
                  # defensively rather than load-bearing.
                  - refId: A
                    # Unused by this query — SELECT count(*) has no time filter
                    # — but every data node requires the field regardless.
                    relativeTimeRange:
                      from: 21600
                      to: 0
                    datasourceUid: lifeos-warehouse
                    model:
                      datasource:
                        type: postgres
                        uid: lifeos-warehouse
                      rawSql: "SELECT count(*) AS value FROM core.typing_failures"
                      format: table
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: A
                  # B: collapse A's one-row result to a scalar. Required —
                  # threshold evaluates a Number, not a query result frame.
                  - refId: B
                    datasourceUid: "__expr__"
                    model:
                      datasource:
                        type: __expr__
                        uid: "__expr__"
                      type: reduce
                      expression: A
                      reducer: last
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                  # C: the condition. Any typing failure at all is worth
                  # surfacing at this data volume — no reason to tolerate a
                  # nonzero count.
                  - refId: C
                    datasourceUid: "__expr__"
                    model:
                      datasource:
                        type: __expr__
                        uid: "__expr__"
                      type: threshold
                      expression: B
                      conditions:
                        - evaluator:
                            type: gt
                            params: [0]
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                noDataState: OK
                # A failed query (warehouse unreachable, view missing) is
                # itself worth surfacing, distinctly from a real typing
                # failure.
                execErrState: Error
                # No debounce beyond the group's own hourly cadence — with
                # evaluations already an hour apart there is nothing left for a
                # `for` window to filter out, and setting one shorter than the
                # interval would be misleading: Grafana still waits for the
                # next full evaluation before it can confirm the condition held
                # for that long, so the effective delay would be one interval
                # regardless of what this says.
                for: 0m
                annotations:
                  summary: "core.typing_failures is non-empty — a source payload stopped matching what a core view expects."
                  description: "Run `SELECT * FROM core.typing_failures` against the warehouse to see which relation and source. See docs/lifeos-warehouse.md."
                labels:
                  app: warehouse

    # ---- Git plane: dashboards --------------------------------------------
    # The sidecar watches ConfigMaps in this namespace labelled
    # grafana_dashboard: "1" and drops them into the provisioning tree.
    sidecar:
      # The sidecar is a second container in this pod, so the `resources:` block
      # further down bounds Grafana only and leaves the ConfigMap watcher
      # unbounded — which the repo's convention explicitly calls out as a thing
      # to get right.
      #
      # INFORMED GUESS — not measured. It watches a handful of small ConfigMaps
      # in one namespace and is idle between events. Memory limit is ~4x the
      # request to absorb a burst of simultaneous dashboard writes. No CPU limit,
      # per repo convention. Revisit if it ever shows up in the pod-limit
      # pressure alerts.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      dashboards:
        enabled: true
        label: grafana_dashboard
        # Unset = this namespace only. Left alone deliberately: the monitoring
        # instance's dashboards should not leak into the personal one.
        searchNamespace: null
        # Both the sidecar's write root and the provider's scan path. Note
        # `defaultFolderName` is deliberately NOT set: the chart appends it to
        # the sidecar's FOLDER, and reasoning about how that composes with a
        # per-ConfigMap folder annotation is exactly the kind of path arithmetic
        # that fails silently — a dashboard written outside the provider's path
        # is simply never loaded, with no error anywhere. One base directory,
        # one scan path, no arithmetic.
        folder: /tmp/dashboards
        # Each dashboard ConfigMap names its Grafana folder with a
        # `grafana_folder` annotation, which becomes a subdirectory under the
        # base above and then a folder via foldersFromFilesStructure. Every
        # Git-plane ConfigMap should carry it; without one a dashboard lands at
        # the root of the path and shows up outside any folder.
        folderAnnotation: grafana_folder
        provider:
          name: gitops
          foldersFromFilesStructure: true
          # What this actually guarantees: a dashboard *loaded by this provider*
          # cannot be saved from the browser, so a UI edit can never be thrown
          # away by the next reconcile. It does not reserve folder names — an
          # admin can still create a database dashboard inside the GitOps
          # folder. The folder split is the convention; per-dashboard
          # read-only is the enforcement.
          allowUiUpdates: false
          # Removing the ConfigMap removes the dashboard — Git stays the truth
          # for this folder.
          disableDelete: false
      datasources:
        # Datasources come from the chart's own values above, not from labelled
        # ConfigMaps. Nothing to watch.
        enabled: false

    # Sidecar only needs to read ConfigMaps in its own namespace; no reason for
    # a cluster-scoped role.
    rbac:
      create: true
      namespaced: true

    "grafana.ini":
      server:
        root_url: https://lifeos.${SECRET_DOMAIN}
      analytics:
        check_for_updates: false
        reporting_enabled: false
        feedback_links_enabled: false
      users:
        allow_sign_up: false
        allow_org_create: false
        default_theme: dark
      auth.anonymous:
        enabled: false
      security:
        cookie_secure: true
        disable_gravatar: true
      plugins:
        # Deliberately on: trialling a datasource plugin from the UI is part of
        # how this instance is meant to be used. Anything that earns a permanent
        # place should be added to a `plugins:` list in the values above, or it
        # exists only on the PVC and a rebuild comes up without it.
        plugin_admin_enabled: true
      dashboards:
        # Raised from Grafana's 5s default. Personal reporting runs on data that
        # changes when a scheduled job writes it or a human edits something —
        # sub-minute refresh buys nothing and just multiplies query load.
        min_refresh_interval: 1m
      date_formats:
        default_timezone: ${TIMEZONE}
      log:
        mode: console

    # Ingress is Gateway API here — see httproute.yaml.
    ingress:
      enabled: false

    # Prometheus discovers ServiceMonitors cluster-wide
    # (serviceMonitorSelectorNilUsesHelmValues: false), so this instance shows
    # up in the monitoring stack without any change over there.
    serviceMonitor:
      enabled: true

    # INFORMED GUESS — not measured; no dashboards exist yet. Requests match the
    # repo's 50m floor and the monitoring instance's Grafana, which is a
    # reasonable analogue. Revisit once there is ~14d of real usage.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        # No CPU limit, per repo convention — Grafana is bursty on dashboard
        # load and CFS throttling shows up as UI lag. Memory is the resource
        # worth bounding.
        memory: 512Mi

    testFramework:
      enabled: false
