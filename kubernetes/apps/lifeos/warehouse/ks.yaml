---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: warehouse
spec:
  # The schema CronJob connects to a database the postgres app declares, so the
  # Cluster and the lifeos Database CR both need to exist first. The dependency
  # only orders the apply — the CronJob still waits for the database itself,
  # since CNPG reconciles the Database CR asynchronously after its Kustomization
  # reports Ready.
  dependsOn:
    - name: postgres
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/lifeos/warehouse/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: lifeos
  wait: false
