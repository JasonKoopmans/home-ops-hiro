---
# The LifeOS warehouse schema, applied by the CronJob in this directory.
#
# Every statement is idempotent — CREATE ... IF NOT EXISTS, CREATE OR REPLACE
# VIEW, and grants that are safe to re-issue. That is what lets the schema be
# reconciled continuously rather than migrated once, so Git and the database
# converge on their own instead of depending on someone remembering to re-run
# something.
#
# The one thing that isn't free: CREATE OR REPLACE VIEW (and FUNCTION) can
# only change a view's query, never its column names, order, or types —
# Postgres raises rather than allow it, and CREATE TABLE has no REPLACE at
# all. A rename, drop, or type change on something already deployed needs an
# explicit one-time statement, guarded (via information_schema) so it only
# fires on a database still carrying the old shape and becomes a permanent
# no-op after. Keep that guarded statement inline, immediately above the
# CREATE OR REPLACE it repairs — see the DO block above core.health_metrics
# for the pattern — rather than collecting migrations into their own file or
# section. One schema owner and roughly one breaking change a year doesn't
# justify the ordering/tracking-table machinery a real migration tool buys
# you; revisit that trade if this ever gets more than one contributor or
# more than a handful of these.
#
# Deliberately no dollar-quoted strings anywhere in this SQL. Flux's postBuild
# substitution rewrites `$$` to `$`, so a PL/pgSQL function body would be
# silently mangled on its way into the cluster. If this schema ever needs a
# function or trigger, escape accordingly and test the rendered output first.
#
# `${TIMEZONE}` below IS substituted by Flux, deliberately — it resolves from
# cluster-secrets to the cluster timezone, which is what turns an instant into
# the local day a human would call it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-schema
data:
  schema.sql: |
    -- ---------------------------------------------------------------------
    -- Layering: thin medallion.
    --
    --   raw   physical, append-only. One row per *observation* of a record,
    --         never an update in place. Physical because it is the only layer
    --         that cannot be rebuilt from something else.
    --   core  views, plus dim_date. Typed, deduplicated, conformed. snake_case.
    --   mart  views. Shaped for dashboards, and the only layer with
    --         PascalCase column names — see the note above the mart section.
    --
    -- Derived layers are views rather than materialized tables on purpose. In a
    -- lakehouse each layer is materialized because recompute is expensive and
    -- storage is cheap; in one small Postgres those economics invert, and every
    -- materialized layer becomes a copy to keep in sync and backfill. Promote a
    -- view to MATERIALIZED the day it is measurably slow, not before.
    --
    -- core.dim_date is the deliberate exception, and the test is worth stating:
    -- materialize when there is a benefit *and* no sync burden. Dates never
    -- change and the table is not derived from raw, so it costs nothing to keep
    -- current — while being a real table gives the planner statistics that a
    -- generate_series function scan cannot. See its own comment below.
    -- ---------------------------------------------------------------------
    CREATE SCHEMA IF NOT EXISTS raw;
    CREATE SCHEMA IF NOT EXISTS core;
    CREATE SCHEMA IF NOT EXISTS mart;

    -- ---------------------------------------------------------------------
    -- raw: landing tables
    --
    -- Common shape for every source:
    --   source       which integration produced this
    --   natural_key  the source's own stable id for the record
    --   ingested_at  when we saw it — the axis corrections travel along
    --   payload      the record exactly as the source gave it
    --
    -- The "when did it happen" column deliberately varies by source, because
    -- grain does. A daily activity ring is a date with no meaningful instant;
    -- a completed task is an instant. Forcing both into timestamptz would mean
    -- inventing a time of day for the former and then guessing a timezone to
    -- get the date back out — an error that hides until a chart is off by one
    -- day near midnight.
    --
    -- payload stays jsonb rather than typed columns because these APIs change
    -- shape without warning. A new field, a renamed one, a type change: none
    -- can break ingestion, only the view above it — and no data is at risk
    -- while the view is fixed.
    --
    -- How core actually absorbs such a change, since "edit the view" is not an
    -- answer on its own:
    --
    --   Renamed field  COALESCE(payload ->> 'newName', payload ->> 'oldName').
    --                  Keyed off the payload, not off a cutover date, because
    --                  the payload is self-describing and a date is a proxy
    --                  that a re-ingest or backfill can make wrong.
    --   Changed type   jsonb_typeof() guards the cast, so the odd row degrades
    --                  to NULL instead of raising and taking the whole view —
    --                  and every degraded row shows up in core.typing_failures.
    --   New field      add it to the view. Old rows return NULL, which is the
    --                  truth: we did not observe it then.
    --
    -- The case none of that catches is a *semantic* change — same key, same
    -- type, different meaning, e.g. a value switching from minutes to seconds.
    -- Nothing in the payload distinguishes it, so the only fix is a version
    -- stamp set at ingest. There is no payload_version column today because
    -- adding one later is lossless: ALTER TABLE ... ADD COLUMN payload_version
    -- smallint NOT NULL DEFAULT 1 correctly labels every existing row, since by
    -- definition they are all version 1. Adding it now would cost noise on
    -- every insert in exchange for nothing until that first semantic change.
    -- ---------------------------------------------------------------------

    -- Apple activity rings (Move / Exercise / Stand), long-format: one row per
    -- (day, metric). Reaches us via a Google Sheet that n8n reads, but `source`
    -- names where the data comes from rather than how it travels — swap the
    -- sheet for the Apple Health API later and history stays continuous.
    --
    -- natural_key is 'YYYY-MM-DD:Metric', which is exactly the grain the sheet
    -- is unique on.
    CREATE TABLE IF NOT EXISTS raw.health_metrics (
        ingest_id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source      text        NOT NULL,
        natural_key text        NOT NULL,
        observed_on date        NOT NULL,
        ingested_at timestamptz NOT NULL DEFAULT now(),
        payload     jsonb       NOT NULL
    );

    -- Todoist completed tasks. Event grain — completed_at is a real instant.
    CREATE TABLE IF NOT EXISTS raw.todoist_completed_tasks (
        ingest_id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source       text        NOT NULL,
        natural_key  text        NOT NULL,
        completed_at timestamptz NOT NULL,
        ingested_at  timestamptz NOT NULL DEFAULT now(),
        payload      jsonb       NOT NULL
    );

    -- Todoist's keyed reference data: projects, labels, sections, and whatever
    -- else turns out to have an id worth resolving to a name.
    --
    -- One table with a `kind` discriminator rather than one table per kind.
    -- These all share a shape (id, name, some attributes) and differ only in
    -- what they name, so a table each would be the same DDL copied N times —
    -- and adding the next lookup would need a schema change plus a deploy.
    -- Here it needs neither: n8n starts writing a new `kind` and a one-line
    -- core view exposes it.
    --
    -- Snapshot grain: the source reports current state rather than emitting
    -- events, so a rename arrives as a changed payload and lands as a new
    -- observation. observed_on is the day we saw that state.
    CREATE TABLE IF NOT EXISTS raw.todoist_lookups (
        ingest_id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source      text        NOT NULL,
        kind        text        NOT NULL,
        natural_key text        NOT NULL,
        observed_on date        NOT NULL DEFAULT current_date,
        ingested_at timestamptz NOT NULL DEFAULT now(),
        payload     jsonb       NOT NULL
    );

    -- Serves both the "has this changed since we last saw it" check on write
    -- and the DISTINCT ON in the core views on read.
    CREATE INDEX IF NOT EXISTS health_metrics_key_seen
        ON raw.health_metrics (source, natural_key, ingested_at DESC);
    CREATE INDEX IF NOT EXISTS todoist_completed_key_seen
        ON raw.todoist_completed_tasks (source, natural_key, ingested_at DESC);
    CREATE INDEX IF NOT EXISTS todoist_lookups_key_seen
        ON raw.todoist_lookups (source, kind, natural_key, ingested_at DESC);

    -- Dashboards filter by when things happened, not when we noticed them.
    CREATE INDEX IF NOT EXISTS health_metrics_observed
        ON raw.health_metrics (observed_on DESC);
    CREATE INDEX IF NOT EXISTS todoist_completed_at
        ON raw.todoist_completed_tasks (completed_at DESC);

    -- ---------------------------------------------------------------------
    -- core: current state, typed
    --
    -- DISTINCT ON takes the newest observation per record. Because raw keeps
    -- every version, a correction at the source shows up as a new row and this
    -- view starts returning it, while the history stays queryable underneath —
    -- which is the entire reason raw is append-only.
    -- ---------------------------------------------------------------------
    -- The value cast is guarded rather than bare, and that guard is the whole
    -- answer to "how does core absorb a shape change".
    --
    -- A bare (payload ->> 'value')::numeric raises on the first row where the
    -- source starts sending a non-numeric string, and the *view* fails — so one
    -- bad row takes down every dashboard reading it. Guarding degrades that to
    -- NULL for the offending row, and core.typing_failures below makes those
    -- rows visible instead of letting them vanish quietly.
    --
    -- Both JSON shapes are accepted on purpose: a Google Sheets cell usually
    -- arrives as a string, an API usually sends a number, and the warehouse
    -- should not care which. This is also the pattern for a renamed field —
    -- COALESCE(payload ->> 'newName', payload ->> 'oldName') keys off the
    -- payload itself rather than off a cutover date, because the payload is
    -- self-describing and a date is a proxy that can be wrong.
    --
    -- The view itself was briefly named "units" (#506) before the typo was
    -- caught. CREATE OR REPLACE VIEW can add columns but never rename one —
    -- Postgres rejects the whole statement instead — so once the old name
    -- had shipped, re-running this file with the corrected name failed
    -- every time at exactly this statement (ON_ERROR_STOP + single
    -- transaction meant nothing past it ever applied either, e.g. dim_date
    -- stopped growing).
    --
    -- This migrates the one database that ever ran the old version, using
    -- psql's own \gset/\if rather than a PL/pgSQL DO block: a dollar-quoted
    -- block is exactly what the file-header warning above rules out, and
    -- landing one here first-hand is what confirmed why — a doubled dollar
    -- sign is Flux's escape for a literal single one, so postBuild
    -- substitution silently halved the block's opening and closing quotes
    -- on the way into the cluster, and every run failed on a syntax error
    -- instead. \if reads 'true'/'false' as plain text, so nothing here
    -- needs a dollar sign at all, and it becomes a permanent no-op once
    -- the rename has happened once.
    SELECT CASE WHEN count(*) = 1 THEN 'true' ELSE 'false' END AS already_unit
    FROM information_schema.columns
    WHERE table_schema = 'core'
      AND table_name = 'health_metrics'
      AND column_name = 'units' \gset
    \if :already_unit
        ALTER VIEW core.health_metrics RENAME COLUMN units TO unit;
    \endif

    CREATE OR REPLACE VIEW core.health_metrics AS
    SELECT DISTINCT ON (source, natural_key)
           source,
           natural_key,
           observed_on,
           -- PascalCase keys, not a typo: they're the sheet's own column
           -- headers, passed through by n8n verbatim. Every other payload
           -- in this file is lowercase because it comes from an API with
           -- its own naming, not a spreadsheet.
           payload ->> 'metric' AS metric,
           CASE
               WHEN jsonb_typeof(payload -> 'value') = 'number'
                   THEN (payload ->> 'value')::numeric
               WHEN jsonb_typeof(payload -> 'value') = 'string'
                    AND payload ->> 'value' ~ '[0-9]'
                    AND length(translate(payload ->> 'value', '0123456789.-', '')) = 0
                   THEN (payload ->> 'value')::numeric
           END AS value,
           payload ->> 'unit' AS unit,
           ingested_at
    FROM raw.health_metrics
    ORDER BY source, natural_key, ingested_at DESC;

    -- This view has broken the warehouse-schema CronJob's every hourly run
    -- since 2026-08-29 22:17, in two different ways, each masking the next:
    --
    -- 1) An unconditional `DROP VIEW IF EXISTS core.todoist_completed_tasks;`
    --    used to sit here (from 80c0920). Once mart.daily_overview,
    --    mart.daily_task_completions, and mart.task_completions exist and
    --    depend on this view, that DROP fails: "cannot drop view ... because
    --    other objects depend on it". ON_ERROR_STOP took down the whole
    --    single-transaction script on every run — including core.goals and
    --    everything below it, so none of #513 ever actually applied despite
    --    merging.
    -- 2) Removing the DROP (thinking CREATE OR REPLACE alone would do)
    --    surfaced the reason that DROP existed in the first place: the *live*
    --    view's column order doesn't match this SELECT list — completed_on
    --    and ingested_at are swapped relative to whatever shape is currently
    --    live. CREATE OR REPLACE VIEW can add columns but can never reorder
    --    them ("cannot change name of view column"), so it fails exactly the
    --    same way the bare DROP did.
    --
    -- Fix is the guarded pattern already used above for core.health_metrics'
    -- units→unit rename: detect the OLD column order via information_schema,
    -- and only then DROP ... CASCADE (which also drops the three mart views
    -- that depend on this one — all three have their own CREATE OR REPLACE
    -- later in this same file, so CASCADE plus "keep going" recreates them
    -- fresh in the same transaction). Once this has run on a database with
    -- the new order, the check is false forever and this becomes a permanent
    -- no-op, same as the units→unit guard.
    SELECT CASE WHEN count(*) = 1 THEN 'true' ELSE 'false' END AS todoist_completed_tasks_shape_ok
    FROM information_schema.columns
    WHERE table_schema = 'core'
      AND table_name = 'todoist_completed_tasks'
      AND ordinal_position = 4
      AND column_name = 'ingested_at' \gset
    \if :todoist_completed_tasks_shape_ok
    \else
        DROP VIEW IF EXISTS core.todoist_completed_tasks CASCADE;
    \endif

    CREATE OR REPLACE VIEW core.todoist_completed_tasks AS
    WITH src AS (
    SELECT
        t.*,
        ARRAY(
        SELECT jsonb_array_elements_text(t.payload->'labels')
        WHERE jsonb_typeof(t.payload->'labels') = 'array'
        ) AS label_arr
    FROM raw.todoist_completed_tasks t
    )
    SELECT DISTINCT ON (source, natural_key) source,
        natural_key AS task_key,
        completed_at,
        ingested_at,
        (completed_at AT TIME ZONE '${TIMEZONE}'::text)::date AS completed_on,
        payload ->> 'parent_project_id'::text AS project_id,
        (payload ->> 'parent_item_id')::text as parent_item_id,
        payload ->> NULL AS section_id,
        payload ->> 'object_id'::text as id,
        (payload->>'priority')::int as priority,
        payload ->> 'content'::text AS content,
        payload ->> 'description'::text as description,
        (payload ->> 'due_date')::timestamptz as due_date,
        (payload ->> 'event_date')::timestamptz as event_date,
        (payload ->> 'was_overdue')::boolean as was_overdue,
        payload -> 'labels'::text AS labels,
    (
    SELECT split_part(l, '.', 2)
    FROM unnest(label_arr) AS l
    WHERE l LIKE 'Energy.%'
    LIMIT 1
    ) AS energy,
    (
    SELECT CASE l
        WHEN 'Time.Minimal'     THEN 2
        WHEN 'Time.2Hour'     THEN 120
        WHEN 'Time.4Hour' THEN 240
        ELSE NULLIF(regexp_replace(l, '^Time\.(\d+)Min$', '\1'), l)::int
    END
    FROM unnest(label_arr) AS l
    WHERE l LIKE 'Time.%'
    LIMIT 1
    ) AS time_minutes,
    ('~Personal' = ANY(label_arr)) AS is_personal,
    ('~Work'     = ANY(label_arr)) AS is_Work,
    ('next'     = ANY(label_arr)) AS indicator_next,
    ('ondeck'     = ANY(label_arr)) AS indicator_ondeck,
    ('Someday.Soon'     = ANY(label_arr)) AS indicator_soon,
    ('Someday.Later'     = ANY(label_arr)) AS indicator_later
    FROM src
    ORDER BY source, natural_key, ingested_at DESC;

        CREATE OR REPLACE VIEW core.todoist_lookups AS
        SELECT DISTINCT ON (source, kind, natural_key)
            source,
            kind,
            natural_key            AS lookup_id,
            payload ->> 'name'     AS name,
            payload,
            observed_on,
            ingested_at
        FROM raw.todoist_lookups
        ORDER BY source, kind, natural_key, ingested_at DESC;

    -- Thin conveniences over the discriminator, so joins read as what they are.
    -- Adding the next lookup kind is a copy of one of these.
    CREATE OR REPLACE VIEW core.todoist_projects AS
    SELECT lookup_id AS project_id, name, observed_on, ingested_at
    FROM core.todoist_lookups
    WHERE kind = 'project';

    CREATE OR REPLACE VIEW core.todoist_labels AS
    SELECT lookup_id AS label_id, name, observed_on, ingested_at
    FROM core.todoist_lookups
    WHERE kind = 'label';

    CREATE OR REPLACE VIEW core.todoist_sections AS
    SELECT lookup_id AS section_id, name, observed_on, ingested_at
    FROM core.todoist_lookups
    WHERE kind = 'section';

    -- The join backbone. Health metrics and task completions are both
    -- daily-grain and the interesting questions cross them ("do I close more
    -- tasks on days I hit the Exercise ring?"), which only works against a
    -- spine that has every day — including the days a source recorded nothing.
    -- Left-join to this rather than to each other, or missing days silently
    -- vanish from a chart instead of showing up as the gaps they are.
    --
    -- A table, and the one place this schema materializes something that is not
    -- raw. The reason is the planner, not CPU: generating ~2,400 rows costs
    -- well under a millisecond, but a function scan carries no statistics, so
    -- Postgres falls back to a fixed default row estimate for generate_series
    -- regardless of the real range. Join that against a growing raw table and
    -- the estimate is wrong in a direction that can pick a nested loop where a
    -- hash join belongs. A real table with a primary key and ANALYZEd stats
    -- removes the guess.
    --
    -- It is also the one thing here that costs nothing to keep in sync — the
    -- objection to materializing core and mart is the backfill burden, and past
    -- dates do not change. This is generated reference data, not a
    -- transformation of raw.
    CREATE TABLE IF NOT EXISTS core.dim_date (
        date        date    PRIMARY KEY,
        iso_dow     int     NOT NULL,
        dow_name    text    NOT NULL,
        is_weekend  boolean NOT NULL,
        week_start  date    NOT NULL,
        month_start date    NOT NULL,
        year        int     NOT NULL
    );

    -- quarter and week_number were added after dim_date first shipped.
    -- ADD COLUMN IF NOT EXISTS is idempotent on its own (unlike the rename
    -- above), so no information_schema guard is needed — but the backfill
    -- UPDATE and the NOT NULL below still have to be safe to reissue every
    -- run, since the INSERT below only reaches new rows.
    ALTER TABLE core.dim_date ADD COLUMN IF NOT EXISTS quarter     int;
    ALTER TABLE core.dim_date ADD COLUMN IF NOT EXISTS week_number int;
    UPDATE core.dim_date SET quarter = EXTRACT(quarter FROM date)::int WHERE quarter IS NULL;
    -- EXTRACT(week FROM date) is the ISO 8601 week number, consistent with
    -- iso_dow above — week 1 is the week containing the year's first
    -- Thursday, so late-December/early-January dates can carry the
    -- adjacent year's week number.
    UPDATE core.dim_date SET week_number = EXTRACT(week FROM date)::int WHERE week_number IS NULL;
    ALTER TABLE core.dim_date ALTER COLUMN quarter     SET NOT NULL;
    ALTER TABLE core.dim_date ALTER COLUMN week_number SET NOT NULL;

    -- Extends the spine on every run. ON CONFLICT DO NOTHING makes it
    -- idempotent, and the +30 days of headroom mean "today" always exists even
    -- between hourly runs — a dashboard opened at 00:05 would otherwise find
    -- the current day missing from the spine.
    INSERT INTO core.dim_date (date, iso_dow, dow_name, is_weekend, week_start, month_start, year, quarter, week_number)
    SELECT d::date,
           EXTRACT(isodow FROM d)::int,
           to_char(d, 'Dy'),
           EXTRACT(isodow FROM d)::int >= 6,
           date_trunc('week',  d)::date,
           date_trunc('month', d)::date,
           EXTRACT(year FROM d)::int,
           EXTRACT(quarter FROM d)::int,
           EXTRACT(week FROM d)::int
    FROM generate_series(date '2020-01-01', current_date + 30, interval '1 day') AS d
    ON CONFLICT (date) DO NOTHING;

    -- The point of making it a table. Safe inside the CronJob's single
    -- transaction — ANALYZE may run in a transaction block, unlike VACUUM.
    ANALYZE core.dim_date;

    -- ---------------------------------------------------------------------
    -- core.goals: configurable goal lines, git-owned like dim_date
    --
    -- Not a raw+view stack: nothing "observes" a goal, you declare it in
    -- goals.csv and it converges into the table on the next CronJob tick —
    -- same TRUNCATE+reload contract as dim_date's INSERT, just table-wide
    -- instead of append-only, because history here lives in the effective_date
    -- column (and git log), not in extra rows.
    --
    -- Two goal shapes share one table via goal_type:
    --   threshold   a single day's target for one metric (e.g. Move >= 500
    --               kcal/day). source_metric names which
    --               mart.daily_metric_values series to compare against.
    --   frequency   "hit the underlying threshold N times in a trailing
    --               window" (e.g. 5 of the last 7 days). base_metric points
    --               at the threshold row's `metric` by name — not a FK, by
    --               design: goals.csv is small and human-edited, and a name
    --               match keeps the CSV flat instead of needing a surrogate
    --               id column just for this one reference.
    --
    -- effective_date supports goals changing over time: core.goals_by_date
    -- below resolves, for every day, whichever row has the latest
    -- effective_date <= that day.
    --
    -- polarity ('higher_is_better' / 'lower_is_better') says which way is
    -- good, for Grafana coloring and trend signals — it is NOT the >= vs <=
    -- comparison direction a materialized hit-count would need.
    -- mart.goal_progress below still stops at "here is the actual value and
    -- here is the goal value" for frequency rows rather than a computed
    -- hit-count: counting hits needs a numeric comparison operator, which
    -- polarity's two-value vocabulary doesn't encode. Add a real
    -- comparison-direction column first if a materialized hit-count view is
    -- ever wanted.
    -- value > 0 for every goal shape currently in scope (a calorie/minute/
    -- hit-count target of zero or negative is a fat-fingered CSV edit, not a
    -- real goal) — catches that at load time instead of on a Grafana panel.
    CREATE TABLE IF NOT EXISTS core.goals (
        metric         text    NOT NULL,
        goal_type      text    NOT NULL CHECK (goal_type IN ('threshold', 'frequency')),
        source_metric  text,
        base_metric    text,
        window_days    int,
        effective_date date    NOT NULL,
        goal_text      text    NOT NULL,
        value          numeric NOT NULL CHECK (value > 0),
        unit           text,
        PRIMARY KEY (metric, effective_date),
        CONSTRAINT goals_shape_by_type CHECK (
            (goal_type = 'threshold' AND source_metric IS NOT NULL
                AND base_metric IS NULL AND window_days IS NULL)
            OR
            (goal_type = 'frequency' AND source_metric IS NULL
                AND base_metric IS NOT NULL AND window_days IS NOT NULL AND window_days > 0)
        )
    );

    -- polarity was added after core.goals first shipped, same idempotent
    -- add-then-backfill-then-NOT-NULL shape as dim_date's quarter/week_number
    -- above. Needed here too even though load-goals.sql truncates+reloads
    -- this table every run: that reload is a *separate* transaction that
    -- runs after this one, so a bare ALTER ... SET NOT NULL here would fail
    -- against the still-old rows left by the *previous* hourly run.
    --
    -- No CHECK constraint: ALTER TABLE has no ADD CONSTRAINT IF NOT EXISTS,
    -- and this file can't use a DO block to guard one (see the dollar-quoting
    -- note at the top). The two allowed values are enforced in
    -- load-goals.sql instead, the same way it already refuses an empty
    -- goals.csv.
    --
    -- Every goal in goals.csv today is 'higher_is_better', so that is the
    -- backfill default; a metric where less is better sets
    -- 'lower_is_better' explicitly in its own CSV row.
    ALTER TABLE core.goals ADD COLUMN IF NOT EXISTS polarity text;
    UPDATE core.goals SET polarity = 'higher_is_better' WHERE polarity IS NULL;
    ALTER TABLE core.goals ALTER COLUMN polarity SET NOT NULL;

    -- Data is loaded by load-goals.sql, run as its own psql invocation by
    -- cronjob-schema.yaml — deliberately NOT in this file's transaction. A
    -- malformed goals.csv (bad date, wrong column count, a blanked file)
    -- would otherwise roll back everything else in this script, including
    -- dim_date's daily extension, on every hourly tick until someone
    -- noticed. Splitting it out means a bad CSV fails its own step loudly
    -- (the CronJob still fails, still alerts) without taking unrelated
    -- schema maintenance down with it.

    -- Resolves one row per (metric, date): whichever goals row has the
    -- latest effective_date on or before that date. Cross join against the
    -- distinct metric list rather than a plain join so a metric's goal line
    -- still appears (via the most recent effective_date) on every day in
    -- range, not only on days a new goal happened to start.
    CREATE OR REPLACE VIEW core.goals_by_date AS
    SELECT dd.date,
           gm.metric,
           g.goal_type,
           g.source_metric,
           g.base_metric,
           g.window_days,
           g.goal_text,
           g.value,
           g.unit,
           g.polarity
    FROM core.dim_date dd
    CROSS JOIN (SELECT DISTINCT metric FROM core.goals) gm
    JOIN LATERAL (
        SELECT goal_type, source_metric, base_metric, window_days, goal_text, value, unit, polarity
        FROM core.goals g
        WHERE g.metric = gm.metric AND g.effective_date <= dd.date
        ORDER BY g.effective_date DESC
        LIMIT 1
    ) g ON true
    WHERE dd.date BETWEEN current_date - (365 * 3) AND current_date;

    -- ---------------------------------------------------------------------
    -- Drift detection
    --
    -- The failure mode this schema is otherwise blind to: a source renames a
    -- field, the extraction above yields NULL, and a panel quietly goes flat.
    -- Nothing errors, so nothing tells you. This view turns that silence into
    -- rows you can put on a panel or alert on — a non-zero count means the
    -- payload stopped matching what core expects.
    --
    -- Point a stat panel at `SELECT count(*) FROM core.typing_failures` and it
    -- becomes the smoke alarm for every source at once.
    -- ---------------------------------------------------------------------
    CREATE OR REPLACE VIEW core.typing_failures AS
    SELECT 'raw.health_metrics'      AS relation,
           r.source,
           r.natural_key,
           r.ingested_at,
           r.payload
    FROM raw.health_metrics r
    WHERE r.payload ->> 'metric' IS NULL
       OR NOT (
           jsonb_typeof(r.payload -> 'value') = 'number'
           OR (jsonb_typeof(r.payload -> 'value') = 'string'
               AND r.payload ->> 'value' ~ '[0-9]'
               AND length(translate(r.payload ->> 'value', '0123456789.-', '')) = 0)
       )
    UNION ALL
    SELECT 'raw.todoist_completed_tasks',
           r.source, r.natural_key, r.ingested_at, r.payload
    FROM raw.todoist_completed_tasks r
    WHERE r.payload ->> 'content' IS NULL
    UNION ALL
    SELECT 'raw.todoist_lookups',
           r.source, r.natural_key, r.ingested_at, r.payload
    FROM raw.todoist_lookups r
    WHERE r.payload ->> 'name' IS NULL;

    -- ---------------------------------------------------------------------
    -- mart: dashboard-shaped views
    --
    -- The only layer using PascalCase, and only for output column names, via
    -- quoted aliases. Postgres folds unquoted identifiers to lowercase, so real
    -- PascalCase requires double quotes at every reference forever — a tax
    -- worth paying exactly where a human reads the result (Grafana column
    -- headers, legends) and not worth paying on every join and index beneath.
    -- Object names stay snake_case so `FROM mart.daily_activity` needs no
    -- quoting and pasted SQL keeps working.
    -- ---------------------------------------------------------------------

    -- Activity rings pivoted from long to wide: one row per day, one column per
    -- ring. FILTER rather than CASE because it says what it means, and max()
    -- over a single matching row is just "take it" while tolerating a duplicate
    -- if one ever appears.
    -- Window is 3 years of integer day arithmetic, not `current_date - interval
    -- '3 years'` — subtracting an interval from a date yields a timestamp in
    -- Postgres, which would need a cast back before comparing to d.date (itself
    -- a date). Staying in integers avoids the cast and the DST/leap-year
    -- questions interval math raises, at the cost of drifting a day or so off a
    -- true calendar 3-year mark near a leap year — irrelevant at daily grain.
    CREATE OR REPLACE VIEW mart.daily_activity AS
    SELECT d.date                                                   AS "Date",
           max(h.value) FILTER (WHERE h.metric = 'Move')            AS "MoveCalories",
           max(h.value) FILTER (WHERE h.metric = 'Exercise')        AS "ExerciseMinutes",
           max(h.value) FILTER (WHERE h.metric = 'Stand')           AS "StandMinutes"
    FROM core.dim_date d
    LEFT JOIN core.health_metrics h ON h.observed_on = d.date
    WHERE d.date BETWEEN current_date - (365 * 3) AND current_date
    GROUP BY d.date;

    -- Task throughput per day, on the same spine so days with nothing completed
    -- read as zero rather than disappearing.
    CREATE OR REPLACE VIEW mart.daily_task_completions AS
    SELECT d.date                          AS "Date",
           count(t.task_key)               AS "TasksCompleted"
    FROM core.dim_date d
    LEFT JOIN core.todoist_completed_tasks t ON t.completed_on = d.date
    WHERE d.date BETWEEN current_date - (365 * 3) AND current_date
    GROUP BY d.date;

    -- Same spine-join shape as daily_task_completions above, scoped to tasks
    -- carrying core.todoist_completed_tasks.indicator_next (the 'next' label)
    -- — the feed for the NextTodos*/NextTodoMinutes* goals below.
    -- coalesce(sum(...), 0) rather than bare sum(): sum() over zero matching
    -- rows is NULL, and a NULL day would poison the trailing-window sums in
    -- daily_metric_values below (sum() skips NULLs, silently under-counting
    -- the window instead of correctly counting that day as zero).
    -- time_minutes is itself NULL for a next-task with no Time.* label, and
    -- stays NULL-and-dropped here deliberately: an unlabeled task should
    -- count toward TasksCompletedNext but contribute nothing to
    -- MinutesCompletedNext rather than block the whole day's sum.
    CREATE OR REPLACE VIEW mart.daily_todoist_next AS
    SELECT d.date                                   AS "Date",
           count(t.task_key)                        AS "TasksCompletedNext",
           coalesce(sum(t.time_minutes), 0)::numeric AS "MinutesCompletedNext"
    FROM core.dim_date d
    LEFT JOIN core.todoist_completed_tasks t
        ON t.completed_on = d.date AND t.indicator_next
    WHERE d.date BETWEEN current_date - (365 * 3) AND current_date
    GROUP BY d.date;

    -- Completions resolved to project names. LEFT JOIN on the lookup so a task
    -- in a project we have not ingested yet still counts, labelled rather than
    -- dropped — silently losing rows to a missing dimension row is the classic
    -- way a warehouse under-reports.
    CREATE OR REPLACE VIEW mart.task_completions AS
    SELECT t.completed_on                          AS "Date",
           t.completed_at                          AS "CompletedAt",
           t.content                               AS "Task",
           coalesce(p.name, '(unknown project)')   AS "Project",
           coalesce(s.name, '(no section)')        AS "Section"
    FROM core.todoist_completed_tasks t
    LEFT JOIN core.todoist_projects p ON p.project_id = t.project_id
    LEFT JOIN core.todoist_sections s ON s.section_id = t.section_id;

    -- The cross-source view the spine exists for.
    CREATE OR REPLACE VIEW mart.daily_overview AS
    SELECT a."Date"              AS "Date",
           a."MoveCalories"      AS "MoveCalories",
           a."ExerciseMinutes"   AS "ExerciseMinutes",
           a."StandMinutes"      AS "StandMinutes",
           c."TasksCompleted"    AS "TasksCompleted"
    FROM mart.daily_activity a
    LEFT JOIN mart.daily_task_completions c ON c."Date" = a."Date";

    -- daily_overview pivoted back to long format, keyed by the same
    -- source_metric vocabulary core.goals.source_metric uses ('MoveCalories',
    -- 'ExerciseMinutes', 'StandMinutes', 'TasksCompleted'). Exists so
    -- mart.goal_progress below can join a goal to its actual with one join
    -- condition instead of a FILTER/CASE per metric — add a metric here (and
    -- a matching source_metric value in goals.csv) rather than editing
    -- goal_progress when the next goal-able metric shows up.
    -- The four NextTodos*/NextTodoMinutes* branches below are trailing-window
    -- sums, not single-day values like the branches above them — the goals
    -- that use them ('...PerWeek' / '...PerMonth', see goals-seed.yaml) are
    -- inherently period totals, and core.goals' threshold shape only ever
    -- compares one day's value against a target. Windowing here, at the
    -- series level, is what lets goal_progress stay untouched: each day's
    -- "value" for e.g. NextTodosCompletedTrailing7d already IS the trailing
    -- 7-day count, so the existing single-day threshold comparison is
    -- correct without knowing anything about windows.
    --
    -- ROWS BETWEEN N-1 PRECEDING AND CURRENT ROW gives a true trailing
    -- N-calendar-day sum (not N *matched* rows) only because
    -- mart.daily_todoist_next is built off the core.dim_date spine and so
    -- has exactly one row per calendar day with no gaps — a window frame
    -- counted in rows is only equivalent to one counted in days when the
    -- underlying rows are already gapless and date-ordered.
    CREATE OR REPLACE VIEW mart.daily_metric_values AS
    SELECT "Date" AS date, 'MoveCalories'::text AS source_metric, "MoveCalories" AS value FROM mart.daily_overview
    UNION ALL
    SELECT "Date", 'ExerciseMinutes', "ExerciseMinutes" FROM mart.daily_overview
    UNION ALL
    SELECT "Date", 'StandMinutes', "StandMinutes" FROM mart.daily_overview
    UNION ALL
    SELECT "Date", 'TasksCompleted', "TasksCompleted"::numeric FROM mart.daily_overview
    UNION ALL
    SELECT "Date", 'NextTodosCompletedTrailing7d',
           (sum("TasksCompletedNext") OVER (ORDER BY "Date" ROWS BETWEEN 6 PRECEDING AND CURRENT ROW))::numeric
    FROM mart.daily_todoist_next
    UNION ALL
    SELECT "Date", 'NextTodosCompletedTrailing30d',
           (sum("TasksCompletedNext") OVER (ORDER BY "Date" ROWS BETWEEN 29 PRECEDING AND CURRENT ROW))::numeric
    FROM mart.daily_todoist_next
    UNION ALL
    SELECT "Date", 'NextTodoMinutesTrailing7d',
           sum("MinutesCompletedNext") OVER (ORDER BY "Date" ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)
    FROM mart.daily_todoist_next
    UNION ALL
    SELECT "Date", 'NextTodoMinutesTrailing30d',
           sum("MinutesCompletedNext") OVER (ORDER BY "Date" ROWS BETWEEN 29 PRECEDING AND CURRENT ROW)
    FROM mart.daily_todoist_next;

    -- Multi-window trailing averages for metrics worth watching as a trend
    -- rather than day-to-day, alongside the raw daily value. Wide, not long
    -- like daily_metric_values above: Grafana's Postgres time-series query
    -- turns every numeric column into its own line from one query, so raw +
    -- 3 averages plot together with no Grafana-side transform. One UNION
    -- ALL branch per metric — copy Move's when the next one is ready.
    --
    -- avg(coalesce(value, 0)) rather than bare avg(): matches the
    -- trailing-sum precedent above (mart.daily_todoist_next) — a day with no
    -- observation counts as zero and drags the average down, rather than
    -- being skipped and quietly shrinking the window's denominator. Only
    -- safe because mart.daily_overview is already a gapless dim_date spine,
    -- the same precondition the ROWS BETWEEN trick above depends on.
    --
    -- Known gap, deliberately not fixed yet: this 0-fills across the
    -- *entire* 3-year mart.daily_overview window, not just gaps since a
    -- metric started being tracked. Move's real history happens to fill
    -- that whole window, so it is invisible here — but the next metric
    -- added with a shorter history would have its pre-tracking days wrongly
    -- 0-filled, dragging its early trend lines toward zero. Bound that
    -- branch to its own MIN(date) when such a metric is added, not before.
    --
    -- Polarity comes from core.goals by latest effective_date per
    -- source_metric, not day-resolved like core.goals_by_date above —
    -- polarity is not the kind of thing that changes over time, so full
    -- effective-dating is more machinery than the column needs.
    CREATE OR REPLACE VIEW mart.metric_trends AS
    SELECT o."Date"                                                     AS "Date",
           'MoveCalories'::text                                         AS "Metric",
           o."MoveCalories"                                             AS "Value",
           avg(coalesce(o."MoveCalories", 0)) OVER (ORDER BY o."Date"
               ROWS BETWEEN 29  PRECEDING AND CURRENT ROW)               AS "Avg30d",
           avg(coalesce(o."MoveCalories", 0)) OVER (ORDER BY o."Date"
               ROWS BETWEEN 89  PRECEDING AND CURRENT ROW)               AS "Avg90d",
           avg(coalesce(o."MoveCalories", 0)) OVER (ORDER BY o."Date"
               ROWS BETWEEN 364 PRECEDING AND CURRENT ROW)               AS "Avg365d",
           g.polarity                                                   AS "Polarity"
    FROM mart.daily_overview o
    LEFT JOIN LATERAL (
        SELECT polarity FROM core.goals
        WHERE source_metric = 'MoveCalories'
        ORDER BY effective_date DESC LIMIT 1
    ) g ON true;

    -- Gauge/goal-line feed. One row per (day, goal), both goal_type shapes
    -- unioned into one shape dashboards can filter on "GoalType".
    --
    -- threshold rows carry the day's actual value straight from
    -- daily_metric_values via source_metric.
    --
    -- frequency rows do NOT carry a computed hit-count (see the no-direction
    -- note on core.goals above) — "ActualValue" here is the *base* threshold
    -- metric's actual value for that day, and "BaseGoalValue" is the
    -- threshold it's being compared against. A Grafana panel windows and
    -- counts hits itself: e.g. count days in the trailing WindowDays where
    -- ActualValue crossed BaseGoalValue, then compare that count to
    -- GoalValue. Add a direction column to core.goals first if this ever
    -- needs to be a single pre-computed number instead.
    CREATE OR REPLACE VIEW mart.goal_progress AS
    SELECT gd.date                AS "Date",
           gd.metric               AS "Goal",
           gd.goal_type            AS "GoalType",
           gd.goal_text            AS "GoalText",
           gd.value                AS "GoalValue",
           gd.unit                 AS "Unit",
           mv.value                AS "ActualValue",
           NULL::int               AS "WindowDays",
           NULL::text              AS "BaseGoal",
           NULL::numeric           AS "BaseGoalValue",
           gd.polarity              AS "Polarity"
    FROM core.goals_by_date gd
    LEFT JOIN mart.daily_metric_values mv
        ON mv.source_metric = gd.source_metric AND mv.date = gd.date
    WHERE gd.goal_type = 'threshold'
    UNION ALL
    SELECT gd.date                AS "Date",
           gd.metric               AS "Goal",
           gd.goal_type            AS "GoalType",
           gd.goal_text            AS "GoalText",
           gd.value                AS "GoalValue",
           NULL::text              AS "Unit",
           mv.value                AS "ActualValue",
           gd.window_days          AS "WindowDays",
           gd.base_metric          AS "BaseGoal",
           base.value              AS "BaseGoalValue",
           gd.polarity              AS "Polarity"
    FROM core.goals_by_date gd
    LEFT JOIN core.goals_by_date base
        ON base.metric = gd.base_metric AND base.date = gd.date
    LEFT JOIN mart.daily_metric_values mv
        ON mv.source_metric = base.source_metric AND mv.date = gd.date
    WHERE gd.goal_type = 'frequency';

    -- Drift detection for core.goals, same idea as core.typing_failures:
    -- base_metric and source_metric are plain text, not foreign keys (see the
    -- comment on core.goals), so a typo in goals.csv doesn't error — it just
    -- makes a gauge silently empty. This surfaces those typos as rows instead
    -- of "why is this panel blank." Lives in mart because the source_metric
    -- vocabulary below is mart's (it names mart.daily_metric_values columns),
    -- and core does not depend on mart.
    --
    -- The vocabulary is a literal list, NOT "does a row for this
    -- source_metric currently exist in mart.daily_metric_values" — checking
    -- data presence instead of the schema means an empty daily_overview
    -- (fresh deploy, an ingest outage, a quiet day before any rows land)
    -- would flag every threshold goal as drift even though the names are
    -- fine. Keep this list in sync with the source_metric values
    -- mart.daily_metric_values UNIONs above when a metric is added.
    CREATE OR REPLACE VIEW mart.goal_drift AS
    SELECT 'unknown_base_metric'::text AS issue,
           g.metric                    AS "Goal",
           g.base_metric               AS detail
    FROM core.goals g
    WHERE g.goal_type = 'frequency'
      AND NOT EXISTS (SELECT 1 FROM core.goals b WHERE b.metric = g.base_metric)
    UNION ALL
    SELECT 'unknown_source_metric',
           g.metric,
           g.source_metric
    FROM core.goals g
    WHERE g.goal_type = 'threshold'
      AND g.source_metric NOT IN ('MoveCalories', 'ExerciseMinutes', 'StandMinutes', 'TasksCompleted',
                                   'NextTodosCompletedTrailing7d', 'NextTodosCompletedTrailing30d',
                                   'NextTodoMinutesTrailing7d', 'NextTodoMinutesTrailing30d');

    -- ---------------------------------------------------------------------
    -- Grants
    --
    -- Three roles, three different reaches. lifeos_writer runs this whole file
    -- and therefore needs full DDL rights on everything below — but it is used
    -- for nothing else. Ingestion connects as lifeos_ingest, which can write
    -- and read raw and nothing more: no CREATE, no ALTER, no DROP, no reach
    -- into core or mart. SELECT is granted alongside INSERT because the
    -- documented ingest contract's idempotent-insert check is a subquery
    -- against the very table it is about to write to — write-only would break
    -- that check, not make it safer.
    --
    -- lifeos_reader gets the view layers and nothing else. It is never granted
    -- on raw — and does not need to be: a view executes with its owner's
    -- privileges, not the caller's, so selecting core.health_metrics reads the
    -- underlying table through lifeos_writer's rights. The reader sees curated
    -- data and cannot reach the landing tables at all.
    --
    -- (The core/mart half holds as long as those views are not created WITH
    -- security_invoker, which is off by default. Do not turn it on there
    -- without re-thinking these grants.)
    -- ---------------------------------------------------------------------
    GRANT USAGE ON SCHEMA raw TO lifeos_ingest;
    GRANT SELECT, INSERT ON ALL TABLES IN SCHEMA raw TO lifeos_ingest;

    GRANT USAGE ON SCHEMA core, mart TO lifeos_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA core, mart TO lifeos_reader;

    -- mcp_postgres (the mcp-postgres MCP server) is deliberately NOT granted
    -- here despite reading this same core/mart data — it isn't a LifeOS
    -- consumer, so its access is provisioned by its own independent
    -- automation: kubernetes/apps/database/postgres/app/mcp-postgres-grants.yaml
    -- + cronjob-mcp-postgres-grants.yaml. Keeping it out of this file means
    -- decommissioning or restructuring the LifeOS warehouse app can't
    -- silently strand — or, via this script's --single-transaction, break —
    -- an unrelated app's database access. It still runs as lifeos_writer,
    -- unavoidably (GRANT on these objects can only come from their owner or a
    -- superuser), but that's Postgres' ownership model, not a coupling this
    -- file introduces.

    -- Covers tables and views added by a later run of this same DDL, so
    -- anything new is readable/writable the moment it exists rather than after
    -- someone remembers to re-grant. Reaches only future objects created by
    -- lifeos_writer specifically — the role that runs this file — which is
    -- exactly the role that will create them, so the two line up without
    -- needing an explicit FOR ROLE.
    ALTER DEFAULT PRIVILEGES IN SCHEMA raw
        GRANT SELECT, INSERT ON TABLES TO lifeos_ingest;
    ALTER DEFAULT PRIVILEGES IN SCHEMA core, mart
        GRANT SELECT ON TABLES TO lifeos_reader;
  load-goals.sql: |
    -- Loads core.goals from goals.csv (mounted at /seed by
    -- cronjob-schema.yaml, from the warehouse-goals-seed ConfigMap). Run as
    -- its own psql invocation, deliberately separate from schema.sql's
    -- transaction — see the comment above CREATE TABLE core.goals in
    -- schema.yaml for why. This file's own ON_ERROR_STOP + --single-transaction
    -- give it the same all-or-nothing guarantee schema.sql has, just scoped
    -- to goals data instead of the whole schema.
    --
    -- No dollar-quoted blocks here either, same reason as schema.sql: Flux's
    -- postBuild substitution rewrites `$$` to `$` and would mangle one.
    CREATE TEMP TABLE goals_staging (LIKE core.goals INCLUDING DEFAULTS);

    \copy goals_staging (metric, goal_type, source_metric, base_metric, window_days, effective_date, goal_text, value, unit, polarity) FROM '/seed/goals.csv' WITH (FORMAT csv, HEADER true)

    -- goals.csv is the single source of truth for core.goals, so an empty
    -- load is (almost certainly) a mistake — a blanked file, a bad merge, a
    -- ConfigMap generation hiccup — not a deliberate "delete every goal".
    -- Refuse rather than silently truncating every gauge to empty; \quit 1
    -- fails this step (and therefore the CronJob, so it alerts) before
    -- TRUNCATE ever runs, leaving the existing core.goals data untouched.
    SELECT (count(*) > 0) AS has_rows FROM goals_staging \gset
    \if :has_rows
    \else
        \warn 'load-goals.sql: goals.csv produced 0 rows, refusing to replace core.goals'
        \quit 1
    \endif

    -- core.goals has no CHECK on polarity (see the ALTER comment in
    -- schema.sql for why: ALTER TABLE has no ADD CONSTRAINT IF NOT EXISTS,
    -- and this file can't guard one with a DO block either), so the two
    -- allowed values are enforced here instead, same refuse-before-TRUNCATE
    -- pattern as has_rows above. Checked against trim(polarity), matching
    -- what actually reaches the INSERT below, so a value that would load
    -- fine (incidental whitespace) doesn't fail this check that runs before
    -- it. A genuinely blank field never reaches here at all: goals_staging
    -- is `LIKE core.goals`, which always copies core.goals' NOT NULL on
    -- polarity regardless of INCLUDING/EXCLUDING — \copy itself already
    -- rejects a blank field with its own error. This check exists for the
    -- other failure: a non-blank value that isn't one of the two allowed
    -- strings. "IS NOT NULL AND ... IN (...)" rather than a bare IN as
    -- defense in depth: `NULL IN (...)` is NULL, not false, and bool_and()
    -- silently ignores NULL inputs, which would let a NULL slip past.
    SELECT bool_and(trim(polarity) IS NOT NULL AND trim(polarity) IN ('higher_is_better', 'lower_is_better')) AS polarity_ok
    FROM goals_staging \gset
    \if :polarity_ok
    \else
        \warn 'load-goals.sql: goals.csv has a row with an invalid polarity (must be higher_is_better or lower_is_better)'
        \quit 1
    \endif

    TRUNCATE core.goals;

    -- trim() on the text join keys (metric/source_metric/base_metric/unit),
    -- not case-folding — metric names are deliberately mixed-case identifiers
    -- (e.g. MoveCaloriesPerDay) and folding would break that. This only
    -- guards against invisible whitespace from a copy-paste or a spreadsheet
    -- export, which otherwise breaks the exact-match joins in
    -- core.goals_by_date / mart.goal_progress silently — no error, just a
    -- blank gauge. nullif(..., '') turns a trimmed-to-empty optional field
    -- back into NULL so the goals_shape_by_type CHECK still sees NULL rather
    -- than '' for the column that doesn't apply to a row's goal_type.
    INSERT INTO core.goals (metric, goal_type, source_metric, base_metric, window_days, effective_date, goal_text, value, unit, polarity)
    SELECT trim(metric),
           goal_type,
           nullif(trim(source_metric), ''),
           nullif(trim(base_metric), ''),
           window_days,
           effective_date,
           trim(goal_text),
           value,
           nullif(trim(unit), ''),
           trim(polarity)
    FROM goals_staging;
