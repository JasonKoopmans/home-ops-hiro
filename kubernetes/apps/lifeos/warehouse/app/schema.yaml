---
# The LifeOS warehouse schema, applied by the CronJob in this directory.
#
# Every statement is idempotent — CREATE ... IF NOT EXISTS, CREATE OR REPLACE
# VIEW, and grants that are safe to re-issue. That is what lets the schema be
# reconciled continuously rather than migrated once, so Git and the database
# converge on their own instead of depending on someone remembering to re-run
# something.
#
# Deliberately no dollar-quoted strings anywhere in this SQL. Flux's postBuild
# substitution rewrites `$$` to `$`, so a PL/pgSQL function body would be
# silently mangled on its way into the cluster. If this schema ever needs a
# function or trigger, escape accordingly and test the rendered output first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-schema
data:
  schema.sql: |
    -- ---------------------------------------------------------------------
    -- Layering: thin medallion.
    --
    --   raw   physical, append-only. One row per *observation* of a record,
    --         never an update in place. This is the only layer that cannot be
    --         rebuilt, so it is the only one that is a table.
    --   core  views. Typed, deduplicated, conformed.
    --   mart  views. Shaped for specific dashboards.
    --
    -- core and mart are views rather than materialized tables on purpose. In a
    -- lakehouse each layer is materialized because recompute is expensive and
    -- storage is cheap; in one small Postgres those economics invert, and every
    -- materialized layer becomes a copy to keep in sync and backfill. Promote a
    -- view to MATERIALIZED the day it is measurably slow, not before.
    -- ---------------------------------------------------------------------
    CREATE SCHEMA IF NOT EXISTS raw;
    CREATE SCHEMA IF NOT EXISTS core;
    CREATE SCHEMA IF NOT EXISTS mart;

    -- ---------------------------------------------------------------------
    -- raw: landing tables
    --
    -- Shape is identical for every source, on purpose:
    --   source       which integration produced this ('withings', 'todoist')
    --   natural_key  the source's own stable id for the record
    --   observed_at  when the thing happened, per the source
    --   ingested_at  when we saw it — the axis corrections travel along
    --   payload      the record exactly as the source gave it
    --
    -- payload is jsonb rather than typed columns because personal APIs change
    -- shape without warning. A new field, a renamed one, a type change: none of
    -- them can break ingestion, only the view above it. Typing happens in core,
    -- where it is a one-line edit and no data is at risk.
    -- ---------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS raw.health_metrics (
        ingest_id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source      text        NOT NULL,
        natural_key text        NOT NULL,
        observed_at timestamptz NOT NULL,
        ingested_at timestamptz NOT NULL DEFAULT now(),
        payload     jsonb       NOT NULL
    );

    CREATE TABLE IF NOT EXISTS raw.habit_records (
        ingest_id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source      text        NOT NULL,
        natural_key text        NOT NULL,
        observed_at timestamptz NOT NULL,
        ingested_at timestamptz NOT NULL DEFAULT now(),
        payload     jsonb       NOT NULL
    );

    -- Serves both the "has this changed since we last saw it" check on write
    -- and the DISTINCT ON in the core views on read.
    CREATE INDEX IF NOT EXISTS health_metrics_key_seen
        ON raw.health_metrics (source, natural_key, ingested_at DESC);
    CREATE INDEX IF NOT EXISTS habit_records_key_seen
        ON raw.habit_records (source, natural_key, ingested_at DESC);

    -- Dashboards filter by when things happened, not when we noticed them.
    CREATE INDEX IF NOT EXISTS health_metrics_observed
        ON raw.health_metrics (observed_at DESC);
    CREATE INDEX IF NOT EXISTS habit_records_observed
        ON raw.habit_records (observed_at DESC);

    -- ---------------------------------------------------------------------
    -- core: current state
    --
    -- DISTINCT ON takes the newest observation per record. Because raw keeps
    -- every version, a correction at the source shows up as a new row and this
    -- view starts returning it, while the history stays queryable underneath —
    -- which is the entire reason raw is append-only.
    -- ---------------------------------------------------------------------
    CREATE OR REPLACE VIEW core.health_metrics AS
    SELECT DISTINCT ON (source, natural_key)
           source,
           natural_key,
           observed_at,
           ingested_at,
           observed_at::date AS observed_date,
           payload
    FROM raw.health_metrics
    ORDER BY source, natural_key, ingested_at DESC;

    CREATE OR REPLACE VIEW core.habit_records AS
    SELECT DISTINCT ON (source, natural_key)
           source,
           natural_key,
           observed_at,
           ingested_at,
           observed_at::date AS observed_date,
           payload
    FROM raw.habit_records
    ORDER BY source, natural_key, ingested_at DESC;

    -- The join backbone. Health metrics and habit records are both daily-grain
    -- and the interesting questions cross them ("do I sleep worse on days I
    -- skip the habit?"), which only works against a spine that has every day —
    -- including the days a source recorded nothing. Left-join to this rather
    -- than to each other, or missing days silently vanish from a chart instead
    -- of showing up as the gaps they are.
    --
    -- A view, not a table: generate_series is cheap at this range and a view
    -- can never go stale.
    CREATE OR REPLACE VIEW core.dim_date AS
    SELECT d::date                                  AS date,
           EXTRACT(isodow FROM d)::int              AS iso_dow,
           to_char(d, 'Dy')                         AS dow_name,
           EXTRACT(isodow FROM d)::int >= 6         AS is_weekend,
           date_trunc('week',  d)::date             AS week_start,
           date_trunc('month', d)::date             AS month_start,
           EXTRACT(year FROM d)::int                AS year
    FROM generate_series(date '2020-01-01', current_date, interval '1 day') AS d;

    -- ---------------------------------------------------------------------
    -- mart: dashboard-shaped views
    --
    -- Empty on purpose. A mart view is defined by the question a panel asks,
    -- and no panels exist yet — shipping speculative aggregates here would mean
    -- maintaining SQL nothing reads. Add them as dashboards are built.
    --
    -- The pattern, for when that happens:
    --
    --   CREATE OR REPLACE VIEW mart.daily_sleep AS
    --   SELECT d.date,
    --          (h.payload ->> 'total_sleep_minutes')::numeric AS sleep_minutes
    --   FROM core.dim_date d
    --   LEFT JOIN core.health_metrics h
    --          ON h.observed_date = d.date
    --         AND h.source = 'oura'
    --   WHERE d.date >= current_date - 90;
    --
    -- Note the shape: spine on the left, source on the right, extraction from
    -- jsonb at this layer. Grafana queries mart and never touches raw.
    -- ---------------------------------------------------------------------

    -- ---------------------------------------------------------------------
    -- Grants
    --
    -- The reader gets the view layers and nothing else. It is never granted on
    -- raw — and does not need to be: a view executes with its owner's
    -- privileges, not the caller's, so selecting core.health_metrics reads the
    -- underlying table through lifeos_writer's rights. The reader sees curated
    -- data and cannot reach the landing tables at all.
    --
    -- (This holds as long as the views are not created WITH security_invoker,
    -- which is off by default. Do not turn it on here without re-thinking these
    -- grants.)
    -- ---------------------------------------------------------------------
    GRANT USAGE ON SCHEMA core, mart TO lifeos_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA core, mart TO lifeos_reader;

    -- Covers views added by a later run of this same DDL, so a new mart view is
    -- readable the moment it exists rather than after someone remembers to
    -- re-grant.
    ALTER DEFAULT PRIVILEGES IN SCHEMA core, mart
        GRANT SELECT ON TABLES TO lifeos_reader;
