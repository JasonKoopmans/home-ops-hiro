# writer-password and reader-password hold the same two password VALUES as
# lifeos_writer and lifeos_reader in
# kubernetes/apps/database/postgres/app/lifeos-role-credentials.sops.yaml —
# under different key names and a different shape, not a structural mirror:
# that file is three separate kubernetes.io/basic-auth Secrets (one per role,
# each with username/password keys), this is one Opaque Secret for this app
# holding two of those three roles' passwords under app-specific key names.
# Copied here because Secrets do not cross namespaces. Rotate both files
# together, keeping the values equal — the key names never will be.
#
# Only two of the three CNPG-managed roles appear here, by design:
# writer-password: used only by the schema CronJob in this app. NOT used for
#   ingestion — n8n ingests as lifeos_ingest instead, a narrower role scoped
#   to raw only, so a workflow mistake can write bad rows but cannot run DDL
#   against the schema. lifeos_ingest's credential belongs in the default
#   namespace once n8n's integration exists, not here — nothing in this
#   namespace uses it.
# reader-password: used by Grafana's provisioned data source.
