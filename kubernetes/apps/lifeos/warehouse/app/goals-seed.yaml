---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap_v1.json
# Seed data for core.goals, loaded by cronjob-schema.yaml's second psql step
# (load-goals.sql, in schema.yaml). Editing this file is the entire workflow
# for changing a goal: commit, push, wait for the next hourly CronJob tick (or
# force one — see the comment atop cronjob-schema.yaml). No separate migration
# or apply step.
#
# This file is plaintext in git, not SOPS-encrypted, deliberately — goal
# values aren't secrets. goal_text ends up on dashboards, so keep it to
# workout/task-style targets and tooltip copy; it isn't the place for
# anything you wouldn't want sitting in git history in the clear.
#
# To retire a goal without losing its history, don't delete its row — add a
# new row for the same metric with a new effective_date and the old goal_text/
# value, or just stop referencing that metric in a dashboard. Deleting a row
# here removes it from core.goals on the next reload with no trace beyond git
# history.
#
# Columns match core.goals exactly. Leave source_metric/base_metric/
# window_days blank (not "null" — just empty) for the fields that don't apply
# to a row's goal_type; \copy reads an empty CSV field as SQL NULL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-goals-seed
data:
  goals.csv: |
    metric,goal_type,source_metric,base_metric,window_days,effective_date,goal_text,value,unit
    MoveCaloriesPerDay,threshold,MoveCalories,,,2020-01-01,"Daily Apple Move ring target",950,kcal
    ExerciseMinutesPerDay,threshold,ExerciseMinutes,,,2020-01-01,"Daily Apple Exercise ring target, adjust to your real goal",30,minutes
    StandMinutesPerDay,threshold,StandMinutes,,,2020-01-01,"Daily Apple Stand ring target, adjust to your real goal",90,minutes
    NextTodosCompletedPerWeek,threshold,NextTodosCompletedTrailing7d,,,2020-01-01,"Complete your next todos for the week",5,items
    NextTodosCompletedPerMonth,threshold,NextTodosCompletedTrailing30d,,,2020-01-01,"Complete your next todos for the month",25,items
    NextTodoMinutesCompletedPerWeek,threshold,NextTodoMinutesTrailing7d,,,2020-01-01,"Complete your next todos for the week",60,minutes
    NextTodoMinutesCompletedPerMonth,threshold,NextTodoMinutesTrailing30d,,,2020-01-01,"Complete your next todos for the month",300,minutes
    MoveCaloriesPerDayHitPerWeek,frequency,,MoveCaloriesPerDay,7,2020-01-01,"Hit the Move ring target at least 5 of 7 days this week",5,days
    ExerciseMinutesPerDayHitPerWeek,frequency,,ExerciseMinutesPerDay,7,2020-01-01,"Hit the Exercise ring target at least 5 of 7 days this week",5,days
    StandMinutesPerDayHitPerWeek,frequency,,StandMinutesPerDay,7,2020-01-01,"Hit the Stand ring target at least 5 of 7 days this week",5,days


