---
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec:
  # Keep control-plane and APIs on the latest 1.23 patch stream.
  # spec.version and the net-gateway-api tag in additionalManifests below
  # must move together — the operator only allows one minor step at a
  # time, so bump both to the same minor in the same change.
  version: "1.23"
  # Right-size control-plane CPU requests. The upstream defaults reserve
  # 300m (activator) / 100m (others), but these components idle at 1-2m on
  # this cluster and were the bulk of a scheduling-headroom warning on one
  # node. Memory requests and all limits are preserved, so bursting is
  # unchanged — only the CPU reservation shrinks.
  #
  # 2026-10-04: activator 50m -> 25m, the same as the other components. Measured
  # over 7d it used p99 0.3m / max 0.4m, and at 50m it was the largest reservation
  # left here while hiro-cmp-03 (2 CPU) sat at 95% requested.
  #
  # Two replicas and a PDB that permits one disruption for the two components
  # that sit on the request path. The upstream PDBs are minAvailable: 80%, which
  # rounds up to "all of them" at any replica count below 5, so a node drain
  # could never evict either pod (disruptionsAllowed: 0 even with 2 replicas).
  # Replicas alone do not fix that; the PDB override below does.
  workloads:
    - name: activator
      replicas: 2
      resources:
        - container: activator
          requests:
            cpu: 25m
            memory: 60Mi
          limits:
            cpu: "1"
            memory: 600Mi
    - name: autoscaler
      resources:
        - container: autoscaler
          requests:
            cpu: 25m
            memory: 100Mi
          limits:
            cpu: "1"
            memory: 1000Mi
    - name: controller
      resources:
        - container: controller
          requests:
            cpu: 25m
            memory: 100Mi
          limits:
            cpu: "1"
            memory: 1000Mi
    - name: webhook
      replicas: 2
      resources:
        - container: webhook
          requests:
            cpu: 25m
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 500Mi
  # Overrides the operator's activator-pdb / webhook-pdb by name. minAvailable: 1
  # of 2 replicas = one pod can be evicted at a time, the other keeps serving.
  # If either component is ever scaled back to 1 replica this goes back to
  # blocking drains, so keep it in step with the replicas above.
  podDisruptionBudgets:
    - name: activator-pdb
      minAvailable: 1
      selector:
        matchLabels:
          app: activator
    - name: webhook-pdb
      minAvailable: 1
      selector:
        matchLabels:
          app: webhook
  ingress:
    istio:
      enabled: false
  additionalManifests:
    # Tag's minor (knative-vX.Y.*) must match spec.version's minor above.
    - URL: https://github.com/knative-extensions/net-gateway-api/releases/download/knative-v1.23.0/release.yaml
  config:
    domain:
      # Register ${SECRET_DOMAIN} as the default domain for Knative Services.
      # KServices will get URLs like <name>.<namespace>.${SECRET_DOMAIN} via the external gateway.
      ${SECRET_DOMAIN}: ""
    network:
      ingress-class: gateway-api.ingress.networking.knative.dev
    gateway:
      external-gateways: |
        - class: envoy
          gateway: network/envoy-external
          service: network/envoy-external
      local-gateways: |
        - class: envoy
          gateway: network/envoy-internal
          service: network/envoy-internal
