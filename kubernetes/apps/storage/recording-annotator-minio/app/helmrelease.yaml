---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recording-annotator-minio
spec:
  interval: 1h
  chart:
    spec:
      chart: minio
      # renovate: registryUrl=https://charts.min.io/
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: recording-annotator-minio
        namespace: storage
  upgrade:
    # Skip the chart's post-upgrade `post-job`: it needed quay.io/minio/mc, which answers
    # HTTP 401 to anonymous pulls as of 2026-10-04 and is cached on no node, so the hook
    # hung in ImagePullBackOff and Flux rolled the upgrade back. mcImage now points at
    # docker.io/pgsty/mc, but keep this: the bucket already exists and is never purged,
    # so the hook has nothing to do. See storage/minio.
    #
    # Note the chart's Deployment has NO liveness/readiness probe, so Helm's wait is satisfied by
    # "container started": a Silo that starts and then crash-loops can still read as a successful
    # upgrade. Verify with the runbook's checks, not with Ready=True.
    disableHooks: true
    # TEMPORARY, for the MinIO -> Silo swap and its soak (docs/runbook-minio-silo-swap-recording-annotator.md,
    # decision D1). cluster-apps forces `remediateLastFailure: true` and a values override
    # cannot beat that patch, so a Silo pod that fails to become Ready would make Flux
    # roll the release back to quay.io/minio/minio, an image that no registry serves and
    # that is cached on only 2 of 5 nodes, onto a volume Silo may already have written to.
    # Rollback only follows a failed upgrade action; with the wait off the upgrade is
    # "done" once the Deployment is applied, so a broken Silo pod stays broken IN PLACE
    # (logs intact, old binary never touches the volume) and the operator picks the
    # rollback rung. Cost: the HelmRelease reads Ready even if the pod is not, so watch the
    # pod and RecordingAnnotatorMinioDown, not Flux. Remove these two lines after the soak.
    disableWait: true
  values:
    # Server: Silo (pgsty's maintained community fork of minio/minio, AGPL-3), still deployed with the official
    # minio chart 5.4.0 — the last chart ever published. Upstream minio/minio is archived, quay.io/minio/* answers
    # HTTP 401 to anonymous pulls and Docker Hub minio/minio:RELEASE.2024-12-18 is 404 (2026-10-28), so the old
    # RELEASE.2024-12-18T13-15-44Z image survives only in the kubelet caches of hiro-cmp-03 and -05.
    #
    # The chart hardcodes `docker-entrypoint.sh minio server /export ...`; Silo's entrypoint rewrites a leading
    # `minio` argument to `silo`, so only the image needs overriding. Silo keeps the MINIO_* env, the /minio/*
    # routes (health, metrics), the minio_* metric names and the .minio.sys layout.
    # Runbook: docs/runbook-minio-silo-swap-recording-annotator.md. Qualification: docs/silo-qualification.md.
    #
    # Pin = the qualification result (docs/silo-qualification.md, PR #902): release 2026-10-26, rehearsed on a CSI
    # clone of this volume (data, IAM and format.json identical; old image reopened Silo-touched data).
    # Use the plain image, NOT the -distroless variant: the chart's command is `/bin/sh -ce '...'`.
    #
    # WARNING: rolling back to the original MinIO image is not supported once Silo has written persistent IAM
    # revocation metadata (none exists on this instance; the clone rehearsal reopened cleanly). See "Rollback ladder"
    # in the runbook before reverting this block.
    #
    # MERGE ORDER: merging starts a Recreate upgrade on the volume holding the only copy of the recordings. The
    # cluster-apps patch (kubernetes/flux/cluster/ks.yaml) forces upgrade remediation (rollback to the old image,
    # unpullable except on hiro-cmp-03/05) and a `remediation:` override in THIS file would be overwritten by it, so
    # the guard is `upgrade.disableWait` above, which that patch does not touch (runbook D1). Runbook M4/M7: suspend
    # this HelmRelease and the mirror CronJob BEFORE merging, then `flux resume` is the trigger.
    #
    # tag@digest below (multi-arch index digest): a community fork's tag is not a promise, the digest is. Keep
    # `repository:` and `tag:` adjacent. Renovate does NOT track these two keys on `main` today: the
    # `customManagers` rule that reads them (consecutive `repository:` / `tag:` lines) is added by the shared-instance
    # PR (#900) and applies here only once that merges. Until then bump them by hand, tag and digest together
    # (runbook, post-swap step 4).
    image:
      repository: docker.io/pgsty/silo
      tag: RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7

    # Client image the chart's hook/job containers use (bucket create, users, policies). Unused on upgrade
    # because upgrade.disableHooks is true, but it must stay pullable: a fresh install runs it. Same release
    # string as the server (the two are published together).
    mcImage:
      repository: docker.io/pgsty/mc
      tag: RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8

    # Single-node deployment dedicated to RecordingAnnotator (spec section 9) — deliberately separate from
    # the shared storage/minio instance (Thanos/Loki), which is already capacity-constrained and unrelated
    # in purpose to this app's recordings.
    mode: standalone

    existingSecret: recording-annotator-minio-root-credentials

    # Disable the default console user created by chart post-install jobs
    users: []

    # Post-install hook Job that creates the bucket below. Overriding
    # `resources` replaces the chart default wholesale, so the 128Mi request
    # is restated here rather than inherited.
    makeBucketJob:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi

    # Pre-create the bucket the app expects (RecordingAnnotator README "Deploy")
    buckets:
      - name: recordings
        policy: none
        purge: false

    service:
      type: ClusterIP

    consoleService:
      type: ClusterIP

    persistence:
      enabled: true
      # No recurring Longhorn backup: offsite protection for this bucket is the hourly `mc mirror` CronJob
      # (recording-annotator-mirror-cronjob.yaml) into an Object-Locked AWS S3 bucket — see
      # docs/backup-recovery.md §2. (MinIO server-side replication was tried and abandoned in #420: it cannot
      # target AWS S3.) A recurring Longhorn backup would just double the write cost for no additional
      # protection against the threat that actually matters (ransomware/corruption). The class's
      # snapshot-only group takes a daily local snapshot, and its weekly trim collapses the whole snapshot
      # chain (unmapMarkSnapChainRemoved) — so a local snapshot is a short-lived restore point, never a backup.
      storageClass: longhorn-2-no-backup
      # Start small; grow as real recordings land rather than over-provisioning day one.
      # 2Gi -> 5Gi 2026-10-25: bucket held 1.67Gi (75 objects) of real data, 88% full,
      # no reclaimable space. The chart renders the PVC from this value, so editing it
      # expands the live volume (storageclass allowVolumeExpansion).
      size: 5Gi

    # Recreate, not the chart default RollingUpdate (maxSurge 100%, maxUnavailable
    # 0): one replica on a ReadWriteOnce volume deadlocks a rollout whenever the new
    # pod lands on a different node than the old one (Multi-Attach). Failed that way
    # for storage/minio on 2026-09-28; see the comment there.
    deploymentUpdate:
      type: Recreate

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi

    metrics:
      serviceMonitor:
        enabled: true
        includeNode: true
        interval: 30s
