---
# The Minio chart's own ServiceMonitor/Probe (enabled via helmrelease.yaml
# metrics.serviceMonitor) only cover /minio/v2/metrics/cluster and
# /minio/v2/metrics/node — it doesn't scrape /minio/v2/metrics/bucket, which
# is the only endpoint exposing the per-bucket series. Mirrors the shared
# instance's storage/minio/app/probe-bucket-metrics.yaml, including the trick
# of using Minio itself as the "prober" (it ignores the injected target param
# and returns the requested path) and relying on MINIO_PROMETHEUS_AUTH_TYPE
# being "public" so no bearer token is needed.
#
# This matters more here than it does for the shared instance: the recordings
# bucket is the store of every recording, and its only offsite protection is the
# hourly `mc mirror` CronJob (recording-annotator-mirror-cronjob.yaml) into the
# Object-Locked S3 bucket — the PVC is deliberately longhorn-2-no-backup. That
# CronJob is Flux-managed, and the RecordingAnnotatorMediaMirror* alerts key off
# the CronJob's own status (kube_cronjob_status_last_successful_time), not off
# this endpoint. MinIO server-side replication (minio_bucket_replication_*) was
# abandoned in #420 because it cannot target AWS S3.
#
# What this endpoint still gives us is per-bucket size and object count
# (minio_bucket_usage_total_bytes / minio_bucket_usage_object_total), the
# independent number to compare against the offsite copy before and after the
# MinIO -> Silo swap (docs/runbook-minio-silo-swap-recording-annotator.md).
# Silo keeps the /minio/v2/metrics/* paths and minio_* names.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: recording-annotator-minio-bucket
  namespace: storage
  labels:
    app: minio
spec:
  jobName: recording-annotator-minio-bucket
  prober:
    url: recording-annotator-minio.storage:9000
    path: /minio/v2/metrics/bucket
    scheme: http
  targets:
    staticConfig:
      static:
        - recording-annotator-minio.storage
