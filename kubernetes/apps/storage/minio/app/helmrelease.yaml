---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  interval: 1h
  chart:
    spec:
      chart: minio
      # renovate: registryUrl=https://charts.min.io/
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: storage
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    # The chart's only hook is the post-install/post-upgrade `post-job`, which runs
    # `mc mb --ignore-existing` for `buckets` below. Its chart-pinned image
    # (quay.io/minio/mc) answered HTTP 401 to anonymous pulls as of 2026-10-04 and was
    # cached on no node, so on upgrade the hook sat in ImagePullBackOff, Helm timed out
    # after 5m and Flux rolled the whole release back. The buckets already exist and
    # `purge: false` never removes them, so skipping the hook on upgrade loses nothing.
    # Install still runs it, now with the `mcImage` set below instead of the chart's
    # unpullable default. Keep disableHooks: the upgrade that swaps the server image
    # must not depend on a second image pull succeeding.
    disableHooks: true
    # TEMPORARY, for the MinIO -> Silo swap and its soak (docs/runbook-minio-silo-swap-shared.md,
    # decision D1). cluster-apps forces `remediateLastFailure: true` and a values override
    # cannot beat that patch, so a Silo pod that fails to become Ready would make Flux
    # roll the release back to quay.io/minio/minio, an image that no registry serves and
    # that is cached on only 2 of 5 nodes, onto a volume Silo may already have written to.
    # Rollback only follows a failed upgrade action; with the wait off the upgrade is
    # "done" once the Deployment is applied, so a broken Silo pod stays broken IN PLACE
    # (logs intact, old binary never touches the volume) and the operator picks the
    # rollback rung. Cost: the HelmRelease reads Ready even if the pod is not, so watch the
    # pod and MinioDown, not Flux. Remove these two lines after the soak.
    disableWait: true
    remediation:
      retries: 3
  values:
    # Single-node deployment suitable for homelab; no distributed mode overhead
    mode: standalone

    # Silo (github.com/pgsty/silo, AGPL-3), the maintained community fork of MinIO.
    # Upstream minio/minio is archived: chart 5.4.0 (the last ever published) pins
    # quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z, which answers 401 to anonymous
    # pulls, 404 on Docker Hub, and was cached on only 2 of 5 nodes. The chart's command
    # is `/usr/bin/docker-entrypoint.sh minio server ...`; Silo's entrypoint rewrites a
    # leading `minio` argument to `silo`, so only the image needs to change. `MINIO_*`
    # env, `/minio/*` routes, `minio_*` metrics and the `.minio.sys` layout are kept.
    #
    # THIS IS A ONE-WAY UPGRADE. Once Silo has written persistent IAM revocation
    # metadata into `.minio.sys`, a rolling downgrade is unsupported, so never let
    # Flux "roll back" this release: see docs/runbook-minio-silo-swap-shared.md before
    # merging, and before touching these two lines afterwards. Renovate bumps are held
    # for approval on the Dependency Dashboard for the same reason (.renovaterc.json5).
    #
    # Tag AND index digest are pinned (`<tag>@sha256:<digest>`); the chart renders
    # `image: "<repository>:<tag>"`, so the string passes through unchanged. Digest is
    # the multi-arch index, which keeps the pin valid on amd64 and arm64.
    # GATE: final release pin comes from docs/silo-qualification.md; RELEASE.2026-10-26
    # is the candidate (2026-10-28), alternatives 2026-10-18 / 2026-09-16 / 2026-08-06.
    image:
      repository: docker.io/pgsty/silo
      tag: RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7

    # Client image of the chart's makeBucketJob (post-install hook, so INSTALL only:
    # disableHooks skips it on upgrade). The chart's own default tag is on
    # quay.io/minio/mc, which is no longer pullable anonymously; without this override
    # a fresh install of this release would sit in ImagePullBackOff.
    mcImage:
      repository: docker.io/pgsty/mc
      tag: RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8

    # Read rootUser and rootPassword from the existing SOPS-encrypted secret
    existingSecret: minio-root-credentials

    # Disable the default console user created by chart post-install jobs
    users: []

    # Post-install hook Job that creates the buckets below. Overriding
    # `resources` replaces the chart default wholesale, so the 128Mi request
    # is restated here rather than inherited.
    makeBucketJob:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi

    # Pre-create buckets on first deploy
    buckets:
      - name: observability-thanos
        policy: none
        purge: false
      - name: observability-loki
        policy: none
        purge: false

    service:
      type: ClusterIP

    consoleService:
      type: ClusterIP

    persistence:
      enabled: true
      storageClass: longhorn-2-no-backup
      # Stayed at 50Gi after two failed growth attempts (2026-07-19, see
      # docs/incident-thanos-compactor-disk-pressure.md #7): one of this
      # volume's 2 replicas lives on hiro-cmp-01/disk-1, a disk shared by 8
      # other volumes and already near its scheduled-capacity ceiling
      # (~6.7GB real headroom via Longhorn's ScheduledTotal check, not the
      # ~17.8GB raw StorageAvailable figure that first looked promising). The
      # transient space a stuck compaction group actually needed (~35-40GB:
      # 7 source blocks totaling ~19.7GB, plus the new merged block) was far
      # beyond what that disk could ever provide without relocating a
      # replica. The stuck group ages out of the 7d raw retention window on
      # 2026-07-23 and gets deleted outright instead of compacted, so this
      # self-resolves without a PVC change. A real permanent fix (if
      # capacity pressure recurs) means evicting/rebuilding the
      # hiro-cmp-01 replica onto a roomier node (hiro-cmp-02 or -04 both had
      # >25GB scheduled headroom at the time), not just bumping this number.
      # 2026-07-24: Storage added to cluster, evicted volume relica from hiro-cmp-01/disk-1,
      # and minio-bucket-quota-bootstrap Job re-run successfully. Grew the PVC to 120Gi to give more headroom for future compactions
      size: 120Gi

    # Recreate, not the chart default RollingUpdate (maxSurge 100%, maxUnavailable
    # 0). One replica on a ReadWriteOnce Longhorn volume cannot roll that way: the
    # new pod starts while the old one still holds the volume and the old one only
    # stops once the new one is Ready, so a new pod scheduled onto a different node
    # sits in ContainerCreating on "Multi-Attach error" until Helm's timeout and
    # Flux rolls back. 2026-09-28: the memory-limit bump below put three successive
    # new pods on hiro-cmp-03/05/05 against an old pod on hiro-cmp-04, so the bump
    # never applied (the pod still ran the old 1Gi limit).
    deploymentUpdate:
      type: Recreate

    # Measured 2026-09-28: 7d peak 918Mi against a 1Gi limit (90%), bumped to 1408Mi.
    # 2026-10-30, for the Silo swap: the 2024 binary's 14d peak under real load is now
    # 1051Mi (75% of 1408Mi). In the clone rehearsal (docs/runbook-minio-silo-swap-shared.md
    # section 9) Silo peaked at 407-428Mi against 310Mi for the old binary on the same
    # data, at little client load, so Silo's peak under Thanos/Loki traffic is UNMEASURED
    # and could sit near the old limit. Raised to ~2x the old peak (repo convention) so an
    # OOM cannot be the swap's failure mode; with `disableWait` Flux would not report it.
    # Revisit: after the first week on Silo, read max_over_time(container_memory_working_set_bytes
    # {namespace="storage",pod=~"minio-.*",container="minio"}[7d]) and size to ~2x that.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 2Gi

    metrics:
      serviceMonitor:
        enabled: true
        # Standalone mode has one node, but this also scrapes per-drive/process
        # metrics (S3 request errors, uptime) not present in the cluster-level Probe.
        includeNode: true
        interval: 30s
