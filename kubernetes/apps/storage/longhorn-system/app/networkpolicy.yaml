---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
spec:
  # Companion to the chart's own `longhorn-manager` policy, which
  # networkPolicies.restrictInternalTraffic renders. That policy allows ingress
  # only from Longhorn's own pods inside this namespace and makes no allowance
  # for metrics scraping, so enabling it silently blackholes Prometheus: scrapes
  # of :9500 are dropped rather than refused, `up{job="longhorn-backend"}` goes
  # to 0, and LonghornManagerDown fires critical while Longhorn is perfectly
  # healthy. NetworkPolicies are additive, so this grants the one exception
  # without modifying the chart's policy.
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    # Scoped to the Prometheus pods specifically, not the whole monitoring
    # namespace — 9500 serves the Longhorn manager REST API, not just /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9500
          protocol: TCP
